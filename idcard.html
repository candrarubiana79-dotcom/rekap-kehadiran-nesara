<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cetak ID Card QR Siswa - SMPN 1 RANCAH</title>
  
  <!-- SKRIP PENGAMAN & AUTO LOGOUT -->
  <script src="auth-guard.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Library untuk ID Card, QR Code & File Download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    
    /* Ukuran ID Card Presisi Standar KTP Landscape (85.6mm x 53.9mm) */
    .id-card {
      width: 85.6mm;
      height: 53.9mm;
      box-sizing: border-box;
      flex-shrink: 0;
      page-break-inside: avoid;
    }

    /* TATA LETAK CETAK MEDIA A4 */
    @media print {
      body {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .no-print,
      .fixed,
      #statusDataMaster,
      #cardSummaryBox,
      #progressBox,
      .panel-control {
        display: none !important;
      }
      .main-container {
        border: none !important;
        box-shadow: none !important;
        background: none !important;
        padding: 0 !important;
        max-width: 100% !important;
      }
      #cardContainer {
        display: grid !important;
        grid-template-columns: repeat(2, 85.6mm) !important;
        gap: 5mm !important;
        padding: 10mm !important;
        max-height: none !important;
        overflow: visible !important;
        border: none !important;
        background: none !important;
        justify-content: start !important;
      }
      .card-wrapper {
        page-break-inside: avoid !important;
      }
      .btn-download-single {
        display: none !important;
      }
      .id-card {
        box-shadow: none !important;
        border: 0.4mm solid #000000 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex items-center justify-center p-3 sm:p-4 md:p-6 relative overflow-x-hidden selection:bg-indigo-500 selection:text-white">

  <!-- Background Decorative Light Orbs -->
  <div class="fixed -top-32 -left-32 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none no-print"></div>
  <div class="fixed -bottom-32 -right-32 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none no-print"></div>

  <!-- CONTAINER UTAMA CETAK ID CARD -->
  <div class="main-container w-full max-w-5xl bg-white/95 backdrop-blur-xl p-5 sm:p-6 md:p-8 rounded-3xl shadow-2xl border border-white/20 space-y-6 relative z-10">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b pb-5 border-slate-100 no-print">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-lg font-bold">
          <i class="fa-solid fa-id-card"></i>
        </div>
        <div>
          <h2 class="text-lg font-extrabold text-slate-900 leading-tight">Cetak & Download ID Card QR</h2>
          <p class="text-xs font-bold text-indigo-600 uppercase tracking-wider">SMPN 1 RANCAH</p>
        </div>
      </div>
      <a href="tools.html" class="text-xs font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-3 py-2 rounded-xl transition flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-left"></i> Kembali
      </a>
    </div>

    <!-- INDIKATOR STATUS DATA -->
    <div id="statusDataMaster" class="p-3.5 rounded-2xl text-xs font-bold flex items-center justify-center gap-2 bg-amber-50 text-amber-800 border border-amber-200 no-print">
      <i class="fa-solid fa-spinner fa-spin text-amber-600 text-sm"></i>
      <span>Sedang memuat data master siswa...</span>
    </div>

    <!-- PANEL FILTER & ACTION BUTTONS -->
    <div class="panel-control bg-slate-50 p-5 rounded-2xl border border-slate-200/80 space-y-4 no-print">
      <div class="grid grid-cols-1 sm:grid-cols-12 gap-3 items-end">
        <div class="sm:col-span-4">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Pilih Kelas ID Card</label>
          <select id="selectKelasQr" disabled
            class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-indigo-500 focus:outline-none disabled:bg-slate-100 disabled:text-slate-400">
            <option value="">-- Sedang Memuat Data... --</option>
          </select>
        </div>

        <div class="sm:col-span-3">
          <button type="button" id="btnGenerate" onclick="generateCards()" disabled class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed text-white font-bold py-2.5 px-3 rounded-xl text-xs transition shadow-md shadow-indigo-500/20 flex items-center justify-center gap-2">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Card
          </button>
        </div>

        <div class="sm:col-span-2">
          <button type="button" id="btnCetakA4" onclick="window.print()" disabled 
            class="w-full bg-indigo-800 hover:bg-indigo-900 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed text-white font-bold py-2.5 px-3 rounded-xl text-xs transition flex items-center justify-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-print"></i> Cetak A4
          </button>
        </div>

        <div class="sm:col-span-3">
          <button type="button" id="btnDownloadZip" onclick="downloadAllZip()" disabled 
            class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed text-white font-bold py-2.5 px-3 rounded-xl text-xs transition flex items-center justify-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-file-zipper"></i> ZIP All
          </button>
        </div>
      </div>

      <div id="progressBox" class="hidden p-3 rounded-xl bg-indigo-50 border border-indigo-200 text-xs text-indigo-900 font-mono text-center font-bold">
        ⏳ Mengonversi: <span id="progressText">0</span> / <span id="totalText">0</span> ID Card...
      </div>
    </div>

    <!-- SUMMARY INFO -->
    <div id="cardSummaryBox" class="hidden flex items-center justify-between text-xs font-bold px-4 py-2.5 bg-slate-100 rounded-xl text-slate-700 border border-slate-200 no-print">
      <span id="cardSummaryText">Menampilkan ID Card Siswa...</span>
      <span class="text-[10px] bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full uppercase tracking-wider">Ready to Download / Print</span>
    </div>

    <!-- KONTEN HASIL GENERATE CARD -->
    <div id="cardContainer" class="flex flex-wrap gap-6 justify-center max-h-[560px] overflow-y-auto p-4 border border-slate-200/60 rounded-2xl bg-slate-50/50">
      <div id="emptyCardState" class="text-center py-12 px-4 space-y-3">
        <div class="w-16 h-16 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto text-2xl">
          <i class="fa-solid fa-id-card"></i>
        </div>
        <div>
          <h4 class="text-sm font-bold text-slate-700">Belum Ada Kartu Dibuat</h4>
          <p class="text-xs text-slate-400 mt-1 max-w-xs mx-auto">Silakan pilih kelas terlebih dahulu, lalu klik tombol <b>Generate Card</b>.</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzq05A9BpVJFjNkHn7p2QDjbaY2ajsWjVXk5sVDkH3rStFaAC5XgEkndZSg39zOLX_2/exec";
    let masterSiswa = [];
    let generatedSiswaList = [];

    document.addEventListener("DOMContentLoaded", () => {
      loadMasterData();
    });

    function loadMasterData() {
      const statusBox = document.getElementById("statusDataMaster");
      const selectKelasQr = document.getElementById("selectKelasQr");
      const btnGenerate = document.getElementById("btnGenerate");

      fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
          masterSiswa = data.master || [];
          populateKelas();

          statusBox.className = "p-3.5 rounded-2xl text-xs font-bold flex items-center justify-center gap-2 bg-emerald-50 text-emerald-800 border border-emerald-200";
          statusBox.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600 text-sm"></i> <span>Data master siswa siap digunakan!</span>';
          
          selectKelasQr.disabled = false;
          btnGenerate.disabled = false;
        })
        .catch(err => {
          statusBox.className = "p-3.5 rounded-2xl text-xs font-bold flex items-center justify-center gap-2 bg-rose-50 text-rose-800 border border-rose-200";
          statusBox.innerHTML = '<i class="fa-solid fa-circle-xmark text-rose-600 text-sm"></i> <span>Gagal memuat data! Periksa koneksi internet Anda.</span>';
        });
    }

    function populateKelas() {
      const selectKelasQr = document.getElementById("selectKelasQr");
      let setKelas = new Set();
      masterSiswa.forEach(s => { if(s.kelas) setKelas.add(s.kelas); });
      
      selectKelasQr.innerHTML = '<option value="">-- Pilih Kelas --</option>';

      const optSemua = document.createElement("option");
      optSemua.value = "SEMUA";
      optSemua.textContent = "🌟 Tampilkan Semua Kelas";
      selectKelasQr.appendChild(optSemua);

      [...setKelas].sort().forEach(k => {
        const opt = document.createElement("option");
        opt.value = k;
        opt.textContent = `Kelas ${k}`;
        selectKelasQr.appendChild(opt);
      });
    }

    function generateCards() {
      const container = document.getElementById("cardContainer");
      const filterKelas = document.getElementById("selectKelasQr").value;
      const btnDownloadZip = document.getElementById("btnDownloadZip");
      const btnCetakA4 = document.getElementById("btnCetakA4");
      const summaryBox = document.getElementById("cardSummaryBox");
      const summaryText = document.getElementById("cardSummaryText");

      if (!filterKelas) {
        alert("Silakan pilih kelas terlebih dahulu sebelum membuat ID Card!");
        return;
      }

      container.innerHTML = "";

      if (filterKelas === "SEMUA") {
        generatedSiswaList = masterSiswa;
      } else {
        generatedSiswaList = masterSiswa.filter(s => s.kelas === filterKelas);
      }

      if (generatedSiswaList.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10">
            <i class="fa-solid fa-folder-open text-slate-300 text-3xl mb-2"></i>
            <p class="text-xs text-slate-500 font-semibold">Tidak ada data siswa ditemukan untuk kelas ini.</p>
          </div>`;
        btnDownloadZip.disabled = true;
        btnCetakA4.disabled = true;
        summaryBox.classList.add("hidden");
        return;
      }

      summaryBox.classList.remove("hidden");
      summaryText.textContent = `Menampilkan ${generatedSiswaList.length} ID Card (${filterKelas === 'SEMUA' ? 'Semua Kelas' : 'Kelas ' + filterKelas})`;
      btnDownloadZip.disabled = false;
      btnCetakA4.disabled = false;

      generatedSiswaList.forEach((siswa, index) => {
        const wrapper = document.createElement("div");
        wrapper.className = "card-wrapper flex flex-col items-center gap-2 transition-all transform hover:-translate-y-1";

        wrapper.innerHTML = `
          <div id="card-${index}" class="id-card bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 rounded-xl border border-indigo-500/80 p-2.5 shadow-xl flex flex-col justify-between relative overflow-hidden text-white">
            <div class="absolute -right-4 -bottom-4 w-20 h-20 bg-indigo-500/10 rounded-full blur-xl pointer-events-none"></div>

            <!-- Header Kartu -->
            <div class="border-b border-indigo-400/30 pb-1 flex items-center justify-between z-10">
              <div>
                <h2 class="text-[9px] font-black tracking-widest text-indigo-300 uppercase leading-tight">SMPN 1 RANCAH</h2>
                <p class="text-[6.5px] text-slate-300 font-bold tracking-wider uppercase leading-tight">Kartu Presensi Digital</p>
              </div>
              <span class="bg-indigo-600 text-white font-black text-[7.5px] px-2 py-0.5 rounded-full uppercase tracking-wider">
                ${siswa.kelas}
              </span>
            </div>

            <!-- Body Kartu: QR & Info Siswa -->
            <div class="flex items-center gap-2.5 my-auto z-10">
              <div class="bg-white p-1.5 rounded-lg shadow-md border border-indigo-300 flex-shrink-0">
                <div id="qrcode-${index}"></div>
              </div>
              <div class="flex-1 min-w-0 text-left space-y-0.5">
                <p class="text-[6.5px] font-bold text-indigo-400 uppercase tracking-wider">Nama Siswa</p>
                <h3 class="text-[9.5px] font-extrabold text-white uppercase leading-tight truncate">${siswa.nama}</h3>
                <p class="text-[6.5px] font-bold text-indigo-400 uppercase tracking-wider mt-1">NISN</p>
                <p class="text-[9px] font-mono font-bold text-slate-200 leading-tight">${siswa.nisn}</p>
              </div>
            </div>

            <!-- Footer Kartu -->
            <div class="bg-slate-950/80 px-2 py-0.5 rounded border border-slate-800 text-center z-10 flex justify-between items-center text-[6px] font-semibold text-slate-400">
              <span>Presensi QR Code</span>
              <span class="text-indigo-400 font-bold">Tahun 2026</span>
            </div>
          </div>

          <button type="button" onclick="downloadSingleCard(${index}, '${siswa.nama}')" 
            class="btn-download-single w-full text-[10px] bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-slate-700/80 px-2.5 py-1 rounded-lg font-bold transition flex items-center justify-center gap-1 shadow-sm">
            <i class="fa-solid fa-download text-[9px]"></i> Unduh PNG
          </button>
        `;

        container.appendChild(wrapper);

        new QRCode(document.getElementById(`qrcode-${index}`), {
          text: String(siswa.nisn),
          width: 65,
          height: 65,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      });
    }

    function downloadSingleCard(index, namaSiswa) {
      const cardElem = document.getElementById(`card-${index}`);
      html2canvas(cardElem, { scale: 3, useCORS: true, logging: false }).then(canvas => {
        const link = document.createElement("a");
        link.download = `ID_CARD_${namaSiswa.replace(/\s+/g, "_")}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    }

    async function downloadAllZip() {
      const filterKelas = document.getElementById("selectKelasQr").value;
      if (generatedSiswaList.length === 0) return;

      const zip = new JSZip();
      const progressBox = document.getElementById("progressBox");
      const progressText = document.getElementById("progressText");
      const totalText = document.getElementById("totalText");

      progressBox.classList.remove("hidden");
      totalText.textContent = generatedSiswaList.length;

      for (let i = 0; i < generatedSiswaList.length; i++) {
        const siswa = generatedSiswaList[i];
        const cardElem = document.getElementById(`card-${i}`);

        if (cardElem) {
          const canvas = await html2canvas(cardElem, { scale: 3, useCORS: true, logging: false });
          const imgData = canvas.toDataURL("image/png").split(",")[1];
          const fileName = `Kelas_${siswa.kelas}/${siswa.nisn}_${siswa.nama.replace(/\s+/g, "_")}.png`;
          zip.file(fileName, imgData, { base64: true });
        }
        progressText.textContent = i + 1;
      }

      progressBox.innerHTML = "⚡ Menyusun file ZIP, harap tunggu sebentar...";
      zip.generateAsync({ type: "blob" }).then(content => {
        saveAs(content, `ID_Card_Siswa_${filterKelas || 'Master'}.zip`);
        progressBox.classList.add("hidden");
      });
    }
  </script>
</body>
</html>
