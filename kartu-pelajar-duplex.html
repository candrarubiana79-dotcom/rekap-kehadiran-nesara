<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cetak Kartu Pelajar (Depan / Belakang / Duplex) - SMPN 1 Rancah (v3.3)</title>
  
  <!-- SKRIP PENGAMAN & AUTO LOGOUT -->
  <script src="auth-guard.js"></script>

  <!-- Library Parser CSV & HTML2Canvas -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Library Generator QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; padding: 20px; color: #334155; min-height: 100vh; }
    
    .app-layout { display: flex; gap: 20px; max-width: 1500px; margin: 0 auto; align-items: flex-start; }

    /* PANEL KONTROL KIRI */
    .panel-control {
      width: 440px; flex-shrink: 0; background: #ffffff; padding: 20px;
      border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      border: 1px solid #e2e8f0; max-height: calc(100vh - 40px); overflow-y: auto;
      position: sticky; top: 20px;
    }
    .panel-control h2 { font-size: 18px; margin-bottom: 12px; color: #0f172a; font-weight: 800; display: flex; align-items: center; justify-content: space-between; }
    
    .status-box { padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; margin-bottom: 14px; }
    .status-box.loading { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .status-box.ready { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .status-box.error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    
    .section-title { font-size: 11px; font-weight: 800; text-transform: uppercase; color: #0284c7; letter-spacing: 0.5px; margin-bottom: 8px; border-bottom: 2px solid #e2e8f0; padding-bottom: 4px; margin-top: 10px; }
    
    .grid-form { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group.full-width { grid-column: span 2; }
    .form-group label { font-size: 10.5px; font-weight: 700; color: #64748b; margin-bottom: 3px; text-transform: uppercase; display: flex; justify-content: space-between; }
    .form-group label span { color: #0284c7; font-weight: 800; }
    .form-group select, .form-group textarea, .form-group input { padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 11px; font-weight: 600; outline: none; }
    .form-group input[type="range"] { accent-color: #0284c7; cursor: pointer; margin-top: 2px; }
    .form-group textarea { height: 60px; resize: vertical; }

    .action-buttons { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .btn { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 800; font-size: 11px; flex: 1; height: 34px; text-align: center; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
    .btn-download { background: #0284c7; color: #fff; }
    .btn-download:hover { background: #0369a1; }
    .btn-cetak { background: #16a34a; color: #fff; }
    .btn-cetak:hover { background: #15803d; }
    .btn-reset { background: #64748b; color: #fff; }
    .btn-reset:hover { background: #475569; }
    .badge-v { background: #0284c7; color: #ffffff; font-size: 10px; padding: 2px 8px; border-radius: 12px; font-weight: 800; }

    /* AREA PREVIEW KANAN */
    .preview-section { flex: 1; background: #1e293b; border-radius: 16px; padding: 20px; border: 1px solid #334155; min-height: calc(100vh - 40px); display: flex; flex-direction: column; align-items: center; }
    .preview-header { width: 100%; color: #f8fafc; font-size: 14px; font-weight: 800; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }

    .page-sheet {
      background: white; padding: 8mm; margin-bottom: 20px; border-radius: 8px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3); display: grid;
      grid-template-columns: repeat(2, 85.6mm); gap: 4mm 6mm; justify-content: center;
    }

    .page-title-tag {
      grid-column: span 2; font-size: 10px; font-weight: 800; text-transform: uppercase;
      color: #0284c7; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; margin-bottom: 4px;
    }

    /* DESAIN DEPAN KARTU (85.6mm x 53.9mm) */
    .kartu-container-depan {
      width: 85.6mm; height: 53.9mm;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
      border: 1px solid #0080d6; border-radius: 3.2mm; position: relative;
      overflow: hidden; flex-shrink: 0; page-break-inside: avoid; box-sizing: border-box;
    }
    .header-depan {
      background: linear-gradient(90deg, #0091ea 0%, #0060a8 100%);
      color: white; text-align: center; padding: 1.2mm 9mm; position: relative;
      border-bottom: 0.8mm solid #dc2626;
    }
    .logo-left { position: absolute; left: 1.5mm; top: 50%; transform: translateY(-50%); width: 8mm; height: 8mm; object-fit: contain; }
    .logo-right { position: absolute; right: 1.5mm; top: 50%; transform: translateY(-50%); width: 8.2mm; height: 8.2mm; object-fit: contain; }
    .header-depan .pemda, .header-depan .dinas { font-size: 6.2px; font-weight: 700; text-transform: uppercase; color: #ffffff; }
    .header-depan .sekolah { font-size: 10.5px; font-weight: 900; margin: 0.2mm 0; text-transform: uppercase; color: #ffffff; }
    .header-depan .alamat { font-size: 4.8px; font-weight: 500; color: #f0f9ff; }
    .judul-kartu { text-align: center; font-size: 9.5px; font-weight: 900; letter-spacing: 1.5px; margin: 0.8mm 0; color: #0f172a; text-transform: uppercase; }
    
    .content-depan { display: flex; padding: 0 2.8mm; position: relative; z-index: 2; gap: 2mm; align-items: flex-start; }
    .foto-box { width: 17.5mm; height: 23mm; border: 0.5mm solid #facc15; border-radius: 1.2mm; background: #f1f5f9; object-fit: cover; flex-shrink: 0; }
    .data-box { flex-grow: 1; background: rgba(255, 255, 255, 0.96); border: 0.35mm solid #dc2626; border-radius: 1.5mm; padding: 1.2mm 1.8mm; }
    .data-row { display: flex; margin-bottom: 0.3mm; font-size: 5pt; }
    .data-label { width: 22mm; color: #334155; font-weight: 700; }
    .data-separator { width: 1.5mm; color: #dc2626; font-weight: bold; }
    .data-value { flex: 1; color: #0f172a; font-weight: 600; text-transform: uppercase; }

    /* TTD & STEMPEL CAP */
    .ttd-section { position: absolute; right: 3mm; bottom: 1.2mm; z-index: 3; color: #0f172a; }
    .ttd-box { position: relative; text-align: left; font-size: 5.8px; line-height: 1.15; }
    .ttd-space { height: 5.5mm; }
    .img-stempel { position: absolute; height: auto; opacity: 0.88; z-index: 2; mix-blend-mode: multiply; pointer-events: none; transition: all 0.05s ease; }
    .img-ttd { position: absolute; height: auto; z-index: 1; pointer-events: none; transition: all 0.05s ease; }
    .nama-kepsek { font-size: 6.8px; font-weight: 800; text-decoration: underline; position: relative; z-index: 3; }
    .nip-kepsek { font-size: 5.8px; position: relative; z-index: 3; }

    .bg-wave-back { position: absolute; bottom: 0; right: 0; width: 100%; height: 48%; background: #facc15; clip-path: polygon(0 75%, 100% 15%, 100% 100%, 0% 100%); z-index: 1; }
    .bg-wave-front { position: absolute; bottom: 0; right: 0; width: 100%; height: 38%; background: #0091ea; clip-path: polygon(0 85%, 100% 30%, 100% 100%, 0% 100%); z-index: 1; }

    /* DESAIN BELAKANG KARTU (85.6mm x 53.9mm) */
    .kartu-container-belakang {
      width: 85.6mm; height: 53.9mm;
      background: linear-gradient(135deg, #ffffff 0%, #f0f9ff 100%);
      border: 1px solid #0284c7; border-radius: 3.2mm; position: relative;
      overflow: hidden; flex-shrink: 0; page-break-inside: avoid; box-sizing: border-box;
      padding: 2.2mm 2.8mm; display: flex; flex-direction: column; justify-content: space-between;
    }
    .watermark-logo { position: absolute; top: 52%; left: 32%; transform: translate(-50%, -50%); width: 32mm; height: 32mm; opacity: 0.08; object-fit: contain; pointer-events: none; }
    .header-belakang { display: flex; align-items: center; gap: 2mm; border-bottom: 0.4mm solid #0284c7; padding-bottom: 0.8mm; margin-bottom: 0.8mm; }
    .logo-header-belakang { width: 6.8mm; height: 6.8mm; object-fit: contain; }
    .header-belakang .title { font-size: 7pt; font-weight: 900; color: #0f172a; text-transform: uppercase; }
    .header-belakang .sub { font-size: 4.5pt; font-weight: 800; color: #0284c7; text-transform: uppercase; }
    
    .body-belakang { display: flex; gap: 2mm; flex: 1; align-items: center; position: relative; z-index: 2; }
    .rules-list { flex: 1; font-size: 4pt; color: #0f172a; line-height: 1.3; padding-left: 3.2mm; }
    .qr-section { width: 26mm; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ffffff; padding: 1mm; border: 0.35mm solid #0284c7; border-radius: 1.6mm; }
    .qr-box { width: 22mm; height: 22mm; }
    .qr-box img { width: 100% !important; height: 100% !important; }
    .qr-label { font-size: 3.4pt; font-weight: 800; color: #0f172a; margin-top: 0.6mm; text-align: center; text-transform: uppercase; }
    .footer-belakang { background: #0f172a; color: #ffffff; text-align: center; font-size: 3.8pt; font-weight: 600; padding: 0.7mm; border-radius: 0.8mm; }

    /* MEDIA PRINT A4 & F4 BOLAK BALIK */
    @media print {
      body { background: #ffffff !important; padding: 0 !important; margin: 0 !important; }
      .panel-control, .preview-header { display: none !important; }
      .app-layout { display: block !important; }
      .preview-section { background: none !important; border: none !important; padding: 0 !important; }
      .page-sheet {
        box-shadow: none !important; border-radius: 0 !important; padding: 0 !important; margin: 0 !important;
        page-break-after: always !important; break-after: page; display: grid !important;
        grid-template-columns: repeat(2, 85.6mm) !important; gap: 4mm 6mm !important; justify-content: start !important;
      }
      .page-title-tag { display: none !important; }
      .kartu-container-depan, .kartu-container-belakang { box-shadow: none !important; border-color: #000 !important; page-break-inside: avoid !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <!-- PANEL KONTROL KIRI -->
    <div class="panel-control">
      <div style="display: flex; gap: 8px; margin-bottom: 14px;">
        <a href="tools.html" class="btn btn-reset">← Kembali ke Tools</a>
      </div>

      <h2>
        <span>Cetak Kartu Pelajar</span>
        <span class="badge-v">v3.3</span>
      </h2>
      
      <div id="statusIndikator" class="status-box loading">Memuat data siswa...</div>

      <!-- TAHAP 1: LEGALITAS & UPLOAD -->
      <div class="section-title">1. Legalitas & File Gambar</div>
      <div class="grid-form">
        <div class="form-group full-width">
          <label>Nama Kepala Sekolah:</label>
          <input type="text" id="inputNamaKepsek" value="(Nama Kepala Sekolah)" oninput="updateMetadata()">
        </div>
        <div class="form-group">
          <label>NIP Kepsek:</label>
          <input type="text" id="inputNipKepsek" value="(NIP Kepala Sekolah)" oninput="updateMetadata()">
        </div>
        <div class="form-group">
          <label>Tempat & Tgl TTD:</label>
          <input type="text" id="inputTglTtd" value="Rancah, Juli 2026" oninput="updateMetadata()">
        </div>
        <div class="form-group">
          <label>Upload Cap (PNG/JPG):</label>
          <input type="file" id="inputStempel" accept="image/*" onchange="uploadGambarLokal(event, 'stempelData')">
        </div>
        <div class="form-group">
          <label>Upload TTD (PNG/JPG):</label>
          <input type="file" id="inputTTD" accept="image/*" onchange="uploadGambarLokal(event, 'ttdData')">
        </div>
      </div>

      <!-- TAHAP 2: EDIT POSISI LIVE CAP & TTD -->
      <div class="section-title">2. Edit Posisi Live (Cap & TTD)</div>
      <div class="grid-form">
        <div class="form-group">
          <label>Cap - Posisi X: <span id="valStempelX">-11mm</span></label>
          <input type="range" id="stempelX" min="-30" max="20" step="0.5" value="-11" oninput="updatePosisiLive()">
        </div>
        <div class="form-group">
          <label>Cap - Posisi Y: <span id="valStempelY">1mm</span></label>
          <input type="range" id="stempelY" min="-10" max="15" step="0.5" value="1" oninput="updatePosisiLive()">
        </div>
        <div class="form-group full-width">
          <label>Cap - Ukuran Lebar: <span id="valStempelSize">14mm</span></label>
          <input type="range" id="stempelSize" min="8" max="25" step="0.5" value="14" oninput="updatePosisiLive()">
        </div>

        <div class="form-group">
          <label>TTD - Posisi X: <span id="valTtdX">0.5mm</span></label>
          <input type="range" id="ttdX" min="-20" max="30" step="0.5" value="0.5" oninput="updatePosisiLive()">
        </div>
        <div class="form-group">
          <label>TTD - Posisi Y: <span id="valTtdY">2.5mm</span></label>
          <input type="range" id="ttdY" min="-10" max="15" step="0.5" value="2.5" oninput="updatePosisiLive()">
        </div>
        <div class="form-group full-width">
          <label>TTD - Ukuran Lebar: <span id="valTtdSize">16mm</span></label>
          <input type="range" id="ttdSize" min="8" max="30" step="0.5" value="16" oninput="updatePosisiLive()">
        </div>
      </div>

      <!-- TAHAP 3: TATA TERTIB -->
      <div class="section-title">3. Tata Tertib Belakang</div>
      <div class="grid-form">
        <div class="form-group full-width">
          <label>Teks Tata Tertib:</label>
          <textarea id="inputRules" oninput="renderDuplex()">1. Kartu ini milik SMPN 1 Rancah & wajib dibawa setiap hari.
2. Dilarang meminjamkan kartu kepada orang lain.
3. Kartu ini berfungsi sebagai alat presensi digital sekolah.
4. Apabila menemukan kartu ini, harap mengembalikan ke pihak sekolah.</textarea>
        </div>
        <div class="form-group full-width">
          <label>Teks Footer:</label>
          <input type="text" id="inputFooterText" value="Alamat: Jl. Cibeureum Rancah, Kab. Ciamis | Telp: (0265) xxxxxx" oninput="renderDuplex()">
        </div>
      </div>

      <!-- TAHAP 4: PENGATURAN CETAK -->
      <div class="section-title">4. Pengaturan Cetak</div>
      <div class="grid-form">
        <div class="form-group full-width">
          <label>Pilih Kelas:</label>
          <select id="selectKelas" onchange="renderDuplex()"><option value="">-- Pilih Kelas --</option></select>
        </div>

        <div class="form-group">
          <label>Ukuran Kertas:</label>
          <select id="selectUkuranKertas">
            <option value="A4">A4 (8 Kartu / Lembar)</option>
            <option value="F4" selected>F4 / Folio (10 Kartu / Lembar)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Sisi Halaman Cetak:</label>
          <select id="selectSisiCetak" onchange="renderDuplex()">
            <option value="semua" selected>1. Sisi Depan & Belakang (Duplex)</option>
            <option value="depan">2. Sisi Depan Saja</option>
            <option value="belakang">3. Sisi Belakang Saja (Mirrored)</option>
          </select>
        </div>

        <div class="form-group full-width">
          <div class="action-buttons">
            <button type="button" onclick="cetakDuplex()" class="btn btn-cetak">
              🖨️ Jalankan Cetak
            </button>
            <button type="button" onclick="resetPosisiDefault()" class="btn btn-reset">
              Reset Posisi
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- AREA PREVIEW KANAN -->
    <div class="preview-section">
      <div class="preview-header">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span>Preview Layout Cetak Kartu</span>
          <span style="font-size: 10px; background: #0284c7; color: #fff; padding: 2px 6px; border-radius: 4px;">v3.3</span>
        </div>
        <span style="font-size: 11px; opacity: 0.7; font-weight: normal;">Presisi Standar KTP (85.6mm x 53.9mm)</span>
      </div>
      <div id="wadahCetak"></div>
    </div>
  </div>

  <script>
    const sheetID = '1rzj6ucYgbUf4X1x9fcZVsTGwJBxglXPnCaHazl73mSU';
    const sheetName = 'data master siswa';
    let dataSiswaGlobal = [];
    let daftarKelasGlobal = [];

    const defaultPosisi = {
      stempelX: '-11', stempelY: '1', stempelSize: '14',
      ttdX: '0.5', ttdY: '2.5', ttdSize: '16'
    };

    window.onload = function() {
      if (localStorage.getItem('namaKepsek')) document.getElementById('inputNamaKepsek').value = localStorage.getItem('namaKepsek');
      if (localStorage.getItem('nipKepsek')) document.getElementById('inputNipKepsek').value = localStorage.getItem('nipKepsek');
      if (localStorage.getItem('tglTtdData')) document.getElementById('inputTglTtd').value = localStorage.getItem('tglTtdData');

      initSliders();
      fetchDataSiswa();
    };

    function initSliders() {
      document.getElementById('stempelX').value = localStorage.getItem('stempelX') || defaultPosisi.stempelX;
      document.getElementById('stempelY').value = localStorage.getItem('stempelY') || defaultPosisi.stempelY;
      document.getElementById('stempelSize').value = localStorage.getItem('stempelSize') || defaultPosisi.stempelSize;

      document.getElementById('ttdX').value = localStorage.getItem('ttdX') || defaultPosisi.ttdX;
      document.getElementById('ttdY').value = localStorage.getItem('ttdY') || defaultPosisi.ttdY;
      document.getElementById('ttdSize').value = localStorage.getItem('ttdSize') || defaultPosisi.ttdSize;

      updateLabelPosisi();
    }

    function updateLabelPosisi() {
      document.getElementById('valStempelX').innerText = document.getElementById('stempelX').value + 'mm';
      document.getElementById('valStempelY').innerText = document.getElementById('stempelY').value + 'mm';
      document.getElementById('valStempelSize').innerText = document.getElementById('stempelSize').value + 'mm';

      document.getElementById('valTtdX').innerText = document.getElementById('ttdX').value + 'mm';
      document.getElementById('valTtdY').innerText = document.getElementById('ttdY').value + 'mm';
      document.getElementById('valTtdSize').innerText = document.getElementById('ttdSize').value + 'mm';
    }

    function updatePosisiLive() {
      updateLabelPosisi();

      const sX = document.getElementById('stempelX').value;
      const sY = document.getElementById('stempelY').value;
      const sSize = document.getElementById('stempelSize').value;

      const tX = document.getElementById('ttdX').value;
      const tY = document.getElementById('ttdY').value;
      const tSize = document.getElementById('ttdSize').value;

      localStorage.setItem('stempelX', sX);
      localStorage.setItem('stempelY', sY);
      localStorage.setItem('stempelSize', sSize);

      localStorage.setItem('ttdX', tX);
      localStorage.setItem('ttdY', tY);
      localStorage.setItem('ttdSize', tSize);

      document.querySelectorAll('.img-stempel').forEach(img => {
        img.style.left = sX + 'mm';
        img.style.top = sY + 'mm';
        img.style.width = sSize + 'mm';
      });

      document.querySelectorAll('.img-ttd').forEach(img => {
        img.style.left = tX + 'mm';
        img.style.top = tY + 'mm';
        img.style.width = tSize + 'mm';
      });
    }

    function resetPosisiDefault() {
      localStorage.setItem('stempelX', defaultPosisi.stempelX);
      localStorage.setItem('stempelY', defaultPosisi.stempelY);
      localStorage.setItem('stempelSize', defaultPosisi.stempelSize);

      localStorage.setItem('ttdX', defaultPosisi.ttdX);
      localStorage.setItem('ttdY', defaultPosisi.ttdY);
      localStorage.setItem('ttdSize', defaultPosisi.ttdSize);

      initSliders();
      updatePosisiLive();
    }

    function fetchDataSiswa() {
      const statusBox = document.getElementById('statusIndikator');
      const urlGviz = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
      
      Papa.parse(urlGviz, {
        download: true, skipEmptyLines: true,
        complete: function(results) {
          if (results.data && results.data.length >= 2) prosesDataCsv(results.data);
        }
      });
    }

    function prosesDataCsv(rowsAll) {
      const statusBox = document.getElementById('statusIndikator');
      const rows = rowsAll.slice(1);
      dataSiswaGlobal = rows.filter(r => r && r[1] && r[1].trim() !== '');

      daftarKelasGlobal = [...new Set(dataSiswaGlobal.map(s => (s[2] || '').trim()))].filter(Boolean).sort();

      statusBox.className = 'status-box ready';
      statusBox.innerHTML = `<b>Terbaca:</b> ${dataSiswaGlobal.length} Siswa (${daftarKelasGlobal.length} Kelas)`;

      const selKelas = document.getElementById('selectKelas');
      selKelas.innerHTML = '<option value="">-- Pilih Kelas --</option>';
      daftarKelasGlobal.forEach(k => { selKelas.innerHTML += `<option value="${k}">Kelas ${k}</option>`; });

      if (daftarKelasGlobal.length > 0) {
        selKelas.value = daftarKelasGlobal[0];
        renderDuplex();
      }
    }

    function updateMetadata() {
      const nama = document.getElementById('inputNamaKepsek').value;
      const nip = document.getElementById('inputNipKepsek').value;
      const tgl = document.getElementById('inputTglTtd').value;

      localStorage.setItem('namaKepsek', nama);
      localStorage.setItem('nipKepsek', nip);
      localStorage.setItem('tglTtdData', tgl);

      renderDuplex();
    }

    function uploadGambarLokal(event, storageKey) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        localStorage.setItem(storageKey, e.target.result);
        renderDuplex();
      };
      reader.readAsDataURL(file);
    }

    function buatHtmlDepan(s) {
      const namaKepsek = document.getElementById('inputNamaKepsek').value || '-';
      const nipKepsek = document.getElementById('inputNipKepsek').value || '-';
      const tglTtd = document.getElementById('inputTglTtd').value || '-';

      const stempelBase64 = localStorage.getItem('stempelData') || '';
      const ttdBase64 = localStorage.getItem('ttdData') || '';

      const sX = localStorage.getItem('stempelX') || defaultPosisi.stempelX;
      const sY = localStorage.getItem('stempelY') || defaultPosisi.stempelY;
      const sSize = localStorage.getItem('stempelSize') || defaultPosisi.stempelSize;

      const tX = localStorage.getItem('ttdX') || defaultPosisi.ttdX;
      const tY = localStorage.getItem('ttdY') || defaultPosisi.ttdY;
      const tSize = localStorage.getItem('ttdSize') || defaultPosisi.ttdSize;

      const nisn = (s[0] || '').trim();
      const nama = (s[1] || '').trim();
      const tempatLahir = (s[4] || '').trim();
      const tglLahir = (s[5] || '').trim();
      const ttl = (tempatLahir && tglLahir) ? `${tempatLahir}, ${tglLahir}` : (tempatLahir || tglLahir || '-');
      const jk = (s[6] || '').trim();

      const fotoRaw = (s[12] || '').trim();
      const fotoUrl = (fotoRaw.startsWith('http')) ? fotoRaw : `assets/foto_${nisn}.jpg`;

      return `
        <div class="kartu-container-depan">
          <div class="header-depan">
            <img src="assets/logo-ciamis.png" class="logo-left">
            <img src="assets/logo-smpn1rancah.png" class="logo-right">
            <div class="pemda">PEMERINTAH KABUPATEN CIAMIS</div>
            <div class="dinas">DINAS PENDIDIKAN</div>
            <div class="sekolah">SMP NEGERI 1 RANCAH</div>
            <div class="alamat">Jalan Cibeureum Rancah, Kecamatan Rancah – Kabupaten Ciamis</div>
          </div>
          <div class="judul-kartu">KARTU PELAJAR</div>
          <div class="content-depan">
            <img src="${fotoUrl}" class="foto-box" onerror="this.src='https://via.placeholder.com/108x138?text=Foto'">
            <div class="data-box">
              <div class="data-row"><div class="data-label">Nama</div><div class="data-separator">:</div><div class="data-value" style="font-weight:800;">${nama}</div></div>
              <div class="data-row"><div class="data-label">NISN</div><div class="data-separator">:</div><div class="data-value">${nisn}</div></div>
              <div class="data-row"><div class="data-label">TTL</div><div class="data-separator">:</div><div class="data-value">${ttl}</div></div>
              <div class="data-row"><div class="data-label">JK</div><div class="data-separator">:</div><div class="data-value">${jk || '-'}</div></div>
            </div>
          </div>
          <div class="ttd-section">
            <div class="ttd-box">
              ${stempelBase64 ? `<img src="${stempelBase64}" class="img-stempel" style="left:${sX}mm; top:${sY}mm; width:${sSize}mm;">` : ''}
              ${ttdBase64 ? `<img src="${ttdBase64}" class="img-ttd" style="left:${tX}mm; top:${tY}mm; width:${tSize}mm;">` : ''}
              <div>${tglTtd}</div>
              <div>Kepala Sekolah</div>
              <div class="ttd-space"></div>
              <div class="nama-kepsek">${namaKepsek}</div>
              <div class="nip-kepsek">NIP. ${nipKepsek}</div>
            </div>
          </div>
          <div class="bg-wave-back"></div>
          <div class="bg-wave-front"></div>
        </div>
      `;
    }

    function buatHtmlBelakang(s) {
      const nisn = (s[0] || '').trim();
      const nama = (s[1] || '').trim();
      const footerText = document.getElementById('inputFooterText').value;
      const rawRules = document.getElementById('inputRules').value.split('\n');
      const listRulesHtml = rawRules.filter(r => r.trim() !== '').map(r => `<li>${r.trim()}</li>`).join('');

      return `
        <div class="kartu-container-belakang">
          <img src="assets/logo-smpn1rancah.png" class="watermark-logo">
          <div class="header-belakang">
            <img src="assets/logo-smpn1rancah.png" class="logo-header-belakang">
            <div>
              <div class="title">TATA TERTIB KARTU PELAJAR</div>
              <div class="sub">SMP NEGERI 1 RANCAH</div>
            </div>
          </div>
          <div class="body-belakang">
            <ol class="rules-list">${listRulesHtml}</ol>
            <div class="qr-section">
              <div class="qr-box" id="qr-duplex-${nisn}"></div>
              <div class="qr-label">${nama}</div>
            </div>
          </div>
          <div class="footer-belakang">${footerText}</div>
        </div>
      `;
    }

    function renderDuplex() {
      const kelasPilihan = document.getElementById('selectKelas').value;
      const sisiPilihan = document.getElementById('selectSisiCetak').value;
      const ukuranKertas = document.getElementById('selectUkuranKertas').value;
      const wadah = document.getElementById('wadahCetak');
      
      if (!kelasPilihan) { wadah.innerHTML = ''; return; }

      const siswaKelas = dataSiswaGlobal.filter(s => (s[2]||'').trim() === kelasPilihan);
      const batchSize = (ukuranKertas === "F4") ? 10 : 8; // F4 = 10, A4 = 8 Kartu per Lembar
      let htmlAll = '';

      for (let i = 0; i < siswaKelas.length; i += batchSize) {
        const chunk = siswaKelas.slice(i, i + batchSize);
        const nomorLembar = Math.floor(i / batchSize) + 1;

        // 1. TAMPILKAN DEPAN (JIKA PILIHAN 'SEMUA' ATAU 'DEPAN')
        if (sisiPilihan === "semua" || sisiPilihan === "depan") {
          htmlAll += `<div class="page-sheet"><div class="page-title-tag">📄 LEMBAR ${nomorLembar} - SISI DEPAN</div>`;
          chunk.forEach(s => { htmlAll += buatHtmlDepan(s); });
          htmlAll += `</div>`;
        }

        // 2. TAMPILKAN BELAKANG MIRRORED (JIKA PILIHAN 'SEMUA' ATAU 'BELAKANG')
        if (sisiPilihan === "semua" || sisiPilihan === "belakang") {
          htmlAll += `<div class="page-sheet"><div class="page-title-tag">📄 LEMBAR ${nomorLembar} - SISI BELAKANG (MIRRORED)</div>`;
          
          // Tukar posisi [Kiri, Kanan] -> [Kanan, Kiri] untuk setiap baris (Horizontal Mirroring)
          for (let j = 0; j < chunk.length; j += 2) {
            if (j + 1 < chunk.length) {
              htmlAll += buatHtmlBelakang(chunk[j + 1]); // Sisi Kanan menjadi Kiri
              htmlAll += buatHtmlBelakang(chunk[j]);     // Sisi Kiri menjadi Kanan
            } else {
              htmlAll += buatHtmlBelakang(chunk[j]);     // Jika ganjil
            }
          }
          htmlAll += `</div>`;
        }
      }

      wadah.innerHTML = htmlAll;

      // Generate QR Code di Sisi Belakang jika ditampilkan
      if (sisiPilihan === "semua" || sisiPilihan === "belakang") {
        siswaKelas.forEach(s => {
          const nisn = (s[0] || '').trim();
          const elBox = document.getElementById(`qr-duplex-${nisn}`);
          if (elBox) {
            elBox.innerHTML = '';
            new QRCode(elBox, { text: nisn, width: 90, height: 90 });
          }
        });
      }
    }

    function cetakDuplex() {
      const ukuran = document.getElementById("selectUkuranKertas").value;
      let styleTag = document.getElementById("dynamicPageStyle");
      if (!styleTag) {
        styleTag = document.createElement("style");
        styleTag.id = "dynamicPageStyle";
        document.head.appendChild(styleTag);
      }

      if (ukuran === "F4") {
        styleTag.innerHTML = `@page { size: 215mm 330mm; margin: 8mm; }`;
      } else {
        styleTag.innerHTML = `@page { size: 210mm 297mm; margin: 8mm; }`;
      }

      window.print();
    }
  </script>
</body>
