<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Presensi - SMPN 1 RANCAH</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex items-center justify-center p-3 sm:p-4 md:p-6 relative overflow-x-hidden selection:bg-indigo-500 selection:text-white">

  <!-- Background Decorative Light Orbs -->
  <div class="fixed -top-32 -left-32 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed -bottom-32 -right-32 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>

  <!-- 1. LOGIN CONTAINER -->
  <div id="loginSection" class="w-full max-w-md bg-white/95 backdrop-blur-xl p-6 sm:p-8 rounded-3xl shadow-2xl border border-white/20 relative z-10 transition-all">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-gradient-to-tr from-indigo-600 to-blue-500 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-lg shadow-indigo-500/30">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Portal Guru & Piket</h1>
      <p class="text-xs font-bold text-indigo-600 tracking-wider uppercase mt-1">SMPN 1 RANCAH</p>
    </div>

    <form onsubmit="handleLogin(event)" class="space-y-5">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Token / Password Akses</label>
        <div class="relative">
          <i class="fa-solid fa-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="password" id="inputToken" placeholder="Masukkan token guru..." required
            class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:outline-none transition">
        </div>
      </div>
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-3.5 rounded-2xl text-sm transition shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2">
        <i class="fa-solid fa-right-to-bracket"></i> Masuk Sistem
      </button>
    </form>
  </div>

  <!-- 2. MAIN CONTAINER -->
  <div id="formSection" class="hidden w-full max-w-2xl bg-white/95 backdrop-blur-xl p-5 sm:p-6 md:p-8 rounded-3xl shadow-2xl border border-white/20 space-y-6 relative z-10 transition-all duration-300">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b pb-5 border-slate-100">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-lg font-bold">
          <i class="fa-solid fa-school"></i>
        </div>
        <div>
          <h2 id="sectionTitle" class="text-lg font-extrabold text-slate-900 leading-tight">Input Presensi Manual</h2>
          <p class="text-xs font-bold text-indigo-600 uppercase tracking-wider">SMPN 1 RANCAH</p>
        </div>
      </div>
      <button onclick="logout()" class="text-xs font-bold text-rose-600 bg-rose-50 hover:bg-rose-100 px-3 py-2 rounded-xl transition flex items-center gap-1.5">
        <i class="fa-solid fa-right-from-bracket"></i> Keluar
      </button>
    </div>

    <!-- INDIKATOR STATUS MEMUAT DATA MASTER -->
    <div id="statusDataMaster" class="p-3.5 rounded-2xl text-xs font-bold flex items-center justify-center gap-2 bg-amber-50 text-amber-800 border border-amber-200">
      <i class="fa-solid fa-spinner fa-spin text-amber-600 text-sm"></i>
      <span>Sedang memuat data master siswa...</span>
    </div>

    <!-- TAB MENU PILIHAN (3 TAB RESPONSIVE) -->
    <div class="grid grid-cols-3 gap-1.5 bg-slate-100/80 p-1.5 rounded-2xl text-[11px] font-bold">
      <button id="tabTidakHadir" type="button" onclick="switchMenu('tidak_hadir')"
        class="py-2.5 px-2 rounded-xl transition-all text-center flex items-center justify-center gap-1.5 bg-white text-indigo-600 shadow-sm font-extrabold">
        <i class="fa-solid fa-user-xmark"></i>
        <span>1. Tidak Hadir</span>
      </button>
      <button id="tabLupaAbsen" type="button" onclick="switchMenu('lupa_absen')"
        class="py-2.5 px-2 rounded-xl transition-all text-center flex items-center justify-center gap-1.5 text-slate-500 hover:text-slate-800 font-semibold">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>2. Lupa Absen</span>
      </button>
      <a href="tools.html"
        class="py-2.5 px-2 rounded-xl transition-all text-center flex items-center justify-center gap-1.5 text-slate-500 hover:text-indigo-600 font-semibold">
        <i class="fa-solid fa-screwdriver-wrench"></i>
        <span>3. Tools</span>
      </a>
    </div>

    <!-- FORM PRESENSI (UNTUK MENU 1 & 2) -->
    <form id="mainForm" onsubmit="handleSubmit(event)" class="space-y-5">
      
      <!-- DROPDOWN PILIHAN UMUM (TANGGAL, KELAS, SISWA) -->
      <div id="commonInputs" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Tanggal Presensi</label>
          <input type="date" id="inputTanggal" required
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:outline-none transition">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Pilih Kelas</label>
          <select id="selectKelas" onchange="filterSiswaByKelas()" required disabled
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:outline-none disabled:bg-slate-100 disabled:text-slate-400 transition">
            <option value="">-- Sedang Memuat Data... --</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Pilih Siswa</label>
          <select id="selectSiswa" required disabled
            class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:outline-none disabled:bg-slate-100 disabled:text-slate-400 transition">
            <option value="">-- Pilih Kelas Terlebih Dahulu --</option>
          </select>
        </div>
      </div>

      <!-- KONTEN MENU 1: SISWA TIDAK HADIR -->
      <div id="sectionTidakHadir" class="space-y-3">
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Keterangan Tidak Hadir</label>
        <div class="grid grid-cols-3 gap-3">
          <label class="flex flex-col items-center justify-center p-3 border border-slate-200 rounded-2xl cursor-pointer hover:bg-slate-50 transition">
            <input type="radio" name="statusTidakHadir" value="Izin" class="accent-indigo-600 mb-1">
            <span class="text-xs font-extrabold text-indigo-700">Izin</span>
          </label>
          <label class="flex flex-col items-center justify-center p-3 border border-slate-200 rounded-2xl cursor-pointer hover:bg-slate-50 transition">
            <input type="radio" name="statusTidakHadir" value="Sakit" class="accent-amber-600 mb-1">
            <span class="text-xs font-extrabold text-amber-700">Sakit</span>
          </label>
          <label class="flex flex-col items-center justify-center p-3 border border-slate-200 rounded-2xl cursor-pointer hover:bg-slate-50 transition">
            <input type="radio" name="statusTidakHadir" value="Alpa" class="accent-rose-600 mb-1">
            <span class="text-xs font-extrabold text-rose-700">Alpa</span>
          </label>
        </div>
      </div>

      <!-- KONTEN MENU 2: SISWA LUPA ABSEN -->
      <div id="sectionLupaAbsen" class="hidden space-y-4 bg-amber-50/60 p-4 rounded-2xl border border-amber-200/80">
        <div class="flex items-center gap-2 text-xs font-bold text-amber-800">
          <i class="fa-solid fa-circle-info text-amber-600 text-base"></i>
          <span>Fitur susulan untuk siswa yang hadir tetapi belum scan QR.</span>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Jam Masuk</label>
            <input type="time" id="inputJamMasuk" value="07:00"
              class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Jam Pulang</label>
            <input type="time" id="inputJamPulang" value="14:00"
              class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
        </div>
      </div>

      <!-- Notifikasi Toast -->
      <div id="notif" class="hidden p-3.5 rounded-2xl text-xs font-bold text-center border"></div>

      <!-- Tombol Simpan -->
      <button type="submit" id="btnSubmit" disabled
        class="w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold py-3.5 rounded-2xl text-sm transition shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2">
        <i class="fa-solid fa-paper-plane"></i> Simpan Presensi
      </button>
    </form>

  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzq05A9BpVJFjNkHn7p2QDjbaY2ajsWjVXk5sVDkH3rStFaAC5XgEkndZSg39zOLX_2/exec";
    const TOKEN_BENAR = "GURU2026";
    const WAKTU_INAKTIF = 2 * 60 * 60 * 1000; // 2 Jam (ms)

    let masterSiswa = [];
    let currentMode = "tidak_hadir";

    // --- MANAJEMEN SESI & INAKTIVITAS ---
    function catatAktivitas() {
      if (localStorage.getItem("isLoggedIn") === "true") {
        localStorage.setItem("lastActivity", Date.now().toString());
      }
    }

    function cekStatusAktivitas() {
      const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";
      const lastActivity = parseInt(localStorage.getItem("lastActivity") || "0", 10);
      const sekarang = Date.now();

      if (isLoggedIn && lastActivity > 0 && (sekarang - lastActivity > WAKTU_INAKTIF)) {
        alert("Sesi kamu telah berakhir karena tidak ada aktivitas selama 2 jam. Silakan login kembali.");
        logout();
        return true;
      }
      return false;
    }

    document.addEventListener("DOMContentLoaded", () => {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      document.getElementById("inputTanggal").value = `${yyyy}-${mm}-${dd}`;

      if (localStorage.getItem("isLoggedIn") === "true") {
        if (!cekStatusAktivitas()) {
          document.getElementById("loginSection").classList.add("hidden");
          document.getElementById("formSection").classList.remove("hidden");
          loadMasterData();
          catatAktivitas();
        }
      }

      ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(evt => {
        window.addEventListener(evt, catatAktivitas, { passive: true });
      });

      setInterval(cekStatusAktivitas, 60000);
    });

    function handleLogin(e) {
      e.preventDefault();
      const token = document.getElementById("inputToken").value.trim();
      if (token === TOKEN_BENAR) {
        localStorage.setItem("isLoggedIn", "true");
        catatAktivitas();
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("formSection").classList.remove("hidden");
        loadMasterData();
      } else {
        alert("Token / Password Guru Salah!");
      }
    }

    function logout() {
      localStorage.removeItem("isLoggedIn");
      localStorage.removeItem("lastActivity");
      document.getElementById("formSection").classList.add("hidden");
      document.getElementById("loginSection").classList.remove("hidden");
      document.getElementById("inputToken").value = "";
    }

    function switchMenu(mode) {
      currentMode = mode;
      const tabs = ['tabTidakHadir', 'tabLupaAbsen'];
      const sections = ['sectionTidakHadir', 'sectionLupaAbsen'];
      
      const mainForm = document.getElementById("mainForm");
      const title = document.getElementById("sectionTitle");

      tabs.forEach(tabId => {
        const elem = document.getElementById(tabId);
        if(elem) elem.className = "py-2.5 px-2 rounded-xl transition-all text-center flex items-center justify-center gap-1.5 text-slate-500 hover:text-slate-800 font-semibold";
      });

      sections.forEach(secId => {
        const elem = document.getElementById(secId);
        if(elem) elem.classList.add("hidden");
      });

      if (mode === 'tidak_hadir') {
        title.textContent = "Input Presensi Manual";
        document.getElementById("tabTidakHadir").className = "py-2.5 px-2 rounded-xl transition-all text-center flex items-center justify-center gap-1.5 bg-white text-indigo-600 shadow-sm font-extrabold";
        mainForm.classList.remove("hidden");
        document.getElementById("sectionTidakHadir").classList.remove("hidden");
      } else if (mode === 'lupa_absen') {
        title.textContent = "Input Presensi Susulan";
        document.getElementById("tabLupaAbsen").className = "py-2.5 px-2 rounded-xl transition-all text-center flex items-center justify-center gap-1.5 bg-white text-amber-600 shadow-sm font-extrabold";
        mainForm.classList.remove("hidden");
        document.getElementById("sectionLupaAbsen").classList.remove("hidden");
      }
    }

    function loadMasterData() {
      const statusBox = document.getElementById("statusDataMaster");
      const selectKelas = document.getElementById("selectKelas");
      const btnSubmit = document.getElementById("btnSubmit");

      statusBox.className = "p-3.5 rounded-2xl text-xs font-bold flex items-center justify-center gap-2 bg-amber-50 text-amber-800 border border-amber-200";
      statusBox.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-amber-600 text-sm"></i> <span>Sedang memuat data master siswa...</span>';
      
      selectKelas.disabled = true;
      selectKelas.innerHTML = '<option value="">-- Sedang Memuat Data... --</option>';
      btnSubmit.disabled = true;

      fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
          masterSiswa = data.master || [];
          populateKelas();

          statusBox.className = "p-3.5 rounded-2xl text-xs font-bold flex items-center justify-center gap-2 bg-emerald-50 text-emerald-800 border border-emerald-200";
          statusBox.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600 text-sm"></i> <span>Data pengisian sudah siap!</span>';
          
          selectKelas.disabled = false;
          btnSubmit.disabled = false;
        })
        .catch(err => {
          statusBox.className = "p-3.5 rounded-2xl text-xs font-bold flex items-center justify-center gap-2 bg-rose-50 text-rose-800 border border-rose-200";
          statusBox.innerHTML = '<i class="fa-solid fa-circle-xmark text-rose-600 text-sm"></i> <span>Gagal memuat data! Periksa koneksi internet Anda.</span>';
        });
    }

    function populateKelas() {
      const selectKelas = document.getElementById("selectKelas");
      let setKelas = new Set();
      masterSiswa.forEach(s => { if(s.kelas) setKelas.add(s.kelas); });
      
      selectKelas.innerHTML = '<option value="">-- Pilih Kelas --</option>';

      [...setKelas].sort().forEach(k => {
        const opt1 = document.createElement("option");
        opt1.value = k;
        opt1.textContent = `Kelas ${k}`;
        selectKelas.appendChild(opt1);
      });
    }

    function filterSiswaByKelas() {
      const kelas = document.getElementById("selectKelas").value;
      const selectSiswa = document.getElementById("selectSiswa");

      if (!kelas) {
        selectSiswa.innerHTML = '<option value="">-- Pilih Kelas Terlebih Dahulu --</option>';
        selectSiswa.disabled = true;
        return;
      }

      const filtered = masterSiswa.filter(s => s.kelas === kelas);
      selectSiswa.innerHTML = '<option value="">-- Pilih Siswa --</option>';
      
      filtered.forEach(s => {
        const opt = document.createElement("option");
        opt.value = s.nisn;
        opt.textContent = `${s.nama} (${s.nisn})`;
        selectSiswa.appendChild(opt);
      });

      selectSiswa.disabled = false;
    }

    function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSubmit");
      const notif = document.getElementById("notif");

      const tanggal = document.getElementById("inputTanggal").value;
      const nisn = document.getElementById("selectSiswa").value;

      if (!nisn || !tanggal) {
        alert("Pilih kelas dan siswa terlebih dahulu!");
        return;
      }

      let payload = {
        nisn: nisn,
        tanggal: tanggal,
        token: TOKEN_BENAR
      };

      if (currentMode === 'tidak_hadir') {
        const statusRadio = document.querySelector('input[name="statusTidakHadir"]:checked');
        if (!statusRadio) {
          alert("Pilih keterangan tidak hadir (Izin, Sakit, atau Alpa)!");
          return;
        }
        payload.status = statusRadio.value;
        payload.tipe = "tidak_hadir";
      } else {
        const jamMasuk = document.getElementById("inputJamMasuk").value;
        const jamPulang = document.getElementById("inputJamPulang").value;
        
        if (!jamMasuk && !jamPulang) {
          alert("Isi minimal salah satu (Jam Masuk atau Jam Pulang)!");
          return;
        }
        
        payload.status = "Hadir";
        payload.jamMasuk = jamMasuk;
        payload.jamPulang = jamPulang;
        payload.tipe = "lupa_absen";
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';

      fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        notif.classList.remove("hidden");
        if (res.status === "success") {
          notif.className = "p-3.5 rounded-2xl text-xs font-bold text-center bg-emerald-50 text-emerald-800 border border-emerald-200";
          notif.textContent = res.message || "Data presensi berhasil disimpan!";

          document.getElementById("selectSiswa").value = "";
          document.querySelectorAll('input[name="statusTidakHadir"]').forEach(r => r.checked = false);
        } else {
          notif.className = "p-3.5 rounded-2xl text-xs font-bold text-center bg-rose-50 text-rose-800 border border-rose-200";
          notif.textContent = res.message || "Gagal menyimpan data!";
        }
      })
      .catch(err => {
        notif.classList.remove("hidden");
        notif.className = "p-3.5 rounded-2xl text-xs font-bold text-center bg-rose-50 text-rose-800 border border-rose-200";
        notif.textContent = "Gagal terhubung ke server! Periksa koneksi internet Anda.";
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Simpan Presensi';
        setTimeout(() => notif.classList.add("hidden"), 4000);
      });
    }
  </script>
</body>
</html>
