<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Presensi & ID Card Guru - SMPN 1 RANCAH</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Library tambahan untuk ID Card & QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    
    /* Ukuran ID Card Standar Portrait */
    .id-card {
      width: 250px;
      height: 410px;
      box-sizing: border-box;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4">

  <!-- 1. LOGIN CONTAINER -->
  <div id="loginSection" class="w-full max-w-md bg-white p-6 md:p-8 rounded-2xl shadow-md border border-slate-200">
    <div class="text-center mb-6">
      <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
        <i class="fa-solid fa-user-lock"></i>
      </div>
      <h1 class="text-xl font-extrabold text-slate-800">Akses Guru / Piket</h1>
      <p class="text-xs font-semibold text-blue-600 mt-1">SMPN 1 RANCAH</p>
    </div>

    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Token / Password Guru</label>
        <input type="password" id="inputToken" placeholder="Masukkan token guru..." required
          class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-sm">
        Masuk ke Form Input
      </button>
    </form>
  </div>

  <!-- 2. FORM INPUT & ID CARD CONTAINER -->
  <div id="formSection" class="hidden w-full max-w-lg bg-white p-6 md:p-8 rounded-2xl shadow-md border border-slate-200 space-y-6 transition-all duration-300">
    <!-- Header -->
    <div class="flex items-center justify-between border-b pb-4 border-slate-100">
      <div>
        <h2 id="sectionTitle" class="text-lg font-extrabold text-slate-800">Input Presensi Manual</h2>
        <p class="text-xs text-slate-500">SMPN 1 RANCAH</p>
      </div>
      <button onclick="logout()" class="text-xs font-bold text-rose-600 hover:text-rose-800 hover:underline flex items-center gap-1">
        <i class="fa-solid fa-right-from-bracket"></i> Keluar
      </button>
    </div>

    <!-- INDIKATOR STATUS MEMUAT DATA MASTER -->
    <div id="statusDataMaster" class="p-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 bg-amber-100 text-amber-800 border border-amber-200">
      <i class="fa-solid fa-spinner fa-spin text-amber-600"></i>
      <span>Sedang memuat data master siswa...</span>
    </div>

    <!-- TAB MENU PILIHAN (3 TAB) -->
    <div class="grid grid-cols-3 gap-1.5 bg-slate-100 p-1.5 rounded-xl text-[11px] font-bold">
      <button id="tabTidakHadir" type="button" onclick="switchMenu('tidak_hadir')"
        class="py-2.5 px-2 rounded-lg transition-all text-center flex items-center justify-center gap-1 bg-white text-blue-700 shadow-sm font-extrabold">
        <i class="fa-solid fa-user-xmark"></i>
        <span>1. Tidak Hadir</span>
      </button>
      <button id="tabLupaAbsen" type="button" onclick="switchMenu('lupa_absen')"
        class="py-2.5 px-2 rounded-lg transition-all text-center flex items-center justify-center gap-1 text-slate-600 hover:text-slate-900 font-semibold">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>2. Lupa Absen</span>
      </button>
      <button id="tabCetakQr" type="button" onclick="switchMenu('cetak_qr')"
        class="py-2.5 px-2 rounded-lg transition-all text-center flex items-center justify-center gap-1 text-slate-600 hover:text-slate-900 font-semibold">
        <i class="fa-solid fa-id-card"></i>
        <span>3. Cetak ID Card</span>
      </button>
    </div>

    <!-- FORM PRESENSI (UNTUK MENU 1 & 2) -->
    <form id="mainForm" onsubmit="handleSubmit(event)" class="space-y-4">
      
      <!-- DROPDOWN PILIHAN UMUM (TANGGAL, KELAS, SISWA) -->
      <div id="commonInputs" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Tanggal Presensi</label>
          <input type="date" id="inputTanggal" required
            class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm font-semibold focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Pilih Kelas</label>
          <select id="selectKelas" onchange="filterSiswaByKelas()" required disabled
            class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm font-semibold focus:ring-2 focus:ring-blue-500 focus:outline-none disabled:bg-slate-100 disabled:text-slate-400">
            <option value="">-- Sedang Memuat Data... --</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Pilih Siswa</label>
          <select id="selectSiswa" required disabled
            class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm font-semibold focus:ring-2 focus:ring-blue-500 focus:outline-none disabled:bg-slate-100 disabled:text-slate-400">
            <option value="">-- Pilih Kelas Terlebih Dahulu --</option>
          </select>
        </div>
      </div>

      <!-- KONTEN MENU 1: SISWA TIDAK HADIR -->
      <div id="sectionTidakHadir" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Keterangan Tidak Hadir</label>
          <div class="grid grid-cols-3 gap-2">
            <label class="flex items-center justify-center p-3 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition">
              <input type="radio" name="statusTidakHadir" value="Izin" class="accent-blue-600 mr-2">
              <span class="text-sm font-bold text-blue-700">Izin</span>
            </label>
            <label class="flex items-center justify-center p-3 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition">
              <input type="radio" name="statusTidakHadir" value="Sakit" class="accent-amber-600 mr-2">
              <span class="text-sm font-bold text-amber-700">Sakit</span>
            </label>
            <label class="flex items-center justify-center p-3 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition">
              <input type="radio" name="statusTidakHadir" value="Alpa" class="accent-rose-600 mr-2">
              <span class="text-sm font-bold text-rose-700">Alpa</span>
            </label>
          </div>
        </div>
      </div>

      <!-- KONTEN MENU 2: SISWA LUPA ABSEN -->
      <div id="sectionLupaAbsen" class="hidden space-y-4 bg-amber-50/50 p-4 rounded-xl border border-amber-200/80">
        <div class="flex items-center gap-2 text-xs font-bold text-amber-800">
          <i class="fa-solid fa-circle-info text-amber-600 text-base"></i>
          <span>Fitur susulan untuk siswa yang hadir tetapi belum scan QR.</span>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Jam Masuk</label>
            <input type="time" id="inputJamMasuk" value="07:00"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm font-semibold focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Jam Pulang</label>
            <input type="time" id="inputJamPulang" value="14:00"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm font-semibold focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>
      </div>

      <!-- Notifikasi Toast -->
      <div id="notif" class="hidden p-3 rounded-xl text-xs font-bold text-center border"></div>

      <!-- Tombol Simpan -->
      <button type="submit" id="btnSubmit" disabled
        class="w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold py-3 rounded-xl text-sm transition shadow-sm flex items-center justify-center gap-2">
        <i class="fa-solid fa-paper-plane"></i> Simpan Presensi
      </button>
    </form>

    <!-- KONTEN MENU 3: CETAK & DOWNLOAD ID CARD QR SISWA -->
    <div id="sectionCetakQr" class="hidden space-y-6">
      
      <!-- Panel Kontrol ID Card -->
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
        <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
          <div class="w-full sm:w-1/2">
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Filter Kelas ID Card</label>
            <select id="selectKelasQr" onchange="renderCardsUI()"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm font-semibold focus:ring-2 focus:ring-emerald-500 focus:outline-none">
              <option value="SEMUA">-- Tampilkan Semua Kelas --</option>
            </select>
          </div>
          
          <button type="button" onclick="downloadAllZip()" class="w-full sm:w-auto mt-auto bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-bold text-xs transition flex items-center justify-center gap-2 shadow-sm">
            <i class="fa-solid fa-file-zipper"></i> Download ZIP ID Card
          </button>
        </div>

        <div id="progressBox" class="hidden p-3 rounded-lg bg-emerald-50 border border-emerald-200 text-xs text-emerald-800 font-mono text-center">
          ⏳ Mengonversi: <span id="progressText">0</span> / <span id="totalText">0</span> ID Card...
        </div>
      </div>

      <!-- Container ID Card Siswa -->
      <div id="cardContainer" class="flex flex-wrap gap-6 justify-center max-h-[500px] overflow-y-auto p-2 border border-slate-100 rounded-xl bg-slate-50/50">
      </div>
    </div>

  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzq05A9BpVJFjNkHn7p2QDjbaY2ajsWjVXk5sVDkH3rStFaAC5XgEkndZSg39zOLX_2/exec";
    const TOKEN_BENAR = "GURU2026";
    let masterSiswa = [];
    let currentMode = "tidak_hadir";

    document.addEventListener("DOMContentLoaded", () => {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      document.getElementById("inputTanggal").value = `${yyyy}-${mm}-${dd}`;
    });

    function handleLogin(e) {
      e.preventDefault();
      const token = document.getElementById("inputToken").value.trim();
      if (token === TOKEN_BENAR) {
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("formSection").classList.remove("hidden");
        loadMasterData();
      } else {
        alert("Token / Password Guru Salah!");
      }
    }

    function logout() {
      document.getElementById("formSection").classList.add("hidden");
      document.getElementById("loginSection").classList.remove("hidden");
      document.getElementById("inputToken").value = "";
    }

    function switchMenu(mode) {
      currentMode = mode;
      const tab1 = document.getElementById("tabTidakHadir");
      const tab2 = document.getElementById("tabLupaAbsen");
      const tab3 = document.getElementById("tabCetakQr");
      
      const sec1 = document.getElementById("sectionTidakHadir");
      const sec2 = document.getElementById("sectionLupaAbsen");
      const sec3 = document.getElementById("sectionCetakQr");
      
      const mainForm = document.getElementById("mainForm");
      const formContainer = document.getElementById("formSection");
      const title = document.getElementById("sectionTitle");

      const inactiveClass = "py-2.5 px-2 rounded-lg transition-all text-center flex items-center justify-center gap-1 text-slate-600 hover:text-slate-900 font-semibold";
      tab1.className = inactiveClass;
      tab2.className = inactiveClass;
      tab3.className = inactiveClass;

      if (mode === 'tidak_hadir') {
        formContainer.className = "w-full max-w-lg bg-white p-6 md:p-8 rounded-2xl shadow-md border border-slate-200 space-y-6";
        title.textContent = "Input Presensi Manual";
        tab1.className = "py-2.5 px-2 rounded-lg transition-all text-center flex items-center justify-center gap-1 bg-white text-blue-700 shadow-sm font-extrabold";
        
        mainForm.classList.remove("hidden");
        sec1.classList.remove("hidden");
        sec2.classList.add("hidden");
        sec3.classList.add("hidden");
      } else if (mode === 'lupa_absen') {
        formContainer.className = "w-full max-w-lg bg-white p-6 md:p-8 rounded-2xl shadow-md border border-slate-200 space-y-6";
        title.textContent = "Input Presensi Susulan";
        tab2.className = "py-2.5 px-2 rounded-lg transition-all text-center flex items-center justify-center gap-1 bg-white text-amber-700 shadow-sm font-extrabold";
        
        mainForm.classList.remove("hidden");
        sec2.classList.remove("hidden");
        sec1.classList.add("hidden");
        sec3.classList.add("hidden");
      } else if (mode === 'cetak_qr') {
        formContainer.className = "w-full max-w-4xl bg-white p-6 md:p-8 rounded-2xl shadow-md border border-slate-200 space-y-6";
        title.textContent = "Cetak & Download ID Card QR";
        tab3.className = "py-2.5 px-2 rounded-lg transition-all text-center flex items-center justify-center gap-1 bg-white text-emerald-700 shadow-sm font-extrabold";
        
        mainForm.classList.add("hidden");
        sec3.classList.remove("hidden");
        
        renderCardsUI();
      }
    }

    function loadMasterData() {
      const statusBox = document.getElementById("statusDataMaster");
      const selectKelas = document.getElementById("selectKelas");
      const btnSubmit = document.getElementById("btnSubmit");

      statusBox.className = "p-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 bg-amber-100 text-amber-800 border border-amber-200";
      statusBox.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-amber-600"></i> <span>Sedang memuat data master siswa...</span>';
      
      selectKelas.disabled = true;
      selectKelas.innerHTML = '<option value="">-- Sedang Memuat Data... --</option>';
      btnSubmit.disabled = true;

      fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
          masterSiswa = data.master || [];
          populateKelas();

          statusBox.className = "p-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 bg-emerald-100 text-emerald-800 border border-emerald-200";
          statusBox.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600"></i> <span>Data pengisian sudah siap!</span>';
          
          selectKelas.disabled = false;
          btnSubmit.disabled = false;
        })
        .catch(err => {
          statusBox.className = "p-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 bg-rose-100 text-rose-800 border border-rose-200";
          statusBox.innerHTML = '<i class="fa-solid fa-circle-xmark text-rose-600"></i> <span>Gagal memuat data! Periksa koneksi internet Anda.</span>';
        });
    }

    function populateKelas() {
      const selectKelas = document.getElementById("selectKelas");
      const selectKelasQr = document.getElementById("selectKelasQr");
      
      let setKelas = new Set();
      masterSiswa.forEach(s => { if(s.kelas) setKelas.add(s.kelas); });
      
      selectKelas.innerHTML = '<option value="">-- Pilih Kelas --</option>';
      selectKelasQr.innerHTML = '<option value="SEMUA">-- Tampilkan Semua Kelas --</option>';

      [...setKelas].sort().forEach(k => {
        const opt1 = document.createElement("option");
        opt1.value = k;
        opt1.textContent = `Kelas ${k}`;
        selectKelas.appendChild(opt1);

        const opt2 = document.createElement("option");
        opt2.value = k;
        opt2.textContent = `Kelas ${k}`;
        selectKelasQr.appendChild(opt2);
      });
    }

    function filterSiswaByKelas() {
      const kelas = document.getElementById("selectKelas").value;
      const selectSiswa = document.getElementById("selectSiswa");

      if (!kelas) {
        selectSiswa.innerHTML = '<option value="">-- Pilih Kelas Terlebih Dahulu --</option>';
        selectSiswa.disabled = true;
        return;
      }

      const filtered = masterSiswa.filter(s => s.kelas === kelas);
      selectSiswa.innerHTML = '<option value="">-- Pilih Siswa --</option>';
      
      filtered.forEach(s => {
        const opt = document.createElement("option");
        opt.value = s.nisn;
        opt.textContent = `${s.nama} (${s.nisn})`;
        selectSiswa.appendChild(opt);
      });

      selectSiswa.disabled = false;
    }

    function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSubmit");
      const notif = document.getElementById("notif");

      const tanggal = document.getElementById("inputTanggal").value;
      const nisn = document.getElementById("selectSiswa").value;

      if (!nisn || !tanggal) {
        alert("Pilih kelas dan siswa terlebih dahulu!");
        return;
      }

      let payload = {
        nisn: nisn,
        tanggal: tanggal,
        token: TOKEN_BENAR
      };

      if (currentMode === 'tidak_hadir') {
        const statusRadio = document.querySelector('input[name="statusTidakHadir"]:checked');
        if (!statusRadio) {
          alert("Pilih keterangan tidak hadir (Izin, Sakit, atau Alpa)!");
          return;
        }
        payload.status = statusRadio.value;
        payload.tipe = "tidak_hadir";
      } else {
        const jamMasuk = document.getElementById("inputJamMasuk").value;
        const jamPulang = document.getElementById("inputJamPulang").value;
        
        if (!jamMasuk && !jamPulang) {
          alert("Isi minimal salah satu (Jam Masuk atau Jam Pulang)!");
          return;
        }
        
        payload.status = "Hadir";
        payload.jamMasuk = jamMasuk;
        payload.jamPulang = jamPulang;
        payload.tipe = "lupa_absen";
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';

      fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        notif.classList.remove("hidden");
        if (res.status === "success") {
          notif.className = "p-3 rounded-xl text-xs font-bold text-center bg-emerald-100 text-emerald-800 border border-emerald-200";
          notif.textContent = res.message || "Data presensi berhasil disimpan!";

          document.getElementById("selectSiswa").value = "";
          document.querySelectorAll('input[name="statusTidakHadir"]').forEach(r => r.checked = false);
        } else {
          notif.className = "p-3 rounded-xl text-xs font-bold text-center bg-rose-100 text-rose-800 border border-rose-200";
          notif.textContent = res.message || "Gagal menyimpan data!";
        }
      })
      .catch(err => {
        notif.classList.remove("hidden");
        notif.className = "p-3 rounded-xl text-xs font-bold text-center bg-rose-100 text-rose-800 border border-rose-200";
        notif.textContent = "Gagal terhubung ke server! Periksa koneksi internet Anda.";
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Simpan Presensi';
        setTimeout(() => notif.classList.add("hidden"), 4000);
      });
    }

    // ==========================================
    // LOGIKA GENERATOR & DOWNLOAD ID CARD SISWA
    // ==========================================

    function renderCardsUI() {
      const container = document.getElementById("cardContainer");
      const filterKelas = document.getElementById("selectKelasQr").value;

      container.innerHTML = "";

      let dataToRender = masterSiswa;
      if (filterKelas !== "SEMUA") {
        dataToRender = masterSiswa.filter(s => s.kelas === filterKelas);
      }

      if (dataToRender.length === 0) {
        container.innerHTML = "<p class='text-xs text-slate-400 font-semibold py-4'>Tidak ada data siswa untuk ditampilkan.</p>";
        return;
      }

      dataToRender.forEach((siswa, index) => {
        const wrapper = document.createElement("div");
        wrapper.className = "flex flex-col items-center gap-2";

        // PERBAIKAN: Menghapus truncate dan memberikan leading-normal serta padding aman pada teks nama
        wrapper.innerHTML = `
          <div id="card-${index}" class="id-card bg-gradient-to-b from-blue-900 via-slate-800 to-slate-900 rounded-2xl border-2 border-blue-500 p-4 shadow-xl flex flex-col justify-between items-center text-center">
            <div class="w-full border-b border-blue-400/30 pb-2">
              <h2 class="text-[11px] font-black tracking-widest text-blue-300 uppercase leading-normal">SMPN 1 RANCAH</h2>
              <p class="text-[9px] text-slate-300 font-medium leading-normal">KARTU PRESENSI SISWA</p>
            </div>

            <div class="bg-white p-2.5 rounded-xl shadow-md my-auto border border-blue-400 flex justify-center items-center">
              <div id="qrcode-${index}"></div>
            </div>

            <div class="w-full bg-slate-900/90 p-3 rounded-xl border border-slate-700 flex flex-col items-center justify-center">
              <h3 class="text-xs font-extrabold text-white uppercase tracking-wide leading-normal px-1 py-0.5 break-words w-full">${siswa.nama}</h3>
              <p class="text-[10px] text-blue-400 font-mono font-bold mt-1 leading-normal">NISN: ${siswa.nisn}</p>
              <div class="mt-2 inline-block bg-blue-600 text-white font-bold text-[10px] px-3 py-1 rounded-full uppercase tracking-wider leading-none">
                KELAS ${siswa.kelas}
              </div>
            </div>
          </div>

          <button type="button" onclick="downloadSingleCard(${index}, '${siswa.nama}')" 
            class="text-[11px] bg-slate-800 hover:bg-slate-700 text-blue-300 border border-slate-700 px-3 py-1 rounded-lg font-semibold transition flex items-center gap-1 shadow-sm">
            <i class="fa-solid fa-camera"></i> Unduh Gambar
          </button>
        `;

        container.appendChild(wrapper);

        // Generate QR Code
        new QRCode(document.getElementById(`qrcode-${index}`), {
          text: String(siswa.nisn),
          width: 100,
          height: 100,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      });
    }

    // Download 1 Gambar (PNG)
    function downloadSingleCard(index, namaSiswa) {
      const cardElem = document.getElementById(`card-${index}`);
      
      html2canvas(cardElem, { 
        scale: 3, 
        useCORS: true,
        logging: false
      }).then(canvas => {
        const link = document.createElement("a");
        link.download = `ID_CARD_${namaSiswa.replace(/\s+/g, "_")}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    }

    // Download Semua Gambar (.ZIP)
    async function downloadAllZip() {
      const filterKelas = document.getElementById("selectKelasQr").value;
      let dataToZip = masterSiswa;
      if (filterKelas !== "SEMUA") {
        dataToZip = masterSiswa.filter(s => s.kelas === filterKelas);
      }

      if (dataToZip.length === 0) {
        alert("Tidak ada data kartu untuk diunduh!");
        return;
      }

      const zip = new JSZip();
      const progressBox = document.getElementById("progressBox");
      const progressText = document.getElementById("progressText");
      const totalText = document.getElementById("totalText");

      progressBox.classList.remove("hidden");
      totalText.textContent = dataToZip.length;

      for (let i = 0; i < dataToZip.length; i++) {
        const siswa = dataToZip[i];
        const cardElem = document.getElementById(`card-${i}`);

        if (cardElem) {
          const canvas = await html2canvas(cardElem, { scale: 3, useCORS: true, logging: false });
          const imgData = canvas.toDataURL("image/png").split(",")[1];
          
          const fileName = `Kelas_${siswa.kelas}/${siswa.nisn}_${siswa.nama.replace(/\s+/g, "_")}.png`;
          zip.file(fileName, imgData, { base64: true });
        }

        progressText.textContent = i + 1;
      }

      progressBox.innerHTML = "⚡ Menyusun file ZIP, harap tunggu sebentar...";
      zip.generateAsync({ type: "blob" }).then(content => {
        saveAs(content, `ID_Card_Siswa_${filterKelas}.zip`);
        progressBox.classList.add("hidden");
      });
    }
  </script>
</body>
</html>
