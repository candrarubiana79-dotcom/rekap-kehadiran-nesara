<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Presensi Siswa v3.2 Adjusted - SMPN 1 RANCAH</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    #containerTabel { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
    #tabelUtama { white-space: nowrap; border-collapse: separate; border-spacing: 0; }
    .libur-text-vertical { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; display: inline-block; letter-spacing: 1px; }
    .row-highlight td { background-color: #fef08a !important; color: #0f172a !important; font-weight: 800 !important; border-top: 2px solid #eab308 !important; border-bottom: 2px solid #eab308 !important; }
    .sticky-col-no { position: sticky; left: 0; z-index: 20; }
    .sticky-col-nama { position: sticky; left: 36px; z-index: 20; box-shadow: 3px 0 6px -2px rgba(0, 0, 0, 0.12); }
    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    @media (max-width: 640px) {
      body { padding: 6px !important; }
      #tabelUtama { font-size: 10px !important; }
      #tabelUtama th, #tabelUtama td { padding: 5px 3px !important; }
      .sticky-col-no { left: 0 !important; min-width: 28px !important; max-width: 28px !important; text-align: center; }
      .sticky-col-nama { left: 28px !important; min-width: 110px !important; max-width: 110px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .col-tanggal { min-width: 25px !important; text-align: center; }
      .libur-text-vertical { font-size: 8px !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-2 sm:p-4 md:p-6">

  <div class="max-w-7xl mx-auto space-y-3 sm:space-y-5">

    <header class="bg-gradient-to-r from-blue-700 via-indigo-700 to-indigo-800 text-white rounded-2xl p-3 sm:p-6 md:p-8 shadow-lg relative overflow-hidden">
      <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>

      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 sm:gap-4 relative z-10">
        <div class="flex items-center gap-2.5 sm:gap-5">
          <img src="assets/logo-smpn1rancah.png" alt="Logo SMPN 1 Rancah" class="w-12 h-12 sm:w-20 sm:h-20 md:w-24 md:h-24 object-contain drop-shadow-xl flex-shrink-0">
          <div>
            <div class="flex items-center gap-1.5 mb-0.5">
              <span class="px-2 py-0.5 bg-white/20 backdrop-blur-md rounded-full text-[9px] sm:text-xs font-semibold uppercase tracking-wider text-blue-100">
                Sistem Presensi Digital
              </span>
              <span class="px-1.5 py-0.5 bg-amber-400 text-slate-900 font-black text-[9px] sm:text-[11px] rounded-full shadow-sm">
                v3.2 Adjusted
              </span>
            </div>
            <h1 class="text-sm sm:text-2xl md:text-3xl font-extrabold tracking-tight leading-tight">REKAPITULASI PRESENSI SISWA</h1>
            <p class="text-blue-200 text-[11px] sm:text-base font-bold">SMPN 1 RANCAH</p>
          </div>
        </div>

        <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-xl p-2.5 sm:p-3 text-left md:text-right self-stretch md:self-auto min-w-[160px] flex md:flex-col justify-between items-center md:items-end">
          <div>
            <div class="text-[9px] sm:text-xs text-blue-200 font-medium flex items-center gap-1 justify-start md:justify-end">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Waktu Server (WIB)
            </div>
            <div id="liveClock" class="text-base sm:text-xl md:text-2xl font-black font-mono text-white">00:00:00</div>
          </div>
          <div class="text-right">
            <div id="liveDate" class="text-[10px] sm:text-xs text-blue-100 font-medium">Memuat tanggal...</div>
            <div id="lastSync" class="text-[9px] sm:text-[10px] text-emerald-300 font-semibold flex items-center gap-1 justify-end">
              <i class="fa-solid fa-arrows-rotate fa-spin text-[8px]"></i> Syncing...
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="bg-white rounded-2xl shadow-sm border border-slate-200 p-2.5 sm:p-5 md:p-6 space-y-3 sm:space-y-6">

      <div class="flex justify-center border-b border-slate-200 pb-3">
        <div class="inline-flex bg-slate-200 p-1 rounded-xl gap-1 w-full sm:w-auto">
          <button id="btnTypeReguler" onclick="switchCategory('reguler')" class="flex-1 sm:flex-initial px-4 py-2 rounded-lg text-xs sm:text-sm font-black transition-all bg-indigo-600 text-white shadow-md flex items-center justify-center gap-2">
            <i class="fa-solid fa-school"></i> Presensi Reguler
          </button>
          <button id="btnTypeDzuhur" onclick="switchCategory('dzuhur')" class="flex-1 sm:flex-initial px-4 py-2 rounded-lg text-xs sm:text-sm font-black transition-all text-slate-600 hover:text-slate-900 flex items-center justify-center gap-2">
            <i class="fa-solid fa-mosque"></i> Shalat Dzuhur
          </button>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 border-b border-slate-100 pb-2.5">
        <div class="flex bg-slate-100 p-1 rounded-xl w-full sm:w-auto">
          <button id="tabHarian" onclick="switchTab('harian')" class="flex-1 sm:flex-none px-3 py-2 rounded-lg text-xs sm:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-1.5 bg-white text-blue-600 shadow-sm">
            <i class="fa-solid fa-calendar-day"></i> Presensi Harian
          </button>
          <button id="tabBulanan" onclick="switchTab('bulanan')" class="flex-1 sm:flex-none px-3 py-2 rounded-lg text-xs sm:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-1.5 text-slate-500 hover:text-slate-800">
            <i class="fa-solid fa-calendar-days"></i> Presensi Bulanan
          </button>
        </div>

        <div class="flex items-center gap-2 w-full sm:w-auto">
          <button onclick="manualRefresh()" title="Segarkan Data Sekarang" class="flex-1 sm:flex-initial bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-3 rounded-xl transition duration-150 shadow-sm flex items-center justify-center gap-1.5 text-xs sm:text-sm">
            <i id="iconRefresh" class="fa-solid fa-rotate"></i>
            <span>Refresh</span>
          </button>

          <button onclick="downloadExcel()" class="flex-1 sm:flex-initial bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-3 rounded-xl transition duration-150 shadow-sm flex items-center justify-center gap-1.5 text-xs sm:text-sm">
            <i class="fa-solid fa-file-excel text-sm"></i> Export Excel
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5 bg-slate-50 p-2.5 sm:p-4 rounded-xl border border-slate-200/80">
        <div id="boxTanggal">
          <label class="block text-[10px] sm:text-[11px] font-extrabold uppercase tracking-wider text-slate-600 mb-1 flex items-center gap-1">
            <i class="fa-regular fa-calendar text-blue-600"></i> Pilih Tanggal:
          </label>
          <input type="date" id="filterTanggal" onchange="renderTable()" class="w-full bg-white px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs sm:text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none transition min-h-[38px]">
        </div>

        <div id="boxBulan" class="hidden">
          <label class="block text-[10px] sm:text-[11px] font-extrabold uppercase tracking-wider text-slate-600 mb-1 flex items-center gap-1">
            <i class="fa-regular fa-calendar-check text-blue-600"></i> Pilih Bulan:
          </label>
          <input type="month" id="filterBulan" onchange="renderTable()" class="w-full bg-white px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs sm:text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none transition min-h-[38px]">
        </div>

        <div>
          <label class="block text-[10px] sm:text-[11px] font-extrabold uppercase tracking-wider text-slate-600 mb-1 flex items-center gap-1">
            <i class="fa-solid fa-users text-blue-600"></i> Pilih Kelas:
          </label>
          <select id="filterKelas" onchange="renderTable()" class="w-full bg-white px-2.5 py-1.5 border border-slate-300 rounded-lg text-xs sm:text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none transition min-h-[38px]">
            <option value="">-- Pilih Kelas --</option>
          </select>
        </div>
      </div>

      <div class="text-center py-1 border-b border-slate-100">
        <h2 id="judulRekap" class="text-sm sm:text-lg md:text-xl font-extrabold text-slate-800">REKAPITULASI PRESENSI SISWA</h2>
        <p id="subJudulRekap" class="text-[11px] sm:text-sm font-medium text-slate-500 mt-0.5"></p>
        <div class="flex flex-wrap items-center justify-center gap-1.5 mt-1 text-[9px] sm:text-[10px]">
          <span class="bg-amber-50 text-amber-800 font-bold px-2 py-0.5 rounded-full border border-amber-200">
            💡 Sentuh nama untuk sorot baris
          </span>
          <span class="bg-amber-400 text-slate-900 font-extrabold px-2 py-0.5 rounded-full shadow-sm flex items-center gap-1">
            <i class="fa-solid fa-star text-[8px]"></i> Kolom Kuning = Hari Ini
          </span>
        </div>
      </div>

      <div id="boxStatistik"></div>

      <div id="containerTabel" class="border border-slate-200 shadow-sm bg-white rounded-xl relative">
        <table id="tabelUtama" class="w-full text-center border-collapse text-xs sm:text-sm">
        </table>
      </div>

    </main>

    <footer class="text-center text-[10px] sm:text-xs text-slate-400 py-2">
      &copy; 2026 Presensi Digital v3.2 Adjusted • <span class="font-semibold text-slate-600">SMPN 1 RANCAH</span>
    </footer>

  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzq05A9BpVJFjNkHn7p2QDjbaY2ajsWjVXk5sVDkH3rStFaAC5XgEkndZSg39zOLX_2/exec";

    let rawMaster = [];
    let rawLogs = [];
    let rawDzuhur = [];
    let rawLibur = [];
    let tanggalMulaiSistem = ""; 
    
    let currentCategory = "reguler";
    let currentMode = "harian";

    // --- PARSER TANGGAL PINTAR ---
    function formatDateStandard(dStr) {
      if (!dStr) return "";
      let str = String(dStr).trim().split(" ")[0].split("T")[0];
      
      let mIso = str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
      if (mIso) {
        return `${mIso[1]}-${mIso[2].padStart(2, '0')}-${mIso[3].padStart(2, '0')}`;
      }

      let mOther = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if (mOther) {
        let p1 = parseInt(mOther[1], 10);
        let p2 = parseInt(mOther[2], 10);
        let y = mOther[3];

        if (p1 > 12) {
          return `${y}-${mOther[2].padStart(2, '0')}-${mOther[1].padStart(2, '0')}`;
        } else if (p2 > 12) {
          return `${y}-${mOther[1].padStart(2, '0')}-${mOther[2].padStart(2, '0')}`;
        } else {
          return `${y}-${mOther[2].padStart(2, '0')}-${mOther[1].padStart(2, '0')}`;
        }
      }
      return str;
    }

    // --- MATCHING LOG & SISWA ---
    function matchStudentLog(l, siswa, tglStr) {
      const logDate = formatDateStandard(l.tanggal || l.timestamp);
      const targetDate = formatDateStandard(tglStr);
      if (logDate !== targetDate) return false;

      const sisKode = String(siswa.nisn || siswa.kode || "").trim().toLowerCase().replace(/^0+/, '');
      const sisNama = String(siswa.nama || "").trim().toLowerCase();

      const logKode = String(l.kode || l.nisn || l.NISN || l.Kode || "").trim().toLowerCase().replace(/^0+/, '');
      const logNama = String(l.nama || "").trim().toLowerCase();

      if (logKode && sisKode && logKode === sisKode) return true;
      if (logNama && sisNama && logNama === sisNama) return true;

      return false;
    }

    function getKet(l) {
      return String(l.keterangan || l.status || l.ket || "").trim().toLowerCase();
    }

    function sorotBarisSiswa(trElement) {
      document.querySelectorAll("#tabelUtama tr").forEach(tr => tr.classList.remove("row-highlight"));
      trElement.classList.add("row-highlight");
    }

    function updateLiveClock() {
      const now = new Date();
      const optionsDate = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Asia/Jakarta' };
      const optionsTime = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'Asia/Jakarta' };
      document.getElementById('liveClock').textContent = now.toLocaleTimeString('id-ID', optionsTime) + " WIB";
      document.getElementById('liveDate').textContent = now.toLocaleDateString('id-ID', optionsDate);
    }
    setInterval(updateLiveClock, 1000);
    updateLiveClock();

    function getTodayString() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function isSudahLewatBatasPulang(dateStr) {
      const todayStr = getTodayString();
      if (dateStr < todayStr) return true;
      if (dateStr > todayStr) return false;
      
      const parts = dateStr.split("-");
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      const dayOfWeek = d.getDay(); 
      
      const now = new Date();
      const jamSekarang = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');
      const jamBatas = (dayOfWeek === 5) ? "15:00" : "16:00";
      
      return jamSekarang >= jamBatas;
    }

    document.addEventListener("DOMContentLoaded", () => {
      const todayStr = getTodayString();
      document.getElementById("filterTanggal").value = todayStr;
      document.getElementById("filterBulan").value = todayStr.substring(0, 7);
      loadData(false);
      setInterval(() => loadData(true), 60000);
    });

    function switchCategory(cat) {
      currentCategory = cat;
      const btnReg = document.getElementById("btnTypeReguler");
      const btnDzu = document.getElementById("btnTypeDzuhur");

      if (cat === 'reguler') {
        btnReg.className = "flex-1 sm:flex-initial px-4 py-2 rounded-lg text-xs sm:text-sm font-black transition-all bg-indigo-600 text-white shadow-md flex items-center justify-center gap-2";
        btnDzu.className = "flex-1 sm:flex-initial px-4 py-2 rounded-lg text-xs sm:text-sm font-black transition-all text-slate-600 hover:text-slate-900 flex items-center justify-center gap-2";
      } else {
        btnDzu.className = "flex-1 sm:flex-initial px-4 py-2 rounded-lg text-xs sm:text-sm font-black transition-all bg-emerald-600 text-white shadow-md flex items-center justify-center gap-2";
        btnReg.className = "flex-1 sm:flex-initial px-4 py-2 rounded-lg text-xs sm:text-sm font-black transition-all text-slate-600 hover:text-slate-900 flex items-center justify-center gap-2";
      }
      renderTable();
    }

    function switchTab(mode) {
      currentMode = mode;
      const btnHarian = document.getElementById("tabHarian");
      const btnBulanan = document.getElementById("tabBulanan");
      const boxTanggal = document.getElementById("boxTanggal");
      const boxBulan = document.getElementById("boxBulan");

      if (mode === 'harian') {
        btnHarian.className = "flex-1 sm:flex-none px-3 py-2 rounded-lg text-xs sm:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-1.5 bg-white text-blue-600 shadow-sm";
        btnBulanan.className = "flex-1 sm:flex-none px-3 py-2 rounded-lg text-xs sm:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-1.5 text-slate-500 hover:text-slate-800";
        boxTanggal.classList.remove("hidden");
        boxBulan.classList.add("hidden");
      } else {
        btnBulanan.className = "flex-1 sm:flex-none px-3 py-2 rounded-lg text-xs sm:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-1.5 bg-white text-blue-600 shadow-sm";
        btnHarian.className = "flex-1 sm:flex-none px-3 py-2 rounded-lg text-xs sm:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-1.5 text-slate-500 hover:text-slate-800";
        boxBulan.classList.remove("hidden");
        boxTanggal.classList.add("hidden");
      }
      renderTable();
    }

    function manualRefresh() { loadData(false); }

    function loadData(isSilent = false) {
      const iconRefresh = document.getElementById("iconRefresh");
      if (iconRefresh) iconRefresh.classList.add("fa-spin");

      const filterBulanVal = document.getElementById("filterBulan").value;

      fetch(WEB_APP_URL + "?bulan=" + filterBulanVal)
        .then(res => res.json())
        .then(data => {
          rawMaster = data.master || [];
          rawLogs = data.logs || [];
          rawDzuhur = data.dzuhur || [];
          rawLibur = data.libur || [];
          tanggalMulaiSistem = data.tanggal_mulai || "";

          initKelasDropdown();
          renderTable();

          const now = new Date();
          const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'Asia/Jakarta' });
          const lastSyncEl = document.getElementById("lastSync");
          if (lastSyncEl) lastSyncEl.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> ${timeStr}`;
        })
        .finally(() => {
          if (iconRefresh) iconRefresh.classList.remove("fa-spin");
        });
    }

    function initKelasDropdown() {
      const select = document.getElementById("filterKelas");
      const currentVal = select.value;
      let kelasSet = new Set();
      rawMaster.forEach(s => { if(s.kelas) kelasSet.add(s.kelas); });
      const kelasList = [...kelasSet].sort();

      select.innerHTML = '<option value="">-- Pilih Kelas --</option>';
      kelasList.forEach(k => {
        const opt = document.createElement("option");
        opt.value = k;
        opt.textContent = `Kelas ${k}`;
        select.appendChild(opt);
      });
      select.value = currentVal;
    }

    function hitungStatistikHarian(kelasSelected) {
      const tgl = document.getElementById("filterTanggal").value;
      const todayStr = getTodayString();
      const infoLibur = rawLibur.find(l => formatDateStandard(l.tanggal) === tgl);

      let targetList = rawMaster.filter(m => m.kelas === kelasSelected);
      let totalSiswa = targetList.length;
      let countHadir = 0, countIzin = 0, countSakit = 0, countAlpa = 0;

      const isWeekendOrHoliday = infoLibur;
      const isFuture = (tgl > todayStr);
      const isBeforeStart = (tanggalMulaiSistem && tgl < tanggalMulaiSistem);

      if (!isWeekendOrHoliday && !isFuture && !isBeforeStart) {
        targetList.forEach(siswa => {
          const studentLogs = rawLogs.filter(l => matchStudentLog(l, siswa, tgl));

          const logMasuk = studentLogs.find(l => {
            const k = getKet(l);
            return k.includes("masuk") || k.includes("terlambat") || k.includes("hadir") || k.includes("susulan");
          });
          const logPulang = studentLogs.find(l => getKet(l).includes("pulang"));
          const logManual = studentLogs.find(l => {
            const k = getKet(l);
            return k.includes("izin") || k.includes("sakit") || k.includes("alpa");
          });

          if (logManual) {
            const k = getKet(logManual);
            if (k.includes("izin")) countIzin++;
            else if (k.includes("sakit")) countSakit++;
            else countAlpa++;
          } else if (logMasuk) {
            const kMasuk = getKet(logMasuk);
            if (!logPulang && isSudahLewatBatasPulang(tgl) && !kMasuk.includes("susulan") && !kMasuk.includes("hadir")) {
              countAlpa++;
            } else {
              countHadir++;
            }
          } else {
            countAlpa++;
          }
        });
      }

      return {
        totalSiswa, countHadir, countIzin, countSakit, countAlpa,
        countTidakHadir: countIzin + countSakit + countAlpa,
        isWeekendOrHoliday, isFuture, isBeforeStart
      };
    }

    function renderStatistikSummary() {
      const box = document.getElementById("boxStatistik");
      if (!box) return;

      if (currentMode !== "harian" || currentCategory !== "reguler") {
        box.innerHTML = "";
        box.classList.add("hidden");
        return;
      }

      box.classList.remove("hidden");
      const kelas = document.getElementById("filterKelas").value;
      const stats = hitungStatistikHarian(kelas);

      if (stats.isWeekendOrHoliday) {
        box.innerHTML = `<div class="bg-purple-50 border border-purple-200 text-purple-800 p-2.5 sm:p-4 rounded-xl text-center font-bold text-xs sm:text-sm">🎉 Hari Libur (${stats.isWeekendOrHoliday.keterangan || 'Libur'}). Tidak ada presensi.</div>`;
        return;
      }
      if (stats.isFuture) {
        box.innerHTML = `<div class="bg-slate-50 border border-slate-200 text-slate-600 p-2.5 sm:p-4 rounded-xl text-center font-bold text-xs sm:text-sm">⏳ Tanggal belum berjalan. Belum ada rekap presensi.</div>`;
        return;
      }

      box.className = "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 sm:gap-3";
      box.innerHTML = `
        <div class="bg-indigo-50/90 border border-indigo-200 p-2.5 sm:p-3 rounded-xl flex items-center gap-2.5 shadow-sm">
          <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold text-sm"><i class="fa-solid fa-users"></i></div>
          <div><p class="text-[8px] sm:text-[10px] font-extrabold uppercase text-indigo-700">Siswa Kelas ${kelas}</p><p class="text-sm sm:text-xl font-black text-slate-800">${stats.totalSiswa}</p></div>
        </div>
        <div class="bg-emerald-50/90 border border-emerald-200 p-2.5 sm:p-3 rounded-xl flex items-center gap-2.5 shadow-sm">

    function renderTable() {
      const kelas = document.getElementById("filterKelas").value;

      if (!kelas) {
        document.getElementById("judulRekap").textContent = currentMode === "bulanan" 
          ? `REKAP BULANAN PRESENSI SISWA (${document.getElementById("filterBulan").value})` 
          : `REKAP HARIAN PRESENSI SISWA (${document.getElementById("filterTanggal").value})`;
        document.getElementById("subJudulRekap").innerHTML = `<span class="inline-block mt-1 px-3 py-0.5 bg-amber-100 text-amber-800 rounded-full font-bold text-[11px] sm:text-xs">⚠️ Silakan pilih kelas terlebih dahulu</span>`;
        document.getElementById("boxStatistik").innerHTML = "";
        document.getElementById("tabelUtama").innerHTML = `<tr><td class="p-8 text-center text-slate-400 font-medium">Pilih kelas pada opsi dropdown filter di atas.</td></tr>`;
        return;
      }

      renderStatistikSummary();

      if (currentCategory === "reguler") {
        if (currentMode === "bulanan") renderRekapBulanan(kelas);
        else renderRekapHarian(kelas);
      } else {
        if (currentMode === "bulanan") renderRekapDzuhurBulanan(kelas);
        else renderRekapDzuhurHarian(kelas);
      }
    }

    // --- REKAP HARIAN REGULER ---
    function renderRekapHarian(kelasSelected) {
      const tgl = document.getElementById("filterTanggal").value;
      const todayStr = getTodayString();
      const infoLibur = rawLibur.find(l => formatDateStandard(l.tanggal) === tgl);

      document.getElementById("judulRekap").textContent = `REKAP HARIAN PRESENSI SISWA (${tgl})`;
      if (infoLibur) {
        document.getElementById("subJudulRekap").innerHTML = `<span class="inline-block mt-1 px-3 py-0.5 bg-purple-100 text-purple-800 rounded-full font-bold text-[11px] sm:text-xs">🎉 Hari Libur: ${infoLibur.keterangan}</span>`;
      } else {
        document.getElementById("subJudulRekap").textContent = `Kelas: ${kelasSelected}`;
      }

      let filteredMaster = rawMaster.filter(m => m.kelas === kelasSelected);
      filteredMaster.sort((a, b) => (a.nama || "").localeCompare(b.nama || "", "id", { sensitivity: "base" }));

      const tabel = document.getElementById("tabelUtama");

      let html = `<thead>
        <tr class="bg-slate-200 text-slate-700 font-bold uppercase text-[10px] sm:text-xs tracking-wider border-b border-slate-300">
          <th class="p-2 sm:p-3 border border-slate-300 sticky-col-no bg-slate-200">No</th>
          <th class="p-2 sm:p-3 border border-slate-300 text-left sticky-col-nama bg-slate-200">Nama Siswa</th>
          <th class="p-2 sm:p-3 border border-slate-300">Masuk</th>
          <th class="p-2 sm:p-3 border border-slate-300">Pulang</th>
          <th class="p-2 sm:p-3 border border-slate-300">Ket.</th>
        </tr>
      </thead><tbody class="divide-y divide-slate-200">`;

      filteredMaster.forEach((siswa, index) => {
        const studentLogs = rawLogs.filter(l => matchStudentLog(l, siswa, tgl));

        const logMasuk = studentLogs.find(l => {
          const k = getKet(l);
          return k.includes("masuk") || k.includes("terlambat") || k.includes("hadir") || k.includes("susulan");
        });
        const logPulang = studentLogs.find(l => getKet(l).includes("pulang"));
        const logManual = studentLogs.find(l => {
          const k = getKet(l);
          return k.includes("izin") || k.includes("sakit") || k.includes("alpa");
        });

        let jamMasuk = logMasuk ? (logMasuk.timestamp.split(" ")[1] || logMasuk.timestamp) : "-";
        let jamPulang = logPulang ? (logPulang.timestamp.split(" ")[1] || logPulang.timestamp) : "-";
        
        let statusBadge = '<span class="inline-block px-1.5 py-0.5 bg-rose-100 text-rose-700 rounded font-bold">Alpa</span>';
        let bgRow = (index % 2 === 0) ? "bg-white" : "bg-slate-50";

        if (logManual) {
          const k = getKet(logManual);
          if (k.includes("izin")) statusBadge = '<span class="inline-block px-1.5 py-0.5 bg-blue-100 text-blue-700 rounded font-bold">Izin</span>';
          else if (k.includes("sakit")) statusBadge = '<span class="inline-block px-1.5 py-0.5 bg-amber-100 text-amber-700 rounded font-bold">Sakit</span>';
          else statusBadge = '<span class="inline-block px-1.5 py-0.5 bg-rose-100 text-rose-700 rounded font-bold">Alpa</span>';
        } else if (logMasuk) {
          const kMasuk = getKet(logMasuk);
          if (!logPulang && isSudahLewatBatasPulang(tgl) && !kMasuk.includes("susulan") && !kMasuk.includes("hadir")) {
            statusBadge = '<span class="inline-block px-1.5 py-0.5 bg-rose-100 text-rose-700 rounded font-bold">Alpa (Tidak Pulang)</span>';
            bgRow = "bg-rose-50/50";
          } else if (kMasuk.includes("terlambat")) {
            statusBadge = '<span class="inline-block px-1.5 py-0.5 bg-amber-200 text-amber-900 rounded font-bold">Terlambat</span>';
            bgRow = "bg-amber-50/50";
          } else {
            statusBadge = '<span class="inline-block px-1.5 py-0.5 bg-emerald-200 text-emerald-900 rounded font-bold">Hadir</span>';
            bgRow = "bg-emerald-50/80";
          }
        } else if (infoLibur) {
          statusBadge = `<span class="inline-block px-1.5 py-0.5 bg-purple-100 text-purple-800 rounded font-bold">Libur</span>`;
          bgRow = "bg-purple-50/30";
        }

        html += `
          <tr class="${bgRow} cursor-pointer hover:bg-yellow-100/70 transition duration-150" onclick="sorotBarisSiswa(this)">
            <td class="p-2 sm:p-3 border border-slate-200 text-slate-500 font-medium sticky-col-no ${bgRow}">${index + 1}</td>
            <td class="p-2 sm:p-3 border border-slate-200 text-left font-bold text-slate-800 sticky-col-nama ${bgRow}">${siswa.nama}</td>
            <td class="p-2 sm:p-3 border border-slate-200 font-medium text-slate-700">${jamMasuk}</td>
            <td class="p-2 sm:p-3 border border-slate-200 font-medium text-slate-700">${jamPulang}</td>
            <td class="p-2 sm:p-3 border border-slate-200">${statusBadge}</td>
          </tr>`;
      });

      tabel.innerHTML = html + `</tbody>`;
    }

    // --- REKAP BULANAN REGULER ---
    function renderRekapBulanan(kelasSelected) {
      const ym = document.getElementById("filterBulan").value;
      const todayStr = getTodayString();
      const [year, month] = ym.split("-").map(Number);
      const totalDays = new Date(year, month, 0).getDate();

      document.getElementById("judulRekap").textContent = `REKAP BULANAN PRESENSI SISWA (${ym})`;
      document.getElementById("subJudulRekap").textContent = `Kelas: ${kelasSelected}`;

      let filteredMaster = rawMaster.filter(m => m.kelas === kelasSelected);
      filteredMaster.sort((a, b) => (a.nama || "").localeCompare(b.nama || "", "id", { sensitivity: "base" }));

      const tabel = document.getElementById("tabelUtama");

      let html = `<thead>
        <tr class="bg-slate-200 font-extrabold text-[10px] sm:text-xs text-slate-700 border-b border-slate-300">
          <th rowspan="2" class="p-1 border border-slate-300 align-middle sticky-col-no bg-slate-200">No</th>
          <th rowspan="2" class="p-1 border border-slate-300 text-left align-middle sticky-col-nama bg-slate-200">Nama Siswa</th>
          <th colspan="${totalDays}" class="p-1 border border-slate-300 bg-blue-100 text-blue-900 text-center uppercase tracking-wider font-extrabold">Tanggal</th>
          <th colspan="4" class="p-1 border border-slate-300 bg-indigo-100 text-indigo-900 text-center uppercase tracking-wider font-extrabold">Ket.</th>
        </tr>
        <tr class="bg-slate-100 font-bold text-[10px] sm:text-xs border-b border-slate-200">`;

      for (let d = 1; d <= totalDays; d++) {
        const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayOfWeek = new Date(year, month - 1, d).getDay();
        const infoLibur = rawLibur.find(l => formatDateStandard(l.tanggal) === dateStr);
        const isToday = (dateStr === todayStr);

        let bgHeader = isToday ? "bg-amber-400 text-slate-900 font-black border-x border-x-amber-600 shadow-inner z-10"
                      : (dayOfWeek === 0 || dayOfWeek === 6 ? "bg-rose-200 text-rose-800"
                      : (infoLibur ? "bg-purple-200 text-purple-800" : "text-slate-600"));
        
        html += `<th class="p-0.5 border border-slate-200 col-tanggal ${bgHeader}">
                  ${d}${isToday ? '<span class="block text-[7px] font-extrabold text-slate-900 leading-none">▲</span>' : ''}
                 </th>`;
      }

      html += `<th class="p-1 border border-slate-200 bg-emerald-100 text-emerald-800 col-tanggal" title="Hadir">H</th>
               <th class="p-1 border border-slate-200 bg-blue-100 text-blue-800 col-tanggal" title="Izin">I</th>
               <th class="p-1 border border-slate-200 bg-amber-100 text-amber-800 col-tanggal" title="Sakit">S</th>
               <th class="p-1 border border-slate-200 bg-rose-100 text-rose-800 col-tanggal" title="Alpa">A</th>
             </tr></thead><tbody>`;

      const totalStudents = filteredMaster.length;

      filteredMaster.forEach((siswa, index) => {
        let countH = 0, countI = 0, countS = 0, countA = 0;
        let bgRow = (index % 2 === 0) ? "bg-white" : "bg-slate-50";

        html += `<tr class="${bgRow} cursor-pointer hover:bg-yellow-100/70 transition duration-150" onclick="sorotBarisSiswa(this)">
                  <td class="p-1 border border-slate-200 text-slate-500 sticky-col-no ${bgRow}">${index + 1}</td>
                  <td class="p-1 border border-slate-200 text-left font-bold text-slate-800 sticky-col-nama ${bgRow}">${siswa.nama}</td>`;

        for (let d = 1; d <= totalDays; d++) {
          const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const dayOfWeek = new Date(year, month - 1, d).getDay();
          const infoLibur = rawLibur.find(l => formatDateStandard(l.tanggal) === dateStr);
          const isToday = (dateStr === todayStr);

          if (dayOfWeek === 0 || dayOfWeek === 6 || infoLibur) {
            if (index === 0) {
              let textLibur = infoLibur ? infoLibur.keterangan.toUpperCase() : (dayOfWeek === 6 ? "SABTU" : "MINGGU");
              let bgLibur = infoLibur ? "bg-purple-100 text-purple-800 border-purple-200" : "bg-rose-100 text-rose-700 border-rose-200";

              html += `<td rowspan="${totalStudents}" class="p-0.5 border col-tanggal ${bgLibur} font-extrabold text-center align-middle tracking-wider">
                        <span class="libur-text-vertical">${textLibur}</span>
                      </td>`;
            }
            continue;
          }

          if (dateStr > todayStr) {
            html += `<td class="p-0.5 border border-slate-200 col-tanggal text-slate-300 font-medium">-</td>`;
            continue;
          }

          const studentLogs = rawLogs.filter(l => matchStudentLog(l, siswa, dateStr));

          const logMasuk = studentLogs.find(l => {
            const k = getKet(l);
            return k.includes("masuk") || k.includes("terlambat") || k.includes("hadir") || k.includes("susulan");
          });
          const logPulang = studentLogs.find(l => getKet(l).includes("pulang"));
          const logManual = studentLogs.find(l => {
            const k = getKet(l);
            return k.includes("izin") || k.includes("sakit") || k.includes("alpa");
          });

          let code = "A";
          let bgCell = isToday ? "bg-amber-200 text-slate-900 font-black" : "bg-rose-100 text-rose-800 font-bold";

          if (logManual) {
            const k = getKet(logManual);
            if (k.includes("izin")) { code = "I"; countI++; bgCell = "bg-blue-100 text-blue-800 font-bold"; }
            else if (k.includes("sakit")) { code = "S"; countS++; bgCell = "bg-amber-100 text-amber-800 font-bold"; }
            else { code = "A"; countA++; bgCell = "bg-rose-100 text-rose-800 font-bold"; }
          } else if (logMasuk) {
            const kMasuk = getKet(logMasuk);
            if (!logPulang && isSudahLewatBatasPulang(dateStr) && !kMasuk.includes("susulan") && !kMasuk.includes("hadir")) {
              code = "A"; countA++; bgCell = "bg-rose-100 text-rose-800 font-bold";
            } else {
              code = "H"; countH++; bgCell = "bg-emerald-100 text-emerald-800 font-bold";
            }
          } else {
            countA++;
          }

          html += `<td class="p-0.5 border border-slate-200 col-tanggal ${bgCell}">${code}</td>`;
        }

        html += `<td class="p-1 border border-slate-200 font-black bg-emerald-50 text-emerald-700 col-tanggal">${countH}</td>
                 <td class="p-1 border border-slate-200 font-black bg-blue-50 text-blue-700 col-tanggal">${countI}</td>
                 <td class="p-1 border border-slate-200 font-black bg-amber-50 text-amber-700 col-tanggal">${countS}</td>
                 <td class="p-1 border border-slate-200 font-black bg-rose-50 text-rose-700 col-tanggal">${countA}</td></tr>`;
      });

      tabel.innerHTML = html + `</tbody>`;
    }

    // --- REKAP HARIAN SHALAT DZUHUR ---
    function renderRekapDzuhurHarian(kelasSelected) {
      const tgl = document.getElementById("filterTanggal").value;
      const partsTgl = tgl.split("-");
      const dObj = new Date(partsTgl[0], partsTgl[1] - 1, partsTgl[2]);
      
      if (dObj.getDay() === 5) {
        document.getElementById("judulRekap").textContent = `REKAP HARIAN SHALAT DZUHUR BERJAMAAH (${tgl})`;
        document.getElementById("subJudulRekap").textContent = `Kelas: ${kelasSelected}`;
        document.getElementById("boxStatistik").className = "";
        document.getElementById("boxStatistik").innerHTML = `
          <div class="bg-amber-50 border border-amber-300 text-amber-900 p-3 rounded-xl text-center font-bold text-xs sm:text-sm my-2">
            🕌 Hari Jumat tidak ada presensi Shalat Dzuhur di sekolah (Siswa Kepulangan/Jum'atan).
          </div>`;
        document.getElementById("tabelUtama").innerHTML = `<tr><td class="p-6 text-slate-400 font-medium">Tidak ada jadwal presensi Dzuhur pada hari Jumat.</td></tr>`;

      document.getElementById("judulRekap").textContent = `REKAP HARIAN SHALAT DZUHUR BERJAMAAH (${tgl})`;
      document.getElementById("subJudulRekap").textContent = `Kelas: ${kelasSelected}`;

      let filteredMaster = rawMaster.filter(m => m.kelas === kelasSelected);
      filteredMaster.sort((a, b) => (a.nama || "").localeCompare(b.nama || "", "id", { sensitivity: "base" }));

      let countHadir = 0, countBelum = 0, countSakit = 0, countIzin = 0, countAlpa = 0;
      let html = `<thead><tr class="bg-emerald-100 text-emerald-950 font-bold uppercase text-[10px] sm:text-xs">
        <th class="p-2 border border-emerald-200 sticky-col-no bg-emerald-100">No</th>
        <th class="p-2 border border-emerald-200 text-left sticky-col-nama bg-emerald-100">Nama Siswa</th>
        <th class="p-2 border border-emerald-200">Jam Scan Dzuhur</th>
        <th class="p-2 border border-emerald-200">Status Shalat / Keterangan</th>
      </tr></thead><tbody>`;

      filteredMaster.forEach((siswa, index) => {
        const studentLogs = rawLogs.filter(l => matchStudentLog(l, siswa, tgl));
        const logManual = studentLogs.find(l => {
          const k = getKet(l);
          return k.includes("izin") || k.includes("sakit") || k.includes("alpa");
        });
        const logDzu = rawDzuhur.find(d => matchStudentLog(d, siswa, tgl));

        let jamScan = logDzu ? (logDzu.jam || logDzu.timestamp.split(" ")[1] || "-") : "-";
        let statusBadge = "";

        if (logDzu) {
          statusBadge = '<span class="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded-full font-extrabold">🕌 Hadir Dzuhur</span>';
          countHadir++;
        } else if (logManual) {
          const k = getKet(logManual);
          if (k.includes("sakit")) {
            statusBadge = '<span class="px-2 py-0.5 bg-amber-100 text-amber-800 rounded-full font-bold">Sakit (S)</span>';
            countSakit++;
          } else if (k.includes("izin")) {
            statusBadge = '<span class="px-2 py-0.5 bg-blue-100 text-blue-800 rounded-full font-bold">Izin (I)</span>';
            countIzin++;
          } else {
            statusBadge = '<span class="px-2 py-0.5 bg-rose-100 text-rose-800 rounded-full font-bold">Alpa (A)</span>';
            countAlpa++;
          }
        } else {
          statusBadge = '<span class="px-2 py-0.5 bg-rose-100 text-rose-700 rounded-full font-bold">Belum Dzuhur</span>';
          countBelum++;
        }

        html += `<tr class="hover:bg-emerald-50 cursor-pointer" onclick="sorotBarisSiswa(this)">
          <td class="p-2 border sticky-col-no bg-white">${index + 1}</td>
          <td class="p-2 border text-left font-bold sticky-col-nama bg-white">${siswa.nama}</td>
          <td class="p-2 border font-medium text-slate-700">${jamScan}</td>
          <td class="p-2 border">${statusBadge}</td>
        </tr>`;
      });

      document.getElementById("boxStatistik").className = "";
      document.getElementById("boxStatistik").innerHTML = `
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 max-w-2xl mx-auto my-2">
          <div class="bg-emerald-50 border border-emerald-300 p-2 rounded-xl text-center">
            <p class="text-[10px] font-bold uppercase text-emerald-700">Hadir Dzuhur</p>
            <p class="text-lg font-black text-emerald-900">${countHadir}</p>
          </div>
          <div class="bg-rose-50 border border-rose-300 p-2 rounded-xl text-center">
            <p class="text-[10px] font-bold uppercase text-rose-700">Belum Dzuhur</p>
            <p class="text-lg font-black text-rose-900">${countBelum}</p>
          </div>
          <div class="bg-amber-50 border border-amber-300 p-2 rounded-xl text-center">
            <p class="text-[10px] font-bold uppercase text-amber-700">Sakit / Izin</p>
            <p class="text-lg font-black text-amber-900">${countSakit + countIzin}</p>
          </div>
          <div class="bg-slate-50 border border-slate-300 p-2 rounded-xl text-center">
            <p class="text-[10px] font-bold uppercase text-slate-700">Alpa Reguler</p>
            <p class="text-lg font-black text-slate-900">${countAlpa}</p>
          </div>
        </div>`;

      document.getElementById("tabelUtama").innerHTML = html + "</tbody>";
    }

    // --- REKAP BULANAN SHALAT DZUHUR ---
    function renderRekapDzuhurBulanan(kelasSelected) {
      const ym = document.getElementById("filterBulan").value;
      const [year, month] = ym.split("-").map(Number);
      const totalDays = new Date(year, month, 0).getDate();

      document.getElementById("judulRekap").textContent = `REKAP BULANAN SHALAT DZUHUR BERJAMAAH (${ym})`;
      document.getElementById("subJudulRekap").textContent = `Kelas: ${kelasSelected}`;

      let filteredMaster = rawMaster.filter(m => m.kelas === kelasSelected);
      filteredMaster.sort((a, b) => (a.nama || "").localeCompare(b.nama || "", "id", { sensitivity: "base" }));

      let html = `<thead><tr class="bg-emerald-100 text-emerald-950 text-[10px] sm:text-xs font-bold">
        <th class="p-1 border border-emerald-200 sticky-col-no bg-emerald-100">No</th>
        <th class="p-1 border border-emerald-200 text-left sticky-col-nama bg-emerald-100">Nama Siswa</th>`;
      
      for (let d = 1; d <= totalDays; d++) html += `<th class="p-1 border border-emerald-200 col-tanggal">${d}</th>`;
      html += `<th class="p-1 border border-emerald-200 bg-emerald-200 text-emerald-900">Total H</th></tr></thead><tbody>`;

      filteredMaster.forEach((siswa, index) => {
        let totalDzuhur = 0;
        html += `<tr class="hover:bg-emerald-50 cursor-pointer" onclick="sorotBarisSiswa(this)">
          <td class="p-1 border sticky-col-no bg-white">${index + 1}</td>
          <td class="p-1 border text-left font-bold sticky-col-nama bg-white">${siswa.nama}</td>`;

        for (let d = 1; d <= totalDays; d++) {
          const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const dayOfWeek = new Date(year, month - 1, d).getDay();

          if (dayOfWeek === 0 || dayOfWeek === 5 || dayOfWeek === 6) {
            html += `<td class="p-1 border col-tanggal bg-slate-100 text-slate-400 font-bold" title="Tidak ada Dzuhur">-</td>`;
            continue;
          }

          const isDzuhur = rawDzuhur.some(dz => matchStudentLog(dz, siswa, dateStr));
          const studentLogs = rawLogs.filter(l => matchStudentLog(l, siswa, dateStr));
          const logManual = studentLogs.find(l => {
            const k = getKet(l);
            return k.includes("izin") || k.includes("sakit") || k.includes("alpa");
          });

          if (isDzuhur) {
            totalDzuhur++;
            html += `<td class="p-1 border col-tanggal bg-emerald-200 text-emerald-950 font-black" title="Hadir Dzuhur">🕌</td>`;
          } else if (logManual) {
            const k = getKet(logManual);
            if (k.includes("sakit")) {
              html += `<td class="p-1 border col-tanggal bg-amber-100 text-amber-800 font-bold" title="Sakit">S</td>`;
            } else if (k.includes("izin")) {
              html += `<td class="p-1 border col-tanggal bg-blue-100 text-blue-800 font-bold" title="Izin">I</td>`;
            } else {
              html += `<td class="p-1 border col-tanggal bg-rose-100 text-rose-800 font-bold" title="Alpa">A</td>`;
            }
          } else {
            html += `<td class="p-1 border col-tanggal text-slate-300 font-medium" title="Belum Scan Dzuhur">-</td>`;
          }
        }
        
        html += `<td class="p-1 border font-black bg-emerald-50 text-emerald-900">${totalDzuhur}</td></tr>`;
      });

      document.getElementById("boxStatistik").innerHTML = "";
      document.getElementById("tabelUtama").innerHTML = html + "</tbody>";
    }

    function downloadExcel() {
      const kelas = document.getElementById("filterKelas").value;
      if (!kelas) { alert("Pilih kelas terlebih dahulu!"); return; }
      const password = prompt("Masukkan Password Guru untuk mengunduh rekap Excel:");
      if (password !== "GURU2026") { alert("❌ Password Salah!"); return; }

      const table = document.getElementById("tabelUtama");
      const filename = `Rekap_${currentCategory.toUpperCase()}_${currentMode.toUpperCase()}_Kelas_${kelas}.xlsx`;
      const wb = XLSX.utils.table_to_book(table, { sheet: "Rekap Presensi" });
      XLSX.writeFile(wb, filename);
    }
  </script>
</body>
