<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Kehadiran Bulanan - SMPN 1 RANCAH</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .th-sticky { position: sticky; left: 0; z-index: 10; background-color: #f8fafc; }
    .td-sticky { position: sticky; left: 0; z-index: 5; background-color: #ffffff; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-3 md:p-6">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- HEADER & KONTROL FILTER -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-2">
          <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center font-bold text-lg">
            <i class="fa-solid fa-calendar-check"></i>
          </div>
          <div>
            <h1 class="text-xl font-extrabold text-slate-800">Rekap Kehadiran Bulanan</h1>
            <p class="text-xs font-semibold text-blue-600">SMPN 1 RANCAH</p>
          </div>
        </div>
      </div>

      <!-- Filter Kelas, Bulan, Tahun -->
      <div class="flex flex-wrap items-center gap-3">
        <div>
          <label class="block text-[10px] font-bold uppercase text-slate-500 mb-0.5">Kelas</label>
          <select id="filterKelas" onchange="renderRekap()"
            class="px-3 py-2 border border-slate-300 rounded-lg text-xs font-bold focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option value="">-- Pilih Kelas --</option>
          </select>
        </div>

        <div>
          <label class="block text-[10px] font-bold uppercase text-slate-500 mb-0.5">Bulan</label>
          <select id="filterBulan" onchange="renderRekap()"
            class="px-3 py-2 border border-slate-300 rounded-lg text-xs font-bold focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option value="1">Januari</option>
            <option value="2">Februari</option>
            <option value="3">Maret</option>
            <option value="4">April</option>
            <option value="5">Mei</option>
            <option value="6">Juni</option>
            <option value="7">Juli</option>
            <option value="8">Agustus</option>
            <option value="9">September</option>
            <option value="10">Oktober</option>
            <option value="11">November</option>
            <option value="12">Desember</option>
          </select>
        </div>

        <div>
          <label class="block text-[10px] font-bold uppercase text-slate-500 mb-0.5">Tahun</label>
          <select id="filterTahun" onchange="renderRekap()"
            class="px-3 py-2 border border-slate-300 rounded-lg text-xs font-bold focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </select>
        </div>

        <div class="self-end">
          <button onclick="loadDataServer()" class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white px-3.5 py-2 rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-rotate"></i> Refresh Data
          </button>
        </div>
      </div>
    </div>

    <!-- STATISTIK RINGKASAN -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
        <span class="block text-[10px] font-bold uppercase text-slate-400">Hari Efektif (HK)</span>
        <span id="statHariEfektif" class="text-xl font-extrabold text-slate-800">0 Hari</span>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
        <span class="block text-[10px] font-bold uppercase text-emerald-500">Total Hadir</span>
        <span id="statHadir" class="text-xl font-extrabold text-emerald-600">0</span>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
        <span class="block text-[10px] font-bold uppercase text-blue-500">Total Izin</span>
        <span id="statIzin" class="text-xl font-extrabold text-blue-600">0</span>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
        <span class="block text-[10px] font-bold uppercase text-amber-500">Total Sakit</span>
        <span id="statSakit" class="text-xl font-extrabold text-amber-600">0</span>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center col-span-2 md:col-span-1">
        <span class="block text-[10px] font-bold uppercase text-rose-500">Total Alpa</span>
        <span id="statAlpa" class="text-xl font-extrabold text-rose-600">0</span>
      </div>
    </div>

    <!-- TABEL REKAP BULANAN -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <!-- Loading Indicator -->
      <div id="loading" class="p-8 text-center space-y-3">
        <i class="fa-solid fa-spinner fa-spin text-3xl text-blue-600"></i>
        <p class="text-xs font-semibold text-slate-500">Memuat data rekap kehadiran...</p>
      </div>

      <!-- Wrapper Tabel -->
      <div id="tableWrapper" class="hidden overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr id="tableHeader" class="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
              <!-- Render otomatis via JS -->
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100 font-medium text-slate-700">
            <!-- Render otomatis via JS -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- LEGEND / KETERANGAN SYMBOL -->
    <div class="bg-white p-4 rounded-xl border border-slate-200 flex flex-wrap items-center justify-between gap-4 text-xs font-semibold text-slate-600">
      <div class="flex flex-wrap items-center gap-4">
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span> H = Hadir</span>
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span> I = Izin</span>
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span> S = Sakit</span>
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-rose-500 inline-block"></span> A = Alpa</span>
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-rose-200 inline-block border border-rose-300"></span> L = Libur / Cuti</span>
      </div>
      <div class="text-slate-400 text-[11px]">
        * Hari Minggu, Sabtu & Cuti Bersama otomatis dinyatakan Libur dan tidak masuk hitungan alpa.
      </div>
    </div>

  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzq05A9BpVJFjNkHn7p2QDjbaY2ajsWjVXk5sVDkH3rStFaAC5XgEkndZSg39zOLX_2/exec";

    // DAFTAR CUTI BERSAMA & HARI LIBUR NASIONAL 2026 (Format: YYYY-MM-DD)
    // Silakan tambahkan tanggal libur nasional/cuti bersama lainnya di sini
    const DAFTAR_LIBUR_NASIONAL = [
      "2026-01-01", // Tahun Baru 2026
      "2026-01-27", // Isra Mikraj
      "2026-02-17", // Tahun Baru Imlek
      "2026-03-19", // Hari Raya Nyepi
      "2026-03-20", // Cuti Bersama Idul Fitri / Nyepi
      "2026-03-21", // Idul Fitri 1447 H
      "2026-03-22", // Idul Fitri 1447 H
      "2026-03-23", // Cuti Bersama Idul Fitri
      "2026-04-03", // Wafat Yesus Kristus
      "2026-05-01", // Hari Buruh
      "2026-05-14", // Kenaikan Yesus Kristus
      "2026-05-27", // Idul Adha 1447 H
      "2026-06-01", // Hari Lahir Pancasila
      "2026-06-16", // Tahun Baru Islam 1448 H
      "2026-08-17", // Hari Kemerdekaan RI
      "2026-08-25", // Maulid Nabi Muhammad SAW
      "2026-12-25"  // Hari Natal
    ];

    let masterSiswa = [];
    let logPresensi = [];

    document.addEventListener("DOMContentLoaded", () => {
      initTahunSelect();
      loadDataServer();
    });

    function initTahunSelect() {
      const selectTahun = document.getElementById("filterTahun");
      const currentYear = new Date().getFullYear();
      selectTahun.innerHTML = "";
      for(let y = currentYear - 1; y <= currentYear + 1; y++) {
        const opt = document.createElement("option");
        opt.value = y;
        opt.textContent = y;
        if(y === currentYear) opt.selected = true;
        selectTahun.appendChild(opt);
      }
      
      const currentMonth = new Date().getMonth() + 1;
      document.getElementById("filterBulan").value = currentMonth;
    }

    function loadDataServer() {
      document.getElementById("loading").classList.remove("hidden");
      document.getElementById("tableWrapper").classList.add("hidden");

      fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
          masterSiswa = data.master || [];
          logPresensi = data.log || data.presensi || [];
          populateKelas();
          renderRekap();
        })
        .catch(err => {
          alert("Gagal memuat data dari server!");
          console.error(err);
        })
        .finally(() => {
          document.getElementById("loading").classList.add("hidden");
          document.getElementById("tableWrapper").classList.remove("hidden");
        });
    }

    function populateKelas() {
      const selectKelas = document.getElementById("filterKelas");
      const currentSelected = selectKelas.value;
      let setKelas = new Set();
      masterSiswa.forEach(s => { if(s.kelas) setKelas.add(s.kelas); });

      selectKelas.innerHTML = '<option value="">-- Semua Kelas --</option>';
      [...setKelas].sort().forEach(k => {
        const opt = document.createElement("option");
        opt.value = k;
        opt.textContent = `Kelas ${k}`;
        if(k === currentSelected) opt.selected = true;
        selectKelas.appendChild(opt);
      });
    }

    // MEMERIKSA APAKAH TANGGAL TERSEBUT LIBUR (Sabtu/Minggu atau Cuti Bersama)
    function checkIsLibur(year, month, day) {
      const dateObj = new Date(year, month - 1, day);
      const dayOfWeek = dateObj.getDay(); // 0 = Minggu, 6 = Sabtu

      // Format ISO YYYY-MM-DD
      const mm = String(month).padStart(2, '0');
      const dd = String(day).padStart(2, '0');
      const dateStr = `${year}-${mm}-${dd}`;

      // 1. Hari Minggu (0) & Sabtu (6) dianggap libur
      if (dayOfWeek === 0 || dayOfWeek === 6) {
        return { isLibur: true, alasan: "Akhir Pekan" };
      }

      // 2. Cek apakah ada di daftar libur nasional / cuti bersama
      if (DAFTAR_LIBUR_NASIONAL.includes(dateStr)) {
        return { isLibur: true, alasan: "Cuti Bersama / Libur Nasional" };
      }

      return { isLibur: false, alasan: "" };
    }

    function renderRekap() {
      const kelasSelected = document.getElementById("filterKelas").value;
      const bulan = parseInt(document.getElementById("filterBulan").value);
      const tahun = parseInt(document.getElementById("filterTahun").value);

      // Hitung jumlah hari dalam bulan
      const totalHariBulan = new Date(tahun, bulan, 0).getDate();

      // Filter siswa berdasarkan kelas
      const siswaFiltered = kelasSelected 
        ? masterSiswa.filter(s => s.kelas === kelasSelected)
        : masterSiswa;

      // Map presensi berdasarkan NISN & Tanggal (YYYY-MM-DD)
      let presensiMap = {};
      logPresensi.forEach(item => {
        let tglStr = item.tanggal;
        if (tglStr && tglStr.includes("T")) tglStr = tglStr.split("T")[0];
        const key = `${item.nisn}_${tglStr}`;
        presensiMap[key] = item.status || "Hadir";
      });

      // 1. BUILD HEADER TABEL
      const thead = document.getElementById("tableHeader");
      let headerHTML = `
        <th class="p-3 th-sticky shadow-sm min-w-[40px] text-center border-r border-slate-200">No</th>
        <th class="p-3 th-sticky shadow-sm min-w-[180px] border-r border-slate-200">Nama Siswa</th>
        <th class="p-3 text-center border-r border-slate-200 min-w-[60px]">Kelas</th>
      `;

      let totalHariEfektif = 0;
      let statusTanggalList = [];

      for (let d = 1; d <= totalHariBulan; d++) {
        const liburInfo = checkIsLibur(tahun, bulan, d);
        statusTanggalList.push(liburInfo);

        if (liburInfo.isLibur) {
          headerHTML += `<th class="p-2 text-center min-w-[32px] bg-rose-100/70 text-rose-700 font-bold border-r border-slate-200" title="${liburInfo.alasan}">${d}</th>`;
        } else {
          totalHariEfektif++;
          headerHTML += `<th class="p-2 text-center min-w-[32px] border-r border-slate-200">${d}</th>`;
        }
      }

      headerHTML += `
        <th class="p-2 text-center bg-emerald-50 text-emerald-700 font-bold border-r border-slate-200 min-w-[40px]">H</th>
        <th class="p-2 text-center bg-blue-50 text-blue-700 font-bold border-r border-slate-200 min-w-[40px]">I</th>
        <th class="p-2 text-center bg-amber-50 text-amber-700 font-bold border-r border-slate-200 min-w-[40px]">S</th>
        <th class="p-2 text-center bg-rose-50 text-rose-700 font-bold border-r border-slate-200 min-w-[40px]">A</th>
        <th class="p-3 text-center bg-slate-200 text-slate-800 font-bold min-w-[60px]">%</th>
      `;
      thead.innerHTML = headerHTML;

      // 2. BUILD BODY TABEL
      const tbody = document.getElementById("tableBody");
      if (siswaFiltered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${totalHariBulan + 8}" class="p-6 text-center text-slate-400">Tidak ada data siswa.</td></tr>`;
        updateStatistik(totalHariEfektif, 0, 0, 0, 0);
        return;
      }

      let grandHadir = 0, grandIzin = 0, grandSakit = 0, grandAlpa = 0;
      let bodyHTML = "";

      siswaFiltered.forEach((siswa, idx) => {
        let countH = 0, countI = 0, countS = 0, countA = 0;

        let rowHTML = `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-2.5 td-sticky shadow-sm text-center border-r border-slate-200 font-bold text-slate-500">${idx + 1}</td>
            <td class="p-2.5 td-sticky shadow-sm border-r border-slate-200 font-bold text-slate-800 truncate max-w-[180px]" title="${siswa.nama}">${siswa.nama}</td>
            <td class="p-2.5 text-center border-r border-slate-200 font-semibold text-slate-600">${siswa.kelas || '-'}</td>
        `;

        for (let d = 1; d <= totalHariBulan; d++) {
          const isLibur = statusTanggalList[d - 1].isLibur;

          if (isLibur) {
            // HARI LIBUR / CUTI BERSAMA
            rowHTML += `<td class="p-2 text-center border-r border-slate-200 bg-rose-50 text-rose-400 font-bold">L</td>`;
          } else {
            // HARI EFEKTIF SEKOLAH
            const mm = String(bulan).padStart(2, '0');
            const dd = String(d).padStart(2, '0');
            const dateStr = `${tahun}-${mm}-${dd}`;
            const key = `${siswa.nisn}_${dateStr}`;
            const st = presensiMap[key];

            if (st === "Hadir") {
              countH++;
              rowHTML += `<td class="p-2 text-center border-r border-slate-200 text-emerald-600 font-bold bg-emerald-50/50">H</td>`;
            } else if (st === "Izin") {
              countI++;
              rowHTML += `<td class="p-2 text-center border-r border-slate-200 text-blue-600 font-bold bg-blue-50/50">I</td>`;
            } else if (st === "Sakit") {
              countS++;
              rowHTML += `<td class="p-2 text-center border-r border-slate-200 text-amber-600 font-bold bg-amber-50/50">S</td>`;
            } else if (st === "Alpa") {
              countA++;
              rowHTML += `<td class="p-2 text-center border-r border-slate-200 text-rose-600 font-bold bg-rose-50/50">A</td>`;
            } else {
              // Jika hari sudah lewat dan belum absen -> Dianggap Alpa
              const targetDate = new Date(tahun, bulan - 1, d);
              const today = new Date();
              today.setHours(0,0,0,0);

              if (targetDate <= today) {
                countA++;
                rowHTML += `<td class="p-2 text-center border-r border-slate-200 text-rose-600 font-bold bg-rose-50/50">A</td>`;
              } else {
                rowHTML += `<td class="p-2 text-center border-r border-slate-200 text-slate-300">-</td>`;
              }
            }
          }
        }

        const persen = totalHariEfektif > 0 
          ? Math.round((countH / totalHariEfektif) * 100) 
          : 0;

        grandHadir += countH;
        grandIzin += countI;
        grandSakit += countS;
        grandAlpa += countA;

        rowHTML += `
          <td class="p-2 text-center border-r border-slate-200 font-extrabold text-emerald-600 bg-emerald-50/30">${countH}</td>
          <td class="p-2 text-center border-r border-slate-200 font-extrabold text-blue-600 bg-blue-50/30">${countI}</td>
          <td class="p-2 text-center border-r border-slate-200 font-extrabold text-amber-600 bg-amber-50/30">${countS}</td>
          <td class="p-2 text-center border-r border-slate-200 font-extrabold text-rose-600 bg-rose-50/30">${countA}</td>
          <td class="p-2 text-center font-extrabold text-slate-800 bg-slate-100">${persen}%</td>
        </tr>`;

        bodyHTML += rowHTML;
      });

      tbody.innerHTML = bodyHTML;
      updateStatistik(totalHariEfektif, grandHadir, grandIzin, grandSakit, grandAlpa);
    }

    function updateStatistik(hk, h, i, s, a) {
      document.getElementById("statHariEfektif").textContent = `${hk} Hari`;
      document.getElementById("statHadir").textContent = h;
      document.getElementById("statIzin").textContent = i;
      document.getElementById("statSakit").textContent = s;
      document.getElementById("statAlpa").textContent = a;
    }
  </script>
</body>
</html>
