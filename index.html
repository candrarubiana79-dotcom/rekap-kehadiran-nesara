<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Presensi Siswa</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- XLSX Library untuk Export Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8">

  <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-md p-6">
    <h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">REKAPITULASI PRESENSI SISWA</h1>

    <!-- Filter Control -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200">
      <div>
        <label class="block text-sm font-semibold text-slate-600 mb-1">Mode Rekap:</label>
        <select id="filterMode" onchange="renderTable()" class="w-full p-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500">
          <option value="harian">Harian</option>
          <option value="bulanan">Bulanan</option>
        </select>
      </div>

      <div id="boxTanggal">
        <label class="block text-sm font-semibold text-slate-600 mb-1">Pilih Tanggal:</label>
        <input type="date" id="filterTanggal" onchange="renderTable()" class="w-full p-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500">
      </div>

      <div id="boxBulan" class="hidden">
        <label class="block text-sm font-semibold text-slate-600 mb-1">Pilih Bulan:</label>
        <input type="month" id="filterBulan" onchange="renderTable()" class="w-full p-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-600 mb-1">Pilih Kelas:</label>
        <select id="filterKelas" onchange="renderTable()" class="w-full p-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500">
          <option value="">-- Semua Kelas --</option>
        </select>
      </div>

      <div class="flex items-end">
        <button onclick="downloadExcel()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-md transition shadow">
          Download Excel
        </button>
      </div>
    </div>

    <!-- Judul Laporan -->
    <div class="text-center mb-4">
      <h2 id="judulRekap" class="text-xl font-bold text-slate-700"></h2>
      <p id="subJudulRekap" class="text-sm text-slate-500"></p>
    </div>

    <!-- Tabel Data -->
    <div class="overflow-x-auto">
      <table id="tabelUtama" class="w-full text-center border-collapse border border-slate-300 text-sm">
        <!-- Isian tabel digenerate via JS -->
      </table>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzq05A9BpVJFjNkHn7p2QDjbaY2ajsWjVXk5sVDkH3rStFaAC5XgEkndZSg39zOLX_2/exec";

    let rawMaster = [];
    let rawLogs = [];

    document.addEventListener("DOMContentLoaded", () => {
      // Tanggal Lokal (WIB)
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      
      document.getElementById("filterTanggal").value = `${yyyy}-${mm}-${dd}`;
      document.getElementById("filterBulan").value = `${yyyy}-${mm}`;
      
      loadData();
    });

    function loadData() {
      document.getElementById("tabelUtama").innerHTML = '<tr><td class="p-4 text-slate-500">Memuat data dari Google Sheets...</td></tr>';
      
      fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
          rawMaster = data.master || [];
          rawLogs = data.logs || [];

          if (rawMaster.length === 0 && rawLogs.length === 0) {
            document.getElementById("tabelUtama").innerHTML = '<tr><td class="p-4 text-rose-500 font-semibold">Data masih kosong di Google Sheets!</td></tr>';
            return;
          }

          initKelasDropdown();
          renderTable();
        })
        .catch(err => {
          console.error(err);
          document.getElementById("tabelUtama").innerHTML = `<tr class="text-rose-600"><td class="p-4">Gagal mengambil data. Pastikan Web App URL sudah benar.<br><small>${err}</small></td></tr>`;
        });
    }

    function initKelasDropdown() {
      const select = document.getElementById("filterKelas");
      const currentVal = select.value;
      
      let kelasSet = new Set();
      rawMaster.forEach(s => { if(s.kelas) kelasSet.add(s.kelas); });
      rawLogs.forEach(l => { if(l.kelas) kelasSet.add(l.kelas); });
      
      const kelasList = [...kelasSet].sort();

      select.innerHTML = '<option value="">-- Semua Kelas --</option>';
      kelasList.forEach(k => {
        const opt = document.createElement("option");
        opt.value = k;
        opt.textContent = `Kelas ${k}`;
        select.appendChild(opt);
      });
      select.value = currentVal;
    }

    function renderTable() {
      const mode = document.getElementById("filterMode").value;
      const kelas = document.getElementById("filterKelas").value;

      if (mode === "bulanan") {
        document.getElementById("boxBulan").classList.remove("hidden");
        document.getElementById("boxTanggal").classList.add("hidden");
        renderRekapBulanan(kelas);
      } else {
        document.getElementById("boxBulan").classList.add("hidden");
        document.getElementById("boxTanggal").classList.remove("hidden");
        renderRekapHarian(kelas);
      }
    }

    // --- REKAP HARIAN ---
    function renderRekapHarian(kelasSelected) {
      const tgl = document.getElementById("filterTanggal").value;
      document.getElementById("judulRekap").textContent = `REKAP HARIAN PRESENSI SISWA (${tgl})`;
      document.getElementById("subJudulRekap").textContent = kelasSelected ? `Kelas: ${kelasSelected}` : "Seluruh Kelas";

      // Jika data master kosong, pakai data log yang ada
      let sourceList = rawMaster.length > 0 ? rawMaster : rawLogs;
      let filteredMaster = kelasSelected ? sourceList.filter(m => m.kelas === kelasSelected) : sourceList;

      if (rawMaster.length === 0) {
        let uniqueMap = new Map();
        filteredMaster.forEach(item => {
          let key = item.kode || item.nama;
          if (!uniqueMap.has(key)) {
            uniqueMap.set(key, {
              nisn: item.kode || "-",
              nama: item.nama,
              kelas: item.kelas
            });
          }
        });
        filteredMaster = Array.from(uniqueMap.values());
      }

      const tabel = document.getElementById("tabelUtama");

      let html = `
        <thead>
          <tr class="bg-slate-100 font-bold border-b border-slate-300">
            <th class="border border-slate-300 p-2">No</th>
            <th class="border border-slate-300 p-2">NISN</th>
            <th class="border border-slate-300 p-2 text-left">Nama Siswa</th>
            <th class="border border-slate-300 p-2">Kelas</th>
            <th class="border border-slate-300 p-2">Jam Masuk</th>
            <th class="border border-slate-300 p-2">Jam Pulang</th>
            <th class="border border-slate-300 p-2">Status</th>
          </tr>
        </thead>
        <tbody>`;

      if (filteredMaster.length === 0) {
        html += `<tr><td colspan="7" class="p-4 text-slate-400">Tidak ada data presensi pada tanggal ini.</td></tr></tbody>`;
        tabel.innerHTML = html;
        return;
      }

      filteredMaster.forEach((siswa, index) => {
        const studentLogs = rawLogs.filter(l => {
          const sameDate = String(l.tanggal).trim() === String(tgl).trim();
          const matchKode = l.kode && siswa.nisn && String(l.kode).trim() === String(siswa.nisn).trim();
          const matchNama = String(l.nama).toLowerCase().trim() === String(siswa.nama).toLowerCase().trim();
          return sameDate && (matchKode || matchNama);
        });

        const logMasuk = studentLogs.find(l => l.keterangan === "Masuk" || l.keterangan === "Terlambat Masuk");
        const logPulang = studentLogs.find(l => l.keterangan === "Pulang");
        const logManual = studentLogs.find(l => ["Izin", "Sakit", "Alpa"].includes(l.keterangan));

        let jamMasuk = logMasuk ? (logMasuk.timestamp.split(" ")[1] || logMasuk.timestamp) : "-";
        let jamPulang = logPulang ? (logPulang.timestamp.split(" ")[1] || logPulang.timestamp) : "-";
        let status = "Alpa";
        let bgRow = "";

        if (logManual) {
          status = logManual.keterangan;
          if (status === "Izin") bgRow = "bg-blue-50 text-blue-800";
          else if (status === "Sakit") bgRow = "bg-yellow-50 text-yellow-800";
          else bgRow = "bg-rose-50 text-rose-800";
        } else if (logMasuk) {
          if (!logPulang) {
            status = logMasuk.keterangan === "Terlambat Masuk" ? "Terlambat (Belum Pulang)" : "Hadir (Belum Pulang)";
            bgRow = "bg-emerald-50 text-emerald-900";
          } else if (logMasuk.keterangan === "Terlambat Masuk") {
            status = "Terlambat";
            bgRow = "bg-yellow-100 text-yellow-900";
          } else {
            status = "Hadir Lengkap";
            bgRow = "bg-emerald-100 text-emerald-900 font-medium";
          }
        } else if (studentLogs.length > 0) {
          status = studentLogs[0].keterangan;
        }

        html += `
          <tr class="${bgRow} hover:bg-slate-100 transition">
            <td class="border border-slate-300 p-2">${index + 1}</td>
            <td class="border border-slate-300 p-2 font-mono">${siswa.nisn || '-'}</td>
            <td class="border border-slate-300 p-2 text-left font-medium">${siswa.nama}</td>
            <td class="border border-slate-300 p-2">${siswa.kelas || '-'}</td>
            <td class="border border-slate-300 p-2">${jamMasuk}</td>
            <td class="border border-slate-300 p-2">${jamPulang}</td>
            <td class="border border-slate-300 p-2 font-semibold">${status}</td>
          </tr>`;
      });

      html += `</tbody>`;
      tabel.innerHTML = html;
    }

    // --- REKAP BULANAN ---
    function renderRekapBulanan(kelasSelected) {
      const ym = document.getElementById("filterBulan").value;
      const [year, month] = ym.split("-").map(Number);
      const totalDays = new Date(year, month, 0).getDate();

      document.getElementById("judulRekap").textContent = `REKAP BULANAN PRESENSI SISWA (${ym})`;
      document.getElementById("subJudulRekap").textContent = kelasSelected ? `Kelas: ${kelasSelected}` : "Seluruh Kelas";

      let sourceList = rawMaster.length > 0 ? rawMaster : rawLogs;
      let filteredMaster = kelasSelected ? sourceList.filter(m => m.kelas === kelasSelected) : sourceList;

      if (rawMaster.length === 0) {
        let uniqueMap = new Map();
        filteredMaster.forEach(item => {
          let key = item.kode || item.nama;
          if (!uniqueMap.has(key)) {
            uniqueMap.set(key, { nisn: item.kode || "-", nama: item.nama, kelas: item.kelas });
          }
        });
        filteredMaster = Array.from(uniqueMap.values());
      }

      const tabel = document.getElementById("tabelUtama");

      let html = `<thead><tr class="bg-slate-100 font-bold border-b border-slate-300"><th class="border border-slate-300 p-1">No</th><th class="border border-slate-300 p-1 text-left">Nama Siswa</th>`;

      for (let d = 1; d <= totalDays; d++) {
        const dayOfWeek = new Date(year, month - 1, d).getDay();
        let bgHeader = (dayOfWeek === 0 || dayOfWeek === 6) ? "bg-rose-200 text-rose-800" : "";
        html += `<th class="border border-slate-300 p-1 min-w-[28px] ${bgHeader}">${d}</th>`;
      }

      html += `<th class="border border-slate-300 p-1 bg-emerald-100">H</th>
               <th class="border border-slate-300 p-1 bg-blue-100">I</th>
               <th class="border border-slate-300 p-1 bg-yellow-100">S</th>
               <th class="border border-slate-300 p-1 bg-rose-100">A</th></tr></thead><tbody>`;

      filteredMaster.forEach((siswa, index) => {
        let countH = 0, countI = 0, countS = 0, countA = 0;

        html += `<tr><td class="border border-slate-300 p-1">${index + 1}</td><td class="border border-slate-300 p-1 text-left font-medium whitespace-nowrap">${siswa.nama}</td>`;

        for (let d = 1; d <= totalDays; d++) {
          const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const dayOfWeek = new Date(year, month - 1, d).getDay();

          if (dayOfWeek === 0 || dayOfWeek === 6) {
            html += `<td class="border border-slate-300 p-1 bg-rose-100 text-rose-600 font-bold">L</td>`;
            continue;
          }

          const studentLogs = rawLogs.filter(l => {
            const sameDate = String(l.tanggal).trim() === String(dateStr).trim();
            const matchKode = l.kode && siswa.nisn && String(l.kode).trim() === String(siswa.nisn).trim();
            const matchNama = String(l.nama).toLowerCase().trim() === String(siswa.nama).toLowerCase().trim();
            return sameDate && (matchKode || matchNama);
          });

          const logMasuk = studentLogs.find(l => l.keterangan === "Masuk" || l.keterangan === "Terlambat Masuk");
          const logManual = studentLogs.find(l => ["Izin", "Sakit", "Alpa"].includes(l.keterangan));

          let code = "-";
          let bgCell = "";

          if (logManual) {
            if (logManual.keterangan === "Izin") { code = "I"; countI++; bgCell = "bg-blue-100 text-blue-800"; }
            else if (logManual.keterangan === "Sakit") { code = "S"; countS++; bgCell = "bg-yellow-100 text-yellow-800"; }
            else { code = "A"; countA++; bgCell = "bg-rose-100 text-rose-800"; }
          } else if (logMasuk) {
            code = "H"; countH++; bgCell = "bg-emerald-100 text-emerald-800 font-bold";
          }

          html += `<td class="border border-slate-300 p-1 ${bgCell}">${code}</td>`;
        }

        html += `<td class="border border-slate-300 p-1 font-bold bg-emerald-50">${countH}</td>
                 <td class="border border-slate-300 p-1 font-bold bg-blue-50">${countI}</td>
                 <td class="border border-slate-300 p-1 font-bold bg-yellow-50">${countS}</td>
                 <td class="border border-slate-300 p-1 font-bold bg-rose-50">${countA}</td></tr>`;
      });

      html += `</tbody>`;
      tabel.innerHTML = html;
    }

    function downloadExcel() {
      const table = document.getElementById("tabelUtama");
      const wb = XLSX.utils.table_to_book(table, { sheet: "Rekap Presensi" });
      XLSX.writeFile(wb, `Rekap_Presensi_${document.getElementById("filterTanggal").value}.xlsx`);
    }
  </script>
</body>
</html>
