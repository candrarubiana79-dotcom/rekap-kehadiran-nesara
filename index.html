<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Presensi Siswa v2.3 - SMPN 1 RANCAH</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- XLSX Library untuk Export Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* FORMAT TEKS VERTIKAL KOLOM LIBUR */
    .libur-text-vertical {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      white-space: nowrap;
      display: inline-block;
    }

    /* BARIS MENYALA / HIGHLIGHT SAAT DIKLIK */
    .row-highlight {
      background-color: #fef08a !important; /* Yellow-200 */
      transition: background-color 0.15s ease-in-out;
    }
    
    .row-highlight td {
      background-color: #fef08a !important;
      color: #0f172a !important;
      font-weight: 800 !important;
      border-top: 2px solid #eab308 !important;
      border-bottom: 2px solid #eab308 !important;
    }

    /* STICKY COLUMN UNTUK TAMPILAN HP */
    .sticky-col-no {
      position: sticky;
      left: 0;
      z-index: 20;
    }

    .sticky-col-nama {
      position: sticky;
      left: 36px;
      z-index: 20;
      box-shadow: 3px 0 6px -2px rgba(0, 0, 0, 0.15);
    }

    /* Custom Scrollbar Responsif */
    ::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-2 sm:p-4 md:p-6">

  <div class="max-w-7xl mx-auto space-y-3 sm:space-y-5">

    <!-- HEADER & JAM REAL-TIME -->
    <header class="bg-gradient-to-r from-blue-700 via-indigo-700 to-indigo-800 text-white rounded-2xl p-4 sm:p-6 md:p-8 shadow-lg relative overflow-hidden">
      <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>

      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 relative z-10">
        
        <!-- LOGO & JUDUL -->
        <div class="flex items-center gap-3 sm:gap-5">
          <img src="assets/logo-smpn1rancah.png" alt="Logo SMPN 1 Rancah" class="w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 object-contain drop-shadow-xl flex-shrink-0">
          
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="px-2.5 py-0.5 bg-white/20 backdrop-blur-md rounded-full text-[10px] sm:text-xs font-semibold uppercase tracking-wider text-blue-100">
                Sistem Presensi Digital
              </span>
              <span class="px-2 py-0.5 bg-amber-400 text-slate-900 font-black text-[10px] sm:text-[11px] rounded-full shadow-sm">
                v2.3
              </span>
            </div>
            <h1 class="text-lg sm:text-2xl md:text-3xl font-extrabold tracking-tight leading-tight">REKAPITULASI PRESENSI SISWA</h1>
            <p class="text-blue-200 text-xs sm:text-base font-bold mt-0.5">
              SMPN 1 RANCAH
            </p>
          </div>
        </div>

        <!-- Live Digital Clock Badge + Indikator Sync -->
        <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-xl p-3 text-left md:text-right self-stretch md:self-auto min-w-[180px] flex md:flex-col justify-between items-center md:items-end">
          <div>
            <div class="text-[10px] sm:text-xs text-blue-200 font-medium flex items-center gap-1.5 justify-start md:justify-end">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Waktu Server (WIB)
            </div>
            <div id="liveClock" class="text-lg sm:text-xl md:text-2xl font-black font-mono mt-0.5 text-white">00:00:00</div>
          </div>
          <div class="text-right">
            <div id="liveDate" class="text-[11px] sm:text-xs text-blue-100 font-medium">Memuat tanggal...</div>
            <div id="lastSync" class="text-[10px] text-emerald-300 font-semibold mt-0.5 flex items-center gap-1 justify-end">
              <i class="fa-solid fa-arrows-rotate fa-spin text-[9px]"></i> Syncing...
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- MAIN CONTAINER CARD -->
    <main class="bg-white rounded-2xl shadow-sm border border-slate-200 p-3 sm:p-5 md:p-6 space-y-4 sm:space-y-6">

      <!-- MENU TABS & ACTION BUTTONS -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-3">
        <!-- Navigation Tabs -->
        <div class="flex bg-slate-100 p-1 rounded-xl w-full sm:w-auto">
          <button id="tabHarian" onclick="switchTab('harian')" class="flex-1 sm:flex-none px-4 py-2.5 rounded-lg text-xs sm:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-2 bg-white text-blue-600 shadow-sm">
            <i class="fa-solid fa-calendar-day"></i> Presensi Harian
          </button>
          <button id="tabBulanan" onclick="switchTab('bulanan')" class="flex-1 sm:flex-none px-4 py-2.5 rounded-lg text-xs sm:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-2 text-slate-500 hover:text-slate-800">
            <i class="fa-solid fa-calendar-days"></i> Presensi Bulanan
          </button>
        </div>

        <!-- Tombol Aksi: Segarkan & Download Excel -->
        <div class="flex items-center gap-2 w-full sm:w-auto">
          <button onclick="manualRefresh()" title="Segarkan Data Sekarang" class="flex-1 sm:flex-initial bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-2.5 px-3.5 rounded-xl transition duration-150 shadow-sm flex items-center justify-center gap-2 text-xs sm:text-sm">
            <i id="iconRefresh" class="fa-solid fa-rotate"></i>
            <span>Refresh</span>
          </button>

          <button onclick="downloadExcel()" class="flex-1 sm:flex-initial bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold py-2.5 px-4 rounded-xl transition duration-150 shadow-sm flex items-center justify-center gap-2 text-xs sm:text-sm">
            <i class="fa-solid fa-file-excel text-base"></i> Export Excel
          </button>
        </div>
      </div>

      <!-- FILTER CONTROLS -->
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 bg-slate-50 p-3 sm:p-4 rounded-xl border border-slate-200/80">
        <!-- Filter Tanggal Harian -->
        <div id="boxTanggal">
          <label class="block text-[11px] font-extrabold uppercase tracking-wider text-slate-600 mb-1 flex items-center gap-1.5">
            <i class="fa-regular fa-calendar text-blue-600"></i> Pilih Tanggal:
          </label>
          <input type="date" id="filterTanggal" onchange="renderTable()" class="w-full bg-white px-3 py-2 border border-slate-300 rounded-lg text-xs sm:text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none transition min-h-[42px]">
        </div>

        <!-- Filter Bulan -->
        <div id="boxBulan" class="hidden">
          <label class="block text-[11px] font-extrabold uppercase tracking-wider text-slate-600 mb-1 flex items-center gap-1.5">
            <i class="fa-regular fa-calendar-check text-blue-600"></i> Pilih Bulan:
          </label>
          <input type="month" id="filterBulan" onchange="renderTable()" class="w-full bg-white px-3 py-2 border border-slate-300 rounded-lg text-xs sm:text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none transition min-h-[42px]">
        </div>

        <!-- Filter Kelas -->
        <div>
          <label class="block text-[11px] font-extrabold uppercase tracking-wider text-slate-600 mb-1 flex items-center gap-1.5">
            <i class="fa-solid fa-users text-blue-600"></i> Pilih Kelas:
          </label>
          <select id="filterKelas" onchange="renderTable()" class="w-full bg-white px-3 py-2 border border-slate-300 rounded-lg text-xs sm:text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none transition min-h-[42px]">
            <option value="">-- Pilih Kelas --</option>
          </select>
        </div>
      </div>

      <!-- TITLE INFORMER -->
      <div class="text-center py-1 sm:py-2 border-b border-slate-100">
        <h2 id="judulRekap" class="text-base sm:text-lg md:text-xl font-extrabold text-slate-800">REKAPITULASI PRESENSI SISWA</h2>
        <p id="subJudulRekap" class="text-xs sm:text-sm font-medium text-slate-500 mt-0.5"></p>
        <div class="flex flex-wrap items-center justify-center gap-2 mt-1.5 text-[10px]">
          <span class="bg-amber-50 text-amber-800 font-bold px-2.5 py-1 rounded-full border border-amber-200">
            💡 Sentuh nama siswa untuk sorotan baris
          </span>
          <span class="bg-amber-400 text-slate-900 font-extrabold px-2.5 py-1 rounded-full shadow-sm flex items-center gap-1">
            <i class="fa-solid fa-star text-[9px]"></i> Kolom Kuning = Tanggal Hari Ini
          </span>
        </div>
      </div>

      <!-- TABLE AREA (RESPONSIF DENGAN STICKY NAMA & HIGHLIGHT HARI INI) -->
      <div id="containerTabel" class="overflow-x-auto border border-slate-200 shadow-sm bg-white rounded-xl relative">
        <table id="tabelUtama" class="w-full text-center border-collapse text-xs sm:text-sm">
          <!-- Digenerate via JS -->
        </table>
      </div>

    </main>

    <!-- FOOTER -->
    <footer class="text-center text-xs text-slate-400 py-2">
      &copy; 2026 Presensi Digital v2.3 • <span class="font-semibold text-slate-600">SMPN 1 RANCAH</span>
    </footer>

  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzq05A9BpVJFjNkHn7p2QDjbaY2ajsWjVXk5sVDkH3rStFaAC5XgEkndZSg39zOLX_2/exec";

    let rawMaster = [];
    let rawLogs = [];
    let rawLibur = [];
    let tanggalMulaiSistem = ""; 
    let currentMode = "harian";

    // --- FUNGSI HIGHLIGHT BARIS SAAT DIKLIK ---
    function sorotBarisSiswa(trElement) {
      document.querySelectorAll("#tabelUtama tr").forEach(tr => {
        tr.classList.remove("row-highlight");
      });
      trElement.classList.add("row-highlight");
    }

    // --- REALTIME DIGITAL CLOCK ---
    function updateLiveClock() {
      const now = new Date();
      const optionsDate = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Asia/Jakarta' };
      const optionsTime = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'Asia/Jakarta' };

      document.getElementById('liveClock').textContent = now.toLocaleTimeString('id-ID', optionsTime) + " WIB";
      document.getElementById('liveDate').textContent = now.toLocaleDateString('id-ID', optionsDate);
    }
    setInterval(updateLiveClock, 1000);
    updateLiveClock();

    function getTodayString() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    // --- INITIALIZATION ---
    document.addEventListener("DOMContentLoaded", () => {
      const todayStr = getTodayString();
      const ym = todayStr.substring(0, 7);
      
      document.getElementById("filterTanggal").value = todayStr;
      document.getElementById("filterBulan").value = ym;
      
      loadData(false);

      setInterval(() => {
        loadData(true);
      }, 10000);
    });

    // --- TAB SWITCHING LOGIC ---
    function switchTab(mode) {
      currentMode = mode;
      const btnHarian = document.getElementById("tabHarian");
      const btnBulanan = document.getElementById("tabBulanan");
      const boxTanggal = document.getElementById("boxTanggal");
      const boxBulan = document.getElementById("boxBulan");

      if (mode === 'harian') {
        btnHarian.className = "flex-1 sm:flex-none px-4 py-2.5 rounded-lg text-xs sm:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-2 bg-white text-blue-600 shadow-sm";
        btnBulanan.className = "flex-1 sm:flex-none px-4 py-2.5 rounded-lg text-xs sm:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-2 text-slate-500 hover:text-slate-800";
        boxTanggal.classList.remove("hidden");
        boxBulan.classList.add("hidden");
      } else {
        btnBulanan.className = "flex-1 sm:flex-none px-4 py-2.5 rounded-lg text-xs sm:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-2 bg-white text-blue-600 shadow-sm";
        btnHarian.className = "flex-1 sm:flex-none px-4 py-2.5 rounded-lg text-xs sm:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-2 text-slate-500 hover:text-slate-800";
        boxBulan.classList.remove("hidden");
        boxTanggal.classList.add("hidden");
      }

      renderTable();
    }

    function manualRefresh() {
      loadData(false);
    }

    function loadData(isSilent = false) {
      const iconRefresh = document.getElementById("iconRefresh");
      if (iconRefresh) iconRefresh.classList.add("fa-spin");

      if (!isSilent && rawMaster.length === 0) {
        document.getElementById("tabelUtama").innerHTML = '<tr><td class="p-8 text-slate-400 font-medium"><i class="fa-solid fa-spinner fa-spin text-blue-600 mr-2"></i> Mengambil data dari server...</td></tr>';
      }
      
      fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
          rawMaster = data.master || [];
          rawLogs = data.logs || [];
          rawLibur = data.libur || [];
          tanggalMulaiSistem = data.tanggal_mulai || "";

          if (rawMaster.length === 0 && rawLogs.length === 0) {
            document.getElementById("tabelUtama").innerHTML = '<tr><td class="p-6 text-rose-500 font-semibold">Data masih kosong di spreadsheet!</td></tr>';
            return;
          }

          initKelasDropdown();
          renderTable();

          const now = new Date();
          const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'Asia/Jakarta' });
          const lastSyncEl = document.getElementById("lastSync");
          if (lastSyncEl) {
            lastSyncEl.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> ${timeStr}`;
          }
        })
        .catch(err => {
          console.error(err);
          if (!isSilent) {
            document.getElementById("tabelUtama").innerHTML = `<tr class="text-rose-600"><td class="p-6">Gagal mengambil data dari Google Sheets.<br><small class="text-slate-400">${err}</small></td></tr>`;
          }
        })
        .finally(() => {
          if (iconRefresh) iconRefresh.classList.remove("fa-spin");
        });
    }

    function initKelasDropdown() {
      const select = document.getElementById("filterKelas");
      const currentVal = select.value;
      
      let kelasSet = new Set();
      rawMaster.forEach(s => { if(s.kelas) kelasSet.add(s.kelas); });
      rawLogs.forEach(l => { if(l.kelas) kelasSet.add(l.kelas); });
      
      const kelasList = [...kelasSet].sort();

      select.innerHTML = '<option value="">-- Pilih Kelas --</option>';
      kelasList.forEach(k => {
        const opt = document.createElement("option");
        opt.value = k;
        opt.textContent = `Kelas ${k}`;
        select.appendChild(opt);
      });
      select.value = currentVal;
    }

    function renderTable() {
      const kelas = document.getElementById("filterKelas").value;

      if (!kelas) {
        document.getElementById("judulRekap").textContent = currentMode === "bulanan" 
          ? `REKAP BULANAN PRESENSI SISWA (${document.getElementById("filterBulan").value})` 
          : `REKAP HARIAN PRESENSI SISWA (${document.getElementById("filterTanggal").value})`;
        
        document.getElementById("subJudulRekap").innerHTML = `<span class="inline-block mt-1 px-3 py-1 bg-amber-100 text-amber-800 rounded-full font-bold text-xs">⚠️ Silakan pilih kelas terlebih dahulu</span>`;
        
        document.getElementById("tabelUtama").innerHTML = `
          <tr>
            <td class="p-8 sm:p-10 text-center text-slate-400 font-medium">
              <div class="flex flex-col items-center justify-center gap-2">
                <i class="fa-solid fa-users-rectangle text-4xl text-blue-500/70 animate-bounce"></i>
                <p class="text-slate-600 font-bold text-sm mt-1">Data Belum Ditampilkan</p>
                <p class="text-xs text-slate-400 max-w-sm">Silakan pilih kelas pada opsi dropdown filter di atas untuk melihat data presensi.</p>
              </div>
            </td>
          </tr>`;
        return;
      }

      if (currentMode === "bulanan") {
        renderRekapBulanan(kelas);
      } else {
        renderRekapHarian(kelas);
      }
    }

    // --- REKAP HARIAN RENDER ---
    function renderRekapHarian(kelasSelected) {
      const tgl = document.getElementById("filterTanggal").value;
      const todayStr = getTodayString();
      const infoLibur = rawLibur.find(l => l.tanggal === tgl);

      document.getElementById("judulRekap").textContent = `REKAP HARIAN PRESENSI SISWA (${tgl})`;
      
      if (infoLibur) {
        document.getElementById("subJudulRekap").innerHTML = `<span class="inline-block mt-1 px-3 py-1 bg-purple-100 text-purple-800 rounded-full font-bold text-xs">🎉 Hari Libur: ${infoLibur.keterangan}</span>`;
      } else if (tanggalMulaiSistem && tgl < tanggalMulaiSistem) {
        document.getElementById("subJudulRekap").innerHTML = `<span class="inline-block mt-1 px-3 py-1 bg-slate-100 text-slate-600 rounded-full font-bold text-xs">ℹ Sistem Belum Dimulai (Aktif Per ${tanggalMulaiSistem})</span>`;
      } else if (tgl > todayStr) {
        document.getElementById("subJudulRekap").innerHTML = `<span class="inline-block mt-1 px-3 py-1 bg-slate-100 text-slate-500 rounded-full font-bold text-xs">⏳ Tanggal Belum Berjalan</span>`;
      } else {
        document.getElementById("subJudulRekap").textContent = `Kelas: ${kelasSelected}`;
      }

      let sourceList = rawMaster.length > 0 ? rawMaster : rawLogs;
      let filteredMaster = sourceList.filter(m => m.kelas === kelasSelected);

      if (rawMaster.length === 0) {
        let uniqueMap = new Map();
        filteredMaster.forEach(item => {
          let key = item.kode || item.nama;
          if (!uniqueMap.has(key)) {
            uniqueMap.set(key, { nisn: item.kode || "-", nama: item.nama, kelas: item.kelas });
          }
        });
        filteredMaster = Array.from(uniqueMap.values());
      }

      // SOTIR NAMA DENGAN URUTAN ALFABET (A-Z)
      filteredMaster.sort((a, b) => (a.nama || "").localeCompare(b.nama || "", "id", { sensitivity: "base" }));

      const tabel = document.getElementById("tabelUtama");

      let html = `
        <thead>
          <tr class="bg-slate-200 text-slate-700 font-bold uppercase text-[11px] sm:text-xs tracking-wider border-b border-slate-300">
            <th class="p-2.5 sm:p-3 border border-slate-300 sticky-col-no bg-slate-200">No</th>
            <th class="p-2.5 sm:p-3 border border-slate-300">NISN</th>
            <th class="p-2.5 sm:p-3 border border-slate-300 text-left min-w-[150px] sm:min-w-[180px] sticky-col-nama bg-slate-200">Nama Siswa</th>
            <th class="p-2.5 sm:p-3 border border-slate-300">Kelas</th>
            <th class="p-2.5 sm:p-3 border border-slate-300">Jam Masuk</th>
            <th class="p-2.5 sm:p-3 border border-slate-300">Jam Pulang</th>
            <th class="p-2.5 sm:p-3 border border-slate-300">Status</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-200">`;

      if (filteredMaster.length === 0) {
        html += `<tr><td colspan="7" class="p-6 text-slate-400 italic">Tidak ada data siswa terdaftar pada Kelas ${kelasSelected}.</td></tr></tbody>`;
        tabel.innerHTML = html;
        return;
      }

      filteredMaster.forEach((siswa, index) => {
        const studentLogs = rawLogs.filter(l => {
          const sameDate = String(l.tanggal).trim() === String(tgl).trim();
          const matchKode = l.kode && siswa.nisn && String(l.kode).trim() === String(siswa.nisn).trim();
          const matchNama = String(l.nama).toLowerCase().trim() === String(siswa.nama).toLowerCase().trim();
          return sameDate && (matchKode || matchNama);
        });

        const logMasuk = studentLogs.find(l => l.keterangan === "Masuk" || l.keterangan === "Terlambat Masuk");
        const logPulang = studentLogs.find(l => l.keterangan === "Pulang");
        const logManual = studentLogs.find(l => ["Izin", "Sakit", "Alpa"].includes(l.keterangan));

        let jamMasuk = logMasuk ? (logMasuk.timestamp.split(" ")[1] || logMasuk.timestamp) : "-";
        let jamPulang = logPulang ? (logPulang.timestamp.split(" ")[1] || logPulang.timestamp) : "-";
        
        let statusBadge = '<span class="inline-block px-2 py-0.5 sm:px-2.5 sm:py-1 bg-rose-100 text-rose-700 rounded-full font-bold text-[11px]">Alpa</span>';
        let bgRow = (index % 2 === 0) ? "bg-white" : "bg-slate-50/60";

        if (logManual) {
          if (logManual.keterangan === "Izin") {
            statusBadge = '<span class="inline-block px-2 py-0.5 sm:px-2.5 sm:py-1 bg-blue-100 text-blue-700 rounded-full font-bold text-[11px]">Izin</span>';
          } else if (logManual.keterangan === "Sakit") {
            statusBadge = '<span class="inline-block px-2 py-0.5 sm:px-2.5 sm:py-1 bg-amber-100 text-amber-700 rounded-full font-bold text-[11px]">Sakit</span>';
          } else {
            statusBadge = '<span class="inline-block px-2 py-0.5 sm:px-2.5 sm:py-1 bg-rose-100 text-rose-700 rounded-full font-bold text-[11px]">Alpa</span>';
          }
        } else if (logMasuk) {
          if (!logPulang) {
            statusBadge = logMasuk.keterangan === "Terlambat Masuk" 
              ? '<span class="inline-block px-2 py-0.5 sm:px-2.5 sm:py-1 bg-amber-100 text-amber-800 rounded-full font-bold text-[11px]">Terlambat</span>'
              : '<span class="inline-block px-2 py-0.5 sm:px-2.5 sm:py-1 bg-emerald-100 text-emerald-800 rounded-full font-bold text-[11px]">Hadir</span>';
            bgRow = "bg-emerald-50/40";
          } else if (logMasuk.keterangan === "Terlambat Masuk") {
            statusBadge = '<span class="inline-block px-2 py-0.5 sm:px-2.5 sm:py-1 bg-amber-200 text-amber-900 rounded-full font-bold text-[11px]">Terlambat</span>';
            bgRow = "bg-amber-50/50";
          } else {
            statusBadge = '<span class="inline-block px-2 py-0.5 sm:px-2.5 sm:py-1 bg-emerald-200 text-emerald-900 rounded-full font-bold text-[11px]">Hadir Lengkap</span>';
            bgRow = "bg-emerald-50/80";
          }
        } else if (infoLibur) {
          statusBadge = `<span class="inline-block px-2 py-0.5 sm:px-2.5 sm:py-1 bg-purple-100 text-purple-800 rounded-full font-bold text-[11px]">Libur (${infoLibur.keterangan})</span>`;
          bgRow = "bg-purple-50/30";
        } else if (tanggalMulaiSistem && tgl < tanggalMulaiSistem) {
          statusBadge = '<span class="inline-block px-2 py-0.5 sm:px-2.5 sm:py-1 bg-slate-100 text-slate-500 rounded-full font-bold text-[11px]">Belum Dimulai</span>';
        } else if (tgl > todayStr) {
          statusBadge = '<span class="inline-block px-2 py-0.5 sm:px-2.5 sm:py-1 bg-slate-100 text-slate-400 rounded-full font-bold text-[11px]">Belum Berjalan</span>';
        }

        html += `
          <tr class="${bgRow} cursor-pointer hover:bg-yellow-100/70 transition duration-150" onclick="sorotBarisSiswa(this)">
            <td class="p-2.5 sm:p-3 border border-slate-200 text-slate-500 font-medium sticky-col-no ${bgRow}">${index + 1}</td>
            <td class="p-2.5 sm:p-3 border border-slate-200 font-mono text-slate-600">${siswa.nisn || '-'}</td>
            <td class="p-2.5 sm:p-3 border border-slate-200 text-left font-bold text-slate-800 sticky-col-nama ${bgRow}">${siswa.nama}</td>
            <td class="p-2.5 sm:p-3 border border-slate-200 font-semibold text-slate-600">${siswa.kelas || '-'}</td>
            <td class="p-2.5 sm:p-3 border border-slate-200 font-medium text-slate-700">${jamMasuk}</td>
            <td class="p-2.5 sm:p-3 border border-slate-200 font-medium text-slate-700">${jamPulang}</td>
            <td class="p-2.5 sm:p-3 border border-slate-200">${statusBadge}</td>
          </tr>`;
      });

      html += `</tbody>`;
      tabel.innerHTML = html;
    }

    // --- REKAP BULANAN RENDER ---
    function renderRekapBulanan(kelasSelected) {
      const ym = document.getElementById("filterBulan").value;
      const todayStr = getTodayString();
      const [year, month] = ym.split("-").map(Number);
      const totalDays = new Date(year, month, 0).getDate();

      document.getElementById("judulRekap").textContent = `REKAP BULANAN PRESENSI SISWA (${ym})`;
      document.getElementById("subJudulRekap").textContent = `Kelas: ${kelasSelected}`;

      let sourceList = rawMaster.length > 0 ? rawMaster : rawLogs;
      let filteredMaster = sourceList.filter(m => m.kelas === kelasSelected);

      if (rawMaster.length === 0) {
        let uniqueMap = new Map();
        filteredMaster.forEach(item => {
          let key = item.kode || item.nama;
          if (!uniqueMap.has(key)) {
            uniqueMap.set(key, { nisn: item.kode || "-", nama: item.nama, kelas: item.kelas });
          }
        });
        filteredMaster = Array.from(uniqueMap.values());
      }

      // SOTIR NAMA DENGAN URUTAN ALFABET (A-Z)
      filteredMaster.sort((a, b) => (a.nama || "").localeCompare(b.nama || "", "id", { sensitivity: "base" }));

      const tabel = document.getElementById("tabelUtama");

      // HEADER ROW 1: TANGGAL & KETERANGAN
      let html = `<thead>
        <tr class="bg-slate-200 font-extrabold text-[11px] sm:text-xs text-slate-700 border-b border-slate-300">
          <th rowspan="2" class="p-2 border border-slate-300 align-middle sticky-col-no bg-slate-200">No</th>
          <th rowspan="2" class="p-2 border border-slate-300 text-left min-w-[150px] sm:min-w-[180px] align-middle sticky-col-nama bg-slate-200">Nama Siswa</th>
          <th colspan="${totalDays}" class="p-1.5 border border-slate-300 bg-blue-100 text-blue-900 text-center uppercase tracking-wider font-extrabold">Tanggal</th>
          <th colspan="4" class="p-1.5 border border-slate-300 bg-indigo-100 text-indigo-900 text-center uppercase tracking-wider font-extrabold">Keterangan</th>
        </tr>
        <tr class="bg-slate-100 font-bold text-[11px] sm:text-xs border-b border-slate-200">`;

      // HEADER ROW 2: ANGKA TANGGAL (1-31) + MENYALAKAN KOLOM HARI INI
      for (let d = 1; d <= totalDays; d++) {
        const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayOfWeek = new Date(year, month - 1, d).getDay();
        const infoLibur = rawLibur.find(l => l.tanggal === dateStr);
        const isToday = (dateStr === todayStr);

        let bgHeader = "";
        let titleHeader = infoLibur ? infoLibur.keterangan : (dayOfWeek === 0 || dayOfWeek === 6 ? "Libur Akhir Pekan" : "");

        if (isToday) {
          bgHeader = "bg-amber-400 text-slate-900 font-black border-x-2 border-x-amber-600 shadow-inner z-10";
          titleHeader = "HARI INI (" + dateStr + ")";
        } else if (dayOfWeek === 0 || dayOfWeek === 6) {
          bgHeader = "bg-rose-200 text-rose-800";
        } else if (infoLibur) {
          bgHeader = "bg-purple-200 text-purple-800";
        } else {
          bgHeader = "text-slate-600";
        }
        
        html += `<th class="p-1 border border-slate-200 min-w-[28px] ${bgHeader}" title="${titleHeader}">
                  ${d}${isToday ? '<span class="block text-[8px] font-extrabold text-slate-900 leading-none">▲</span>' : ''}
                 </th>`;
      }

      // HEADER ROW 2: H, I, S, A
      html += `<th class="p-2 border border-slate-200 bg-emerald-100 text-emerald-800" title="Hadir">H</th>
               <th class="p-2 border border-slate-200 bg-blue-100 text-blue-800" title="Izin">I</th>
               <th class="p-2 border border-slate-200 bg-amber-100 text-amber-800" title="Sakit">S</th>
               <th class="p-2 border border-slate-200 bg-rose-100 text-rose-800" title="Alpa">A</th>
             </tr>
           </thead>
           <tbody>`;

      if (filteredMaster.length === 0) {
        html += `<tr><td colspan="${totalDays + 6}" class="p-6 text-slate-400 italic">Tidak ada data siswa terdaftar pada Kelas ${kelasSelected}.</td></tr></tbody>`;
        tabel.innerHTML = html;
        return;
      }

      const totalStudents = filteredMaster.length;

      filteredMaster.forEach((siswa, index) => {
        let countH = 0, countI = 0, countS = 0, countA = 0;
        let bgRow = (index % 2 === 0) ? "bg-white" : "bg-slate-50/60";

        html += `<tr class="${bgRow} cursor-pointer hover:bg-yellow-100/70 transition duration-150" onclick="sorotBarisSiswa(this)">
                  <td class="p-2 border border-slate-200 text-slate-500 sticky-col-no ${bgRow}">${index + 1}</td>
                  <td class="p-2 border border-slate-200 text-left font-bold text-slate-800 whitespace-nowrap sticky-col-nama ${bgRow}">${siswa.nama}</td>`;

        for (let d = 1; d <= totalDays; d++) {
          const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const dayOfWeek = new Date(year, month - 1, d).getDay();
          const infoLibur = rawLibur.find(l => l.tanggal === dateStr);
          const isToday = (dateStr === todayStr);

          // EFEK TAMPILAN HIGHLIGHT KHUSUS UNTUK TANGGAL HARI INI
          const highlightTodayClass = isToday ? "border-x-2 border-x-amber-500 shadow-sm" : "";

          // 1. Cek Hari Sabtu/Minggu ATAU Hari Libur Terdaftar
          if (dayOfWeek === 0 || dayOfWeek === 6 || infoLibur) {
            if (index === 0) {
              let textLibur = "";
              let bgLibur = "";

              if (infoLibur) {
                textLibur = infoLibur.keterangan.toUpperCase();
                bgLibur = "bg-purple-100 text-purple-800 border-purple-200";
              } else if (dayOfWeek === 6) {
                textLibur = "SABTU";
                bgLibur = "bg-rose-100 text-rose-700 border-rose-200";
              } else if (dayOfWeek === 0) {
                textLibur = "MINGGU";
                bgLibur = "bg-rose-100 text-rose-700 border-rose-200";
              }

              html += `<td rowspan="${totalStudents}" class="p-1 border ${bgLibur} text-[10px] font-extrabold text-center align-middle tracking-wider ${highlightTodayClass}">
                        <span class="libur-text-vertical">${textLibur}</span>
                      </td>`;
            }
            continue;
          }

          // 2. Cek Tanggal Sebelum Sistem Resmi Dimulai
          if (tanggalMulaiSistem && dateStr < tanggalMulaiSistem) {
            html += `<td class="p-1 border border-slate-200 text-slate-400 font-medium text-xs ${highlightTodayClass}" title="Sistem Belum Dimulai">-</td>`;
            continue;
          }

          // 3. Cek Tanggal Masa Depan (Belum Terjadi)
          if (dateStr > todayStr) {
            html += `<td class="p-1 border border-slate-200 text-slate-300 font-medium text-xs ${highlightTodayClass}" title="Tanggal Belum Berjalan">-</td>`;
            continue;
          }

          const studentLogs = rawLogs.filter(l => {
            const sameDate = String(l.tanggal).trim() === String(dateStr).trim();
            const matchKode = l.kode && siswa.nisn && String(l.kode).trim() === String(siswa.nisn).trim();
            const matchNama = String(l.nama).toLowerCase().trim() === String(siswa.nama).toLowerCase().trim();
            return sameDate && (matchKode || matchNama);
          });

          const logMasuk = studentLogs.find(l => l.keterangan === "Masuk" || l.keterangan === "Terlambat Masuk");
          const logManual = studentLogs.find(l => ["Izin", "Sakit", "Alpa"].includes(l.keterangan));

          let code = "A";
          let bgCell = isToday ? "bg-amber-200 text-slate-900 font-black" : "bg-rose-100 text-rose-800 font-bold";

          if (logManual) {
            if (logManual.keterangan === "Izin") { 
              code = "I"; countI++; 
              bgCell = isToday ? "bg-amber-200 text-blue-900 font-black" : "bg-blue-100 text-blue-800 font-bold"; 
            } else if (logManual.keterangan === "Sakit") { 
              code = "S"; countS++; 
              bgCell = isToday ? "bg-amber-200 text-amber-950 font-black" : "bg-amber-100 text-amber-800 font-bold"; 
            } else { 
              code = "A"; countA++; 
              bgCell = isToday ? "bg-amber-200 text-rose-900 font-black" : "bg-rose-100 text-rose-800 font-bold"; 
            }
          } else if (logMasuk) {
            code = "H"; countH++; 
            bgCell = isToday ? "bg-amber-300 text-emerald-950 font-black" : "bg-emerald-100 text-emerald-800 font-bold";
          } else {
            countA++;
          }

          html += `<td class="p-1 border border-slate-200 ${bgCell} ${highlightTodayClass}">${code}</td>`;
        }

        html += `<td class="p-2 border border-slate-200 font-black bg-emerald-50 text-emerald-700">${countH}</td>
                 <td class="p-2 border border-slate-200 font-black bg-blue-50 text-blue-700">${countI}</td>
                 <td class="p-2 border border-slate-200 font-black bg-amber-50 text-amber-700">${countS}</td>
                 <td class="p-2 border border-slate-200 font-black bg-rose-50 text-rose-700">${countA}</td></tr>`;
      });

      html += `</tbody>`;
      tabel.innerHTML = html;
    }

    // --- EXPORT TO EXCEL (WITH PASSWORD PROTECTION) ---
    function downloadExcel() {
      const kelas = document.getElementById("filterKelas").value;
      if (!kelas) {
        alert("Pilih kelas terlebih dahulu sebelum mengunduh file Excel!");
        return;
      }

      // POP-UP VERIFIKASI PASSWORD KHUSUS
      const password = prompt("Masukkan Password Khusus Guru untuk mengunduh rekap Excel:");
      
      if (password === null) {
        return; // Pengguna menekan tombol Batal / Cancel
      }

      if (password.trim() !== "GURU2026") {
        alert("❌ Password Salah! Anda tidak memiliki otoritas untuk mengunduh file Excel ini.");
        return;
      }

      // JIKA PASSWORD BENAR (GURU2026), JALANKAN PROSES UNDUH EXCEL
      const table = document.getElementById("tabelUtama");
      const filename = currentMode === "harian" 
        ? `Rekap_Harian_Kelas_${kelas}_${document.getElementById("filterTanggal").value}.xlsx`
        : `Rekap_Bulanan_Kelas_${kelas}_${document.getElementById("filterBulan").value}.xlsx`;

      const wb = XLSX.utils.table_to_book(table, { sheet: "Rekap Presensi" });
      XLSX.writeFile(wb, filename);
    }
  </script>
