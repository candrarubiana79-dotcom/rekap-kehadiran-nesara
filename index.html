<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Presensi Siswa v2.5 - SMPN 1 RANCAH</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- XLSX Library untuk Export Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* WADAH TABEL RESPONSIF SCROLL HORIZONTAL */
    #containerTabel {
      overflow-x: auto;
      max-width: 100%;
      -webkit-overflow-scrolling: touch;
    }

    #tabelUtama {
      white-space: nowrap;
      border-collapse: separate;
      border-spacing: 0;
    }

    /* FORMAT TEKS VERTIKAL KOLOM LIBUR */
    .libur-text-vertical {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      white-space: nowrap;
      display: inline-block;
      letter-spacing: 1px;
    }

    /* BARIS MENYALA / HIGHLIGHT SAAT DIKLIK */
    .row-highlight td {
      background-color: #fef08a !important;
      color: #0f172a !important;
      font-weight: 800 !important;
      border-top: 2px solid #eab308 !important;
      border-bottom: 2px solid #eab308 !important;
    }

    /* STICKY COLUMN (NO & NAMA SISWA TERKUNCI SAAT DI-SCROLL) */
    .sticky-col-no {
      position: sticky;
      left: 0;
      z-index: 20;
    }

    .sticky-col-nama {
      position: sticky;
      left: 36px;
      z-index: 20;
      box-shadow: 3px 0 6px -2px rgba(0, 0, 0, 0.12);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* =========================================================
       ANIMASI MARIO & LUIGI KE SEKOLAH
       ========================================================= */
    .mario-character {
      animation: marioWalk 8s linear infinite;
    }

    .luigi-character {
      animation: luigiWalk 8s linear infinite;
      animation-delay: 1.1s;
    }

    .mario-block {
      animation: bumpBlock 8s ease-in-out infinite;
    }

    .mario-coin {
      animation: coinPop 8s ease-in-out infinite;
    }

    @keyframes marioWalk {
      0% { left: -35px; opacity: 1; transform: translateY(0); }
      38% { left: calc(45% - 24px); transform: translateY(0); }
      42% { left: calc(45% - 12px); transform: translateY(-24px); } /* Lompat Sundul Kotak ? */
      46% { left: 45%; transform: translateY(0); }
      82% { left: calc(100% - 65px); opacity: 1; transform: translateY(0); }
      88% { left: calc(100% - 45px); opacity: 0; transform: translateY(0); }
      100% { left: -35px; opacity: 0; }
    }

    @keyframes luigiWalk {
      0% { left: -35px; opacity: 1; transform: translateY(0); }
      48% { left: calc(45% - 24px); transform: translateY(0); }
      52% { left: calc(45% - 12px); transform: translateY(-24px); } /* Luigi Sundul Kotak ? */
      56% { left: 45%; transform: translateY(0); }
      85% { left: calc(100% - 65px); opacity: 1; transform: translateY(0); }
      91% { left: calc(100% - 45px); opacity: 0; transform: translateY(0); }
      100% { left: -35px; opacity: 0; }
    }

    @keyframes bumpBlock {
      0%, 41%, 45%, 51%, 55%, 100% { transform: translateY(0) scale(1); }
      42% { transform: translateY(-8px) scale(1.1); } /* Mental pas disundul Mario */
      52% { transform: translateY(-8px) scale(1.1); } /* Mental pas disundul Luigi */
    }

    @keyframes coinPop {
      0%, 41%, 46%, 51%, 56%, 100% { opacity: 0; transform: translateY(0) scale(0.5); }
      42%, 52% { opacity: 1; transform: translateY(-26px) scale(1.2); }
      44%, 54% { opacity: 0; transform: translateY(-40px) scale(0.8); }
    }

    /* =========================================================
       KHUSUS TAMPILAN HP (RESPONSIF & BEBAS MENUMPUK)
       ========================================================= */
    @media (max-width: 640px) {
      body {
        padding: 6px !important;
      }

      #tabelUtama {
        font-size: 10px !important;
      }

      #tabelUtama th, #tabelUtama td {
        padding: 5px 3px !important;
      }

      /* Penyesuaian Sticky Column di HP */
      .sticky-col-no {
        left: 0 !important;
        min-width: 28px !important;
        max-width: 28px !important;
        text-align: center;
      }

      .sticky-col-nama {
        left: 28px !important;
        min-width: 110px !important;
        max-width: 110px !important;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Lebar Kolom Tanggal Bulanan di HP */
      .col-tanggal {
        min-width: 25px !important;
        text-align: center;
      }

      .libur-text-vertical {
        font-size: 8px !important;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-2 sm:p-4 md:p-6">

    <!-- MAIN CONTAINER CARD -->
    <main class="bg-white rounded-2xl shadow-sm border border-slate-200 p-2.5 sm:p-5 md:p-6 space-y-3 sm:space-y-6">

            <span>Refresh</span>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzq05A9BpVJFjNkHn7p2QDjbaY2ajsWjVXk5sVDkH3rStFaAC5XgEkndZSg39zOLX_2/exec";

    let rawMaster = [];
    let rawLogs = [];
    let rawLibur = [];
    let tanggalMulaiSistem = ""; 
    let currentMode = "harian";

    // --- FUNGSI HIGHLIGHT BARIS SAAT DIKLIK ---
    function sorotBarisSiswa(trElement) {
      document.querySelectorAll("#tabelUtama tr").forEach(tr => {
        tr.classList.remove("row-highlight");
      });
      trElement.classList.add("row-highlight");
    }

    // --- REALTIME DIGITAL CLOCK ---
    function updateLiveClock() {
      const now = new Date();
      const optionsDate = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Asia/Jakarta' };
      const optionsTime = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'Asia/Jakarta' };

      document.getElementById('liveClock').textContent = now.toLocaleTimeString('id-ID', optionsTime) + " WIB";
      document.getElementById('liveDate').textContent = now.toLocaleDateString('id-ID', optionsDate);
    }
    setInterval(updateLiveClock, 1000);
    updateLiveClock();

    function getTodayString() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    // --- INITIALIZATION ---
    document.addEventListener("DOMContentLoaded", () => {
      const todayStr = getTodayString();
      const ym = todayStr.substring(0, 7);
      
      document.getElementById("filterTanggal").value = todayStr;
      document.getElementById("filterBulan").value = ym;
      
      loadData(false);

      // SINKRONISASI OTOMATIS TIAP 60 DETIK
      setInterval(() => {
        loadData(true);
      }, 60000);
    });

    // --- TAB SWITCHING LOGIC ---
    function switchTab(mode) {
      currentMode = mode;
      const btnHarian = document.getElementById("tabHarian");
      const btnBulanan = document.getElementById("tabBulanan");
      const boxTanggal = document.getElementById("boxTanggal");
      const boxBulan = document.getElementById("boxBulan");

      if (mode === 'harian') {
        btnHarian.className = "flex-1 sm:flex-none px-3 py-2 rounded-lg text-xs sm:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-1.5 bg-white text-blue-600 shadow-sm";
        btnBulanan.className = "flex-1 sm:flex-none px-3 py-2 rounded-lg text-xs sm:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-1.5 text-slate-500 hover:text-slate-800";
        boxTanggal.classList.remove("hidden");
        boxBulan.classList.add("hidden");
      } else {
        btnBulanan.className = "flex-1 sm:flex-none px-3 py-2 rounded-lg text-xs sm:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-1.5 bg-white text-blue-600 shadow-sm";
        btnHarian.className = "flex-1 sm:flex-none px-3 py-2 rounded-lg text-xs sm:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-1.5 text-slate-500 hover:text-slate-800";
        boxBulan.classList.remove("hidden");
        boxTanggal.classList.add("hidden");
      }

      renderTable();
    }

    function manualRefresh() {
      loadData(false);
    }

    function loadData(isSilent = false) {
      const iconRefresh = document.getElementById("iconRefresh");
      if (iconRefresh) iconRefresh.classList.add("fa-spin");

      if (!isSilent && rawMaster.length === 0) {
        document.getElementById("tabelUtama").innerHTML = '<tr><td class="p-6 text-slate-400 font-medium"><i class="fa-solid fa-spinner fa-spin text-blue-600 mr-2"></i> Mengambil data dari server...</td></tr>';
      }
      
      fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
          rawMaster = data.master || [];
          rawLogs = data.logs || [];
          rawLibur = data.libur || [];
          tanggalMulaiSistem = data.tanggal_mulai || "";

          if (rawMaster.length === 0 && rawLogs.length === 0) {
            document.getElementById("tabelUtama").innerHTML = '<tr><td class="p-6 text-rose-500 font-semibold">Data masih kosong di spreadsheet!</td></tr>';
            return;
          }

          initKelasDropdown();
          renderTable();

          const now = new Date();
          const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'Asia/Jakarta' });
          const lastSyncEl = document.getElementById("lastSync");
          if (lastSyncEl) {
            lastSyncEl.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> ${timeStr}`;
          }
        })
        .catch(err => {
          console.error(err);
          if (!isSilent) {
            document.getElementById("tabelUtama").innerHTML = `<tr class="text-rose-600"><td class="p-6">Gagal mengambil data dari Google Sheets.<br><small class="text-slate-400">${err}</small></td></tr>`;
          }
        })
        .finally(() => {
          if (iconRefresh) iconRefresh.classList.remove("fa-spin");
        });
    }

    function initKelasDropdown() {
      const select = document.getElementById("filterKelas");
      const currentVal = select.value;
      
      let kelasSet = new Set();
      rawMaster.forEach(s => { if(s.kelas) kelasSet.add(s.kelas); });
      rawLogs.forEach(l => { if(l.kelas) kelasSet.add(l.kelas); });
      
      const kelasList = [...kelasSet].sort();

      select.innerHTML = '<option value="">-- Pilih Kelas --</option>';
      kelasList.forEach(k => {
        const opt = document.createElement("option");

    // --- HITUNG STATISTIK HARIAN ---
    function hitungStatistikHarian(kelasSelected) {
      const tgl = document.getElementById("filterTanggal").value;
      const todayStr = getTodayString();
      const infoLibur = rawLibur.find(l => l.tanggal === tgl);

      let sourceList = rawMaster.length > 0 ? rawMaster : rawLogs;
      let targetList = sourceList;

      if (rawMaster.length === 0) {
        let uniqueMap = new Map();
        targetList.forEach(item => {
          let key = item.kode || item.nama;
          if (!uniqueMap.has(key)) {
            uniqueMap.set(key, { nisn: item.kode || "-", nama: item.nama, kelas: item.kelas });
          }
        });
        targetList = Array.from(uniqueMap.values());
      }

      if (kelasSelected) {
        targetList = targetList.filter(m => m.kelas === kelasSelected);
      }

      let totalSiswa = targetList.length;
      let countHadir = 0;
      let countIzin = 0;
      let countSakit = 0;
      let countAlpa = 0;

      const isWeekendOrHoliday = infoLibur;
      const isFuture = (tgl > todayStr);
      const isBeforeStart = (tanggalMulaiSistem && tgl < tanggalMulaiSistem);

      if (!isWeekendOrHoliday && !isFuture && !isBeforeStart) {
        targetList.forEach(siswa => {
          const studentLogs = rawLogs.filter(l => {
            const sameDate = String(l.tanggal).trim() === String(tgl).trim();
            const matchKode = l.kode && siswa.nisn && String(l.kode).trim() === String(siswa.nisn).trim();
            const matchNama = String(l.nama).toLowerCase().trim() === String(siswa.nama).toLowerCase().trim();
            return sameDate && (matchKode || matchNama);
          });

          const logMasuk = studentLogs.find(l => l.keterangan === "Masuk" || l.keterangan === "Terlambat Masuk");
          const logManual = studentLogs.find(l => ["Izin", "Sakit", "Alpa"].includes(l.keterangan));

          if (logManual) {
            if (logManual.keterangan === "Izin") countIzin++;
            else if (logManual.keterangan === "Sakit") countSakit++;
            else countAlpa++;
          } else if (logMasuk) {
            countHadir++;
          } else {
            countAlpa++;
          }
        });
      }

      let countTidakHadir = countIzin + countSakit + countAlpa;

      return {
        totalSiswa,
        countHadir,
        countIzin,
        countSakit,
        countAlpa,
        countTidakHadir,
        isWeekendOrHoliday,
        isFuture,
        isBeforeStart
      };
    }

        let bgRow = (index % 2 === 0) ? "bg-white" : "bg-slate-50";

        html += `<tr class="${bgRow} cursor-pointer hover:bg-yellow-100/70 transition duration-150" onclick="sorotBarisSiswa(this)">
                  <td class="p-1 border border-slate-200 text-slate-500 sticky-col-no ${bgRow}">${index + 1}</td>
                  <td class="p-1 border border-slate-200 text-left font-bold text-slate-800 sticky-col-nama ${bgRow}">${siswa.nama}</td>`;

        for (let d = 1; d <= totalDays; d++) {
          const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const dayOfWeek = new Date(year, month - 1, d).getDay();
          const infoLibur = rawLibur.find(l => l.tanggal === dateStr);
          const isToday = (dateStr === todayStr);

          const highlightTodayClass = isToday ? "border-x border-x-amber-500 shadow-sm" : "";

          if (dayOfWeek === 0 || dayOfWeek === 6 || infoLibur) {
            if (index === 0) {
              let textLibur = "";
              let bgLibur = "";

              if (infoLibur) {
                textLibur = infoLibur.keterangan.toUpperCase();
                bgLibur = "bg-purple-100 text-purple-800 border-purple-200";
              } else if (dayOfWeek === 6) {
                textLibur = "SABTU";
                bgLibur = "bg-rose-100 text-rose-700 border-rose-200";
              } else if (dayOfWeek === 0) {
                textLibur = "MINGGU";
                bgLibur = "bg-rose-100 text-rose-700 border-rose-200";
              }

              html += `<td rowspan="${totalStudents}" class="p-0.5 border col-tanggal ${bgLibur} font-extrabold text-center align-middle tracking-wider ${highlightTodayClass}">
                        <span class="libur-text-vertical">${textLibur}</span>
                      </td>`;
            }
            continue;
          }

          if (tanggalMulaiSistem && dateStr < tanggalMulaiSistem) {
            html += `<td class="p-0.5 border border-slate-200 col-tanggal text-slate-400 font-medium ${highlightTodayClass}" title="Sistem Belum Dimulai">-</td>`;
            continue;
          }

          if (dateStr > todayStr) {
            html += `<td class="p-0.5 border border-slate-200 col-tanggal text-slate-300 font-medium ${highlightTodayClass}" title="Tanggal Belum Berjalan">-</td>`;
            continue;
          }

          const studentLogs = rawLogs.filter(l => {
            const sameDate = String(l.tanggal).trim() === String(dateStr).trim();
            const matchKode = l.kode && siswa.nisn && String(l.kode).trim() === String(siswa.nisn).trim();
            const matchNama = String(l.nama).toLowerCase().trim() === String(siswa.nama).toLowerCase().trim();
            return sameDate && (matchKode || matchNama);
          });

          const logMasuk = studentLogs.find(l => l.keterangan === "Masuk" || l.keterangan === "Terlambat Masuk");
          const logManual = studentLogs.find(l => ["Izin", "Sakit", "Alpa"].includes(l.keterangan));

          let code = "A";
          let bgCell = isToday ? "bg-amber-200 text-slate-900 font-black" : "bg-rose-100 text-rose-800 font-bold";

          if (logManual) {
            if (logManual.keterangan === "Izin") { 
              code = "I"; countI++; 
              bgCell = isToday ? "bg-amber-200 text-blue-900 font-black" : "bg-blue-100 text-blue-800 font-bold"; 
            } else if (logManual.keterangan === "Sakit") { 
              code = "S"; countS++; 
              bgCell = isToday ? "bg-amber-200 text-amber-950 font-black" : "bg-amber-100 text-amber-800 font-bold"; 
            } else { 
              code = "A"; countA++; 
              bgCell = isToday ? "bg-amber-200 text-rose-900 font-black" : "bg-rose-100 text-rose-800 font-bold"; 
            }
          } else if (logMasuk) {
            code = "H"; countH++; 
            bgCell = isToday ? "bg-amber-300 text-emerald-950 font-black" : "bg-emerald-100 text-emerald-800 font-bold";
          } else {
            countA++;
          }

          html += `<td class="p-0.5 border border-slate-200 col-tanggal ${bgCell} ${highlightTodayClass}">${code}</td>`;
        }

        html += `<td class="p-1 border border-slate-200 font-black bg-emerald-50 text-emerald-700 col-tanggal">${countH}</td>
                 <td class="p-1 border border-slate-200 font-black bg-blue-50 text-blue-700 col-tanggal">${countI}</td>
                 <td class="p-1 border border-slate-200 font-black bg-amber-50 text-amber-700 col-tanggal">${countS}</td>
                 <td class="p-1 border border-slate-200 font-black bg-rose-50 text-rose-700 col-tanggal">${countA}</td></tr>`;
      });

      html += `</tbody>`;
      tabel.innerHTML = html;
    }

    // --- EXPORT TO EXCEL ---
    function downloadExcel() {
      const kelas = document.getElementById("filterKelas").value;
      if (!kelas) {
        alert("Pilih kelas terlebih dahulu sebelum mengunduh file Excel!");
        return;
      }

      const password = prompt("Masukkan Password Khusus Guru untuk mengunduh rekap Excel:");
      
      if (password === null) return;

      if (password.trim() !== "GURU2026") {
        alert("❌ Password Salah! Anda tidak memiliki otoritas untuk mengunduh file Excel ini.");
        return;
      }

      const table = document.getElementById("tabelUtama");
      const filename = currentMode === "harian" 
        ? `Rekap_Harian_Kelas_${kelas}_${document.getElementById("filterTanggal").value}.xlsx`
        : `Rekap_Bulanan_Kelas_${kelas}_${document.getElementById("filterBulan").value}.xlsx`;

      const wb = XLSX.utils.table_to_book(table, { sheet: "Rekap Presensi" });
      XLSX.writeFile(wb, filename);
    }
  </script>
</body>
