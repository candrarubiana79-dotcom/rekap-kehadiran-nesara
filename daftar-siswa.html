<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Siswa Per Kelas - SMPN 1 RANCAH</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    #containerTabel { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
    #tabelUtama { white-space: nowrap; border-collapse: separate; border-spacing: 0; }
    
    #loadingOverlay {
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #loadingOverlay.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    @media print {
      .no-print { display: none !important; }
      body { background: #ffffff !important; padding: 0 !important; }
      .print-shadow-none { shadow: none !important; border: none !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-2 sm:p-4 md:p-6">

  <!-- OVERLAY LOADING -->
  <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex flex-col items-center justify-center p-4">
    <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-2xl text-center space-y-4 max-w-xs sm:max-w-sm w-full border border-slate-100">
      <div class="relative w-20 h-20 mx-auto flex items-center justify-center">
        <div class="absolute inset-0 rounded-full border-4 border-indigo-100"></div>
        <div class="absolute inset-0 rounded-full border-4 border-indigo-600 border-t-transparent animate-spin"></div>
        <img src="assets/logo-smpn1rancah.png" alt="Logo SMPN 1 Rancah" class="w-11 h-11 object-contain drop-shadow-md">
      </div>
      <div>
        <h3 class="text-base font-extrabold text-slate-900">Memuat Data Siswa</h3>
        <p id="loadingStatusText" class="text-xs font-semibold text-slate-500 mt-1">Mengunduh master data dari server...</p>
      </div>
      <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
        <div class="bg-indigo-600 h-full w-2/3 animate-pulse rounded-full"></div>
      </div>
    </div>
  </div>

  <div class="max-w-7xl mx-auto space-y-3 sm:space-y-5">

    <!-- HEADER SEKOALH -->
    <header class="bg-gradient-to-r from-blue-700 via-indigo-700 to-indigo-800 text-white rounded-2xl p-3 sm:p-6 shadow-lg relative overflow-hidden no-print">
      <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>

      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 sm:gap-4 relative z-10">
        <div class="flex items-center gap-2.5 sm:gap-5">
          <img src="assets/logo-smpn1rancah.png" alt="Logo SMPN 1 Rancah" class="w-12 h-12 sm:w-16 sm:h-16 md:w-20 md:h-20 object-contain drop-shadow-xl flex-shrink-0">
          <div>
            <div class="flex items-center gap-1.5 mb-0.5">
              <span class="px-2 py-0.5 bg-white/20 backdrop-blur-md rounded-full text-[9px] sm:text-xs font-semibold uppercase tracking-wider text-blue-100">
                Sistem Presensi Digital
              </span>
              <span class="px-1.5 py-0.5 bg-emerald-400 text-slate-900 font-black text-[9px] sm:text-[11px] rounded-full shadow-sm">
                Master Siswa
              </span>
            </div>
            <h1 class="text-base sm:text-2xl md:text-3xl font-extrabold tracking-tight leading-tight">DAFTAR SISWA PER KELAS</h1>
            <p class="text-blue-200 text-[11px] sm:text-sm font-bold">SMPN 1 RANCAH</p>
          </div>
        </div>

        <div class="flex items-center gap-2 self-start md:self-auto">
          <button onclick="manualRefresh()" class="bg-white/10 hover:bg-white/20 border border-white/20 text-white text-xs font-bold px-3 py-2 rounded-xl transition flex items-center gap-1.5">
            <i id="iconRefresh" class="fa-solid fa-rotate"></i>
            <span>Refresh Data</span>
          </button>
          <button onclick="exportExcel()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-2 rounded-xl transition shadow-md flex items-center gap-1.5">
            <i class="fa-solid fa-file-excel"></i>
            <span>Export Excel</span>
          </button>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="bg-white rounded-2xl shadow-sm border border-slate-200 p-3 sm:p-5 md:p-6 space-y-4">

      <!-- FILTER PANEL -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200/80 no-print">
        
        <!-- PILIH KELAS -->
        <div>
          <label class="block text-[10px] sm:text-[11px] font-extrabold uppercase tracking-wider text-slate-600 mb-1 flex items-center gap-1">
            <i class="fa-solid fa-users text-indigo-600"></i> Pilih Kelas:
          </label>
          <select id="filterKelas" onchange="renderStudentList()" class="w-full bg-white px-3 py-2 border border-slate-300 rounded-xl text-xs sm:text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition min-h-[40px]">
            <option value="">-- Semua Kelas --</option>
          </select>
        </div>

        <!-- CARI NAMA / NISN -->
        <div>
          <label class="block text-[10px] sm:text-[11px] font-extrabold uppercase tracking-wider text-slate-600 mb-1 flex items-center gap-1">
            <i class="fa-solid fa-magnifying-glass text-indigo-600"></i> Cari Nama / NISN:
          </label>
          <input type="text" id="filterCari" oninput="renderStudentList()" placeholder="Ketik nama atau NISN..." class="w-full bg-white px-3 py-2 border border-slate-300 rounded-xl text-xs sm:text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition min-h-[40px]">
        </div>

        <!-- FILTER JENIS KELAMIN -->
        <div>
          <label class="block text-[10px] sm:text-[11px] font-extrabold uppercase tracking-wider text-slate-600 mb-1 flex items-center gap-1">
            <i class="fa-solid fa-venus-mars text-indigo-600"></i> Jenis Kelamin:
          </label>
          <select id="filterJK" onchange="renderStudentList()" class="w-full bg-white px-3 py-2 border border-slate-300 rounded-xl text-xs sm:text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition min-h-[40px]">
            <option value="">-- Semua --</option>
            <option value="L">Laki-Laki (L)</option>
            <option value="P">Perempuan (P)</option>
          </select>
        </div>

      </div>

      <!-- KARTU RINGKASAN STATISTIK -->
      <div id="boxStats" class="grid grid-cols-3 gap-2 sm:gap-4">
        <div class="bg-indigo-50/80 border border-indigo-200 p-3 rounded-xl flex items-center justify-between shadow-sm">
          <div>
            <p class="text-[9px] sm:text-[11px] font-extrabold uppercase text-indigo-700">Total Siswa</p>
            <p id="statTotal" class="text-base sm:text-2xl font-black text-indigo-950">0</p>
          </div>
          <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold text-xs sm:text-base">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
        </div>

        <div class="bg-blue-50/80 border border-blue-200 p-3 rounded-xl flex items-center justify-between shadow-sm">
          <div>
            <p class="text-[9px] sm:text-[11px] font-extrabold uppercase text-blue-700">Laki-Laki (L)</p>
            <p id="statLaki" class="text-base sm:text-2xl font-black text-blue-950">0</p>
          </div>
          <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-xs sm:text-base">
            <i class="fa-solid fa-mars"></i>
          </div>
        </div>

        <div class="bg-pink-50/80 border border-pink-200 p-3 rounded-xl flex items-center justify-between shadow-sm">
          <div>
            <p class="text-[9px] sm:text-[11px] font-extrabold uppercase text-pink-700">Perempuan (P)</p>
            <p id="statPerempuan" class="text-base sm:text-2xl font-black text-pink-950">0</p>
          </div>
          <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg bg-pink-600 text-white flex items-center justify-center font-bold text-xs sm:text-base">
            <i class="fa-solid fa-venus"></i>
          </div>
        </div>
      </div>

      <!-- JUDUL HALAMAN TABEL -->
      <div class="flex items-center justify-between border-b border-slate-100 pb-2">
        <h2 id="judulTabel" class="text-sm sm:text-lg font-extrabold text-slate-800">Daftar Siswa</h2>
        <span id="labelJumlahTampil" class="text-xs font-bold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full">
          Menampilkan 0 Siswa
        </span>
      </div>

      <!-- TABEL UTAMA -->
      <div id="containerTabel" class="border border-slate-200 shadow-sm bg-white rounded-xl relative min-h-[200px]">
        <table id="tabelUtama" class="w-full text-center border-collapse text-xs sm:text-sm">
          <!-- JS Table Renderer -->
        </table>
      </div>

    </main>

    <footer class="text-center text-[10px] sm:text-xs text-slate-400 py-2 no-print">
      © 2026 Presensi Digital • <span class="font-semibold text-slate-600">SMPN 1 RANCAH</span>
    </footer>

  </div>

  <!-- MODAL DETAIL & QR CODE SISWA -->
  <div id="modalQr" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3 no-print">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl relative">
      <button onclick="closeQrModal()" class="absolute top-4 right-4 w-8 h-8 bg-slate-100 hover:bg-slate-200 rounded-full flex items-center justify-center text-slate-500 font-bold transition">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div class="space-y-1">
        <span id="qrKelas" class="px-2.5 py-0.5 bg-indigo-100 text-indigo-800 text-[10px] font-extrabold rounded-full uppercase">Kelas -</span>
        <h3 id="qrNama" class="text-base font-extrabold text-slate-900 leading-snug">Nama Siswa</h3>
        <p id="qrNisn" class="text-xs text-slate-500 font-mono font-semibold">NISN: -</p>
      </div>

      <!-- KOTAK GAMBAR QR CODE -->
      <div class="bg-slate-50 p-4 rounded-2xl border-2 border-dashed border-indigo-200 inline-block mx-auto">
        <img id="qrImg" src="" alt="QR Code Siswa" class="w-48 h-48 object-contain mx-auto shadow-sm rounded-lg">
      </div>

      <div class="flex gap-2">
        <button onclick="window.print()" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-print"></i> Cetak QR
        </button>
        <button onclick="downloadQrImage()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-download"></i> Unduh QR
        </button>
      </div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzq05A9BpVJFjNkHn7p2QDjbaY2ajsWjVXk5sVDkH3rStFaAC5XgEkndZSg39zOLX_2/exec";

    let masterSiswa = [];
    let isInitialLoad = true;
    let selectedStudentQr = null;

    document.addEventListener("DOMContentLoaded", () => {
      loadData();
    });

    function loadData() {
      const statusText = document.getElementById("loadingStatusText");
      const iconRefresh = document.getElementById("iconRefresh");

      if (iconRefresh) iconRefresh.classList.add("fa-spin");

      // Coba muat cache dulu agar sangat cepat
      const cache = localStorage.getItem("masterSiswaCache");
      if (cache) {
        masterSiswa = JSON.parse(cache);
        initKelasDropdown();
        renderStudentList();
      }

      fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
          masterSiswa = data.master || [];
          localStorage.setItem("masterSiswaCache", JSON.stringify(masterSiswa));

          initKelasDropdown();
          renderStudentList();

          if (isInitialLoad) {
            isInitialLoad = false;
            const overlay = document.getElementById("loadingOverlay");
            if (overlay) overlay.classList.add("fade-out");
          }
        })
        .catch(err => {
          console.error("Gagal memuat master data:", err);
          if (statusText) statusText.textContent = "Gagal memuat data dari server. Menggunakan cache lokal.";
          const overlay = document.getElementById("loadingOverlay");
          if (overlay) overlay.classList.add("fade-out");
        })
        .finally(() => {
          if (iconRefresh) iconRefresh.classList.remove("fa-spin");
        });
    }

    function manualRefresh() { loadData(); }

    function initKelasDropdown() {
      const select = document.getElementById("filterKelas");
      const currentVal = select.value;
      let kelasSet = new Set();

      masterSiswa.forEach(s => { if (s.kelas) kelasSet.add(s.kelas); });
      const kelasList = [...kelasSet].sort();

      select.innerHTML = '<option value="">-- Semua Kelas --</option>';
      kelasList.forEach(k => {
        const opt = document.createElement("option");
        opt.value = k;
        opt.textContent = `Kelas ${k}`;
        select.appendChild(opt);
      });

      select.value = currentVal;
    }

    function renderStudentList() {
      const kelasVal = document.getElementById("filterKelas").value;
      const cariVal = document.getElementById("filterCari").value.trim().toLowerCase();
      const jkVal = document.getElementById("filterJK").value;

      let filtered = masterSiswa.filter(s => {
        let matchKelas = !kelasVal || String(s.kelas) === String(kelasVal);
        let matchCari = !cariVal || 
          String(s.nama || "").toLowerCase().includes(cariVal) ||
          String(s.nisn || "").toLowerCase().includes(cariVal);
        
        let jkClean = String(s.jk || s.jenis_kelamin || "").trim().toUpperCase();
        let matchJk = !jkVal || (jkVal === "L" ? (jkClean === "L" || jkClean.includes("LAKI")) : (jkClean === "P" || jkClean.includes("PEREMPUAN")));

        return matchKelas && matchCari && matchJk;
      });

      filtered.sort((a, b) => (a.nama || "").localeCompare(b.nama || "", "id", { sensitivity: "base" }));

      // Update Statistik
      let countL = 0, countP = 0;
      filtered.forEach(s => {
        let jkClean = String(s.jk || s.jenis_kelamin || "").trim().toUpperCase();
        if (jkClean === "L" || jkClean.includes("LAKI")) countL++;
        else if (jkClean === "P" || jkClean.includes("PEREMPUAN")) countP++;
      });

      document.getElementById("statTotal").textContent = filtered.length;
      document.getElementById("statLaki").textContent = countL;
      document.getElementById("statPerempuan").textContent = countP;

      document.getElementById("judulTabel").textContent = kelasVal ? `Daftar Siswa Kelas ${kelasVal}` : "Daftar Seluruh Siswa";
      document.getElementById("labelJumlahTampil").textContent = `Menampilkan ${filtered.length} Siswa`;

      const tabel = document.getElementById("tabelUtama");

      if (filtered.length === 0) {
        tabel.innerHTML = `<tr><td class="p-8 text-center text-slate-400 font-medium">Tidak ada data siswa yang cocok dengan filter.</td></tr>`;
        return;
      }

      let html = `<thead>
        <tr class="bg-slate-200 text-slate-700 font-extrabold uppercase text-[10px] sm:text-xs tracking-wider border-b border-slate-300">
          <th class="p-2.5 sm:p-3 border border-slate-300 w-12">No</th>
          <th class="p-2.5 sm:p-3 border border-slate-300 w-16">Foto</th>
          <th class="p-2.5 sm:p-3 border border-slate-300">NISN</th>
          <th class="p-2.5 sm:p-3 border border-slate-300 text-left">Nama Lengkap</th>
          <th class="p-2.5 sm:p-3 border border-slate-300 w-16">L/P</th>
          <th class="p-2.5 sm:p-3 border border-slate-300">Kelas</th>
          <th class="p-2.5 sm:p-3 border border-slate-300 no-print">Aksi / QR Code</th>
        </tr>
      </thead><tbody class="divide-y divide-slate-200">`;

      filtered.forEach((siswa, idx) => {
        const bgRow = (idx % 2 === 0) ? "bg-white" : "bg-slate-50";
        const nisn = siswa.nisn || siswa.kode || "-";
        const foto = siswa.foto || "https://via.placeholder.com/80?text=Siswa";
        
        let jkClean = String(siswa.jk || siswa.jenis_kelamin || "").trim().toUpperCase();
        let jkBadge = (jkClean === "L" || jkClean.includes("LAKI")) 
          ? '<span class="px-2 py-0.5 bg-blue-100 text-blue-800 rounded-full font-bold text-[10px]">L</span>'
          : (jkClean === "P" || jkClean.includes("PEREMPUAN"))
          ? '<span class="px-2 py-0.5 bg-pink-100 text-pink-800 rounded-full font-bold text-[10px]">P</span>'
          : '<span class="text-slate-400">-</span>';

        html += `
          <tr class="${bgRow} hover:bg-indigo-50/50 transition">
            <td class="p-2 sm:p-3 border border-slate-200 text-slate-500 font-bold">${idx + 1}</td>
            <td class="p-1 sm:p-2 border border-slate-200">
              <img src="${foto}" alt="Foto ${siswa.nama}" class="w-8 h-10 object-cover rounded mx-auto border border-slate-200 shadow-sm" onerror="this.src='https://via.placeholder.com/80?text=Siswa'">
            </td>
            <td class="p-2 sm:p-3 border border-slate-200 font-mono font-bold text-indigo-700">${nisn}</td>
            <td class="p-2 sm:p-3 border border-slate-200 text-left font-bold text-slate-800">${siswa.nama}</td>
            <td class="p-2 sm:p-3 border border-slate-200">${jkBadge}</td>
            <td class="p-2 sm:p-3 border border-slate-200 font-extrabold text-slate-700">${siswa.kelas}</td>
            <td class="p-2 sm:p-3 border border-slate-200 no-print">
              <button onclick="showQrModal('${nisn}', '${siswa.nama.replace(/'/g, "\\'")}', '${siswa.kelas}')" class="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-bold text-xs transition shadow-sm flex items-center gap-1 mx-auto">
                <i class="fa-solid fa-qrcode"></i> Lihat QR
              </button>
            </td>
          </tr>`;
      });

      tabel.innerHTML = html + `</tbody>`;
    }

    // Modal QR Generator
    function showQrModal(nisn, nama, kelas) {
      selectedStudentQr = { nisn, nama, kelas };
      document.getElementById("qrNama").textContent = nama;
      document.getElementById("qrNisn").textContent = "NISN: " + nisn;
      document.getElementById("qrKelas").textContent = "Kelas " + kelas;

      const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(nisn)}`;
      document.getElementById("qrImg").src = qrApiUrl;

      document.getElementById("modalQr").classList.remove("hidden");
    }

    function closeQrModal() {
      document.getElementById("modalQr").classList.add("hidden");
    }

    function downloadQrImage() {
      if (!selectedStudentQr) return;
      const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(selectedStudentQr.nisn)}`;
      
      fetch(qrApiUrl)
        .then(res => res.blob())
        .then(blob => {
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `QR_${selectedStudentQr.kelas}_${selectedStudentQr.nama}.png`;
          document.body.appendChild(a);
          a.click();
          a.remove();
        });
    }

    function exportExcel() {
      const kelasVal = document.getElementById("filterKelas").value || "Semua";
      const table = document.getElementById("tabelUtama");
      const filename = `Daftar_Siswa_Kelas_${kelasVal}_SMPN1Rancah.xlsx`;
      
      const wb = XLSX.utils.table_to_book(table, { sheet: "Daftar Siswa" });
      XLSX.writeFile(wb, filename);
    }
  </script>
</body>
</html>
