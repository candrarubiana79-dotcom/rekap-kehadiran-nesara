<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools QR & Link - SMPN 1 RANCAH</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex items-center justify-center p-3 sm:p-4 md:p-6 relative overflow-x-hidden">

  <!-- Background Orbs -->
  <div class="fixed -top-32 -left-32 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed -bottom-32 -right-32 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>

  <!-- CONTAINER UTAMA -->
  <div class="w-full max-w-3xl bg-white/95 backdrop-blur-xl p-5 sm:p-6 md:p-8 rounded-3xl shadow-2xl border border-white/20 space-y-6 relative z-10">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b pb-5 border-slate-100">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-lg font-bold">
          <i class="fa-solid fa-screwdriver-wrench"></i>
        </div>
        <div>
          <h2 id="sectionTitle" class="text-lg font-extrabold text-slate-900 leading-tight">Pembuat QR Code Custom</h2>
          <p class="text-xs font-bold text-indigo-600 uppercase tracking-wider">SMPN 1 RANCAH</p>
        </div>
      </div>
      <a href="imput.html" class="text-xs font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-3.5 py-2 rounded-xl transition flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-left"></i> Kembali ke Presensi
      </a>
    </div>

    <!-- TAB MENU -->
    <div class="grid grid-cols-2 gap-2 bg-slate-100/80 p-1.5 rounded-2xl text-xs font-bold">
      <button id="tabQrCustom" type="button" onclick="switchMenu('qr_custom')"
        class="py-2.5 px-2 rounded-xl transition-all text-center flex items-center justify-center gap-2 bg-white text-indigo-600 shadow-sm font-extrabold">
        <i class="fa-solid fa-qrcode"></i>
        <span>1. QR Custom</span>
      </button>
      <button id="tabPemendekUrl" type="button" onclick="switchMenu('pemendek_url')"
        class="py-2.5 px-2 rounded-xl transition-all text-center flex items-center justify-center gap-2 text-slate-500 hover:text-slate-800 font-semibold">
        <i class="fa-solid fa-link"></i>
        <span>2. Pemendek URL</span>
      </button>
    </div>

    <!-- FITUR 1: QR CUSTOM -->
    <div id="sectionQrCustom" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-start">
        <div class="md:col-span-7 space-y-4 bg-slate-50 p-5 rounded-2xl border border-slate-200/80">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Isi QR Code (Teks / Link URL)</label>
            <textarea id="customQrContent" rows="3" placeholder="Masukkan link (https://...) atau teks..."
              class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-xl text-sm font-medium focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">https://smpn1rancah.sch.id</textarea>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Tulisan Atas</label>
              <input type="text" id="customQrTextTop" value="SMPN 1 RANCAH"
                class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Tulisan Bawah</label>
              <input type="text" id="customQrTextBottom" value="SCAN ME"
                class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
          </div>

          <div class="space-y-2">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Logo Tengah (Opsional)</label>
            <div class="flex items-center gap-2">
              <input type="file" id="customQrLogoInput" accept="image/*" onchange="previewLogoName()"
                class="block w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-100 file:text-indigo-700 hover:file:bg-indigo-200 cursor-pointer">
              <button type="button" onclick="clearCustomLogo()" class="text-xs text-rose-600 hover:underline font-bold px-2 whitespace-nowrap">Hapus</button>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3 pt-2">
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Warna Kode QR</label>
              <input type="color" id="customQrFgColor" value="#0f172a" class="w-full h-9 rounded-xl border border-slate-300 cursor-pointer p-1 bg-white">
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Warna Background</label>
              <input type="color" id="customQrBgColor" value="#ffffff" class="w-full h-9 rounded-xl border border-slate-300 cursor-pointer p-1 bg-white">
            </div>
          </div>

          <button type="button" onclick="renderCustomQR()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-xs transition shadow-md shadow-indigo-500/20 flex items-center justify-center gap-2">
            <i class="fa-solid fa-arrows-rotate"></i> Update Preview QR
          </button>
        </div>

        <div class="md:col-span-5 flex flex-col items-center justify-center bg-slate-100 p-5 rounded-2xl border border-slate-200/80 space-y-4">
          <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Preview Canvas QR</span>
          <div class="p-3 bg-white rounded-2xl shadow-lg border border-slate-200/80 flex items-center justify-center">
            <canvas id="customQrCanvas" width="300" height="360" class="max-w-full rounded-lg"></canvas>
          </div>
          <button type="button" onclick="downloadCustomQR()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs transition shadow-md shadow-emerald-600/20 flex items-center justify-center gap-2">
            <i class="fa-solid fa-download"></i> Unduh Gambar QR (PNG)
          </button>
        </div>
      </div>
    </div>

    <!-- FITUR 2: PEMENDEK URL -->
    <div id="sectionPemendekUrl" class="hidden space-y-5">
      <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200/80 space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Masukkan Link Panjang (URL)</label>
          <div class="relative">
            <i class="fa-solid fa-link absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="url" id="inputLongUrl" placeholder="https://candrarubiana79-dotcom.github.io/rekap-kehadiran-nesara/" required
              class="w-full pl-11 pr-4 py-3 bg-white border border-slate-300 rounded-xl text-sm font-medium focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Custom Alias / Suffix Link (Opsional)</label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-mono text-xs font-bold">alias/</span>
            <input type="text" id="inputCustomAlias" oninput="handleAliasInput()" placeholder="contoh: NesaraDigital"
              class="w-full pl-20 pr-4 py-3 bg-white border border-slate-300 rounded-xl text-sm font-medium focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
          </div>
          <div id="aliasStatusMsg" class="mt-2 text-xs font-semibold min-h-[20px]"></div>
        </div>

        <button type="button" id="btnShorten" onclick="processShortenURL()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-xs transition shadow-md shadow-indigo-500/20 flex items-center justify-center gap-2">
          <i class="fa-solid fa-bolt"></i> Pendekkan Link Sekarang
        </button>
      </div>

      <!-- KOTAK HASIL PEMENDEKAN LINK -->
      <div id="shortenResultBox" class="hidden bg-emerald-50 border border-emerald-200/80 p-5 rounded-2xl space-y-3">
        <label class="block text-xs font-bold uppercase tracking-wider text-emerald-800">
          <i class="fa-solid fa-circle-check text-emerald-600 mr-1"></i> Link Berhasil Dipendekkan & Siap Di-Copy:
        </label>
        <div class="flex items-center gap-2">
          <input type="text" id="outputShortUrl" readonly class="w-full px-3.5 py-2.5 bg-white border border-emerald-300 rounded-xl text-sm font-mono font-bold text-emerald-700 focus:outline-none select-all">
          <button type="button" onclick="copyShortUrl()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2.5 rounded-xl text-xs transition flex items-center gap-1.5 whitespace-nowrap shadow-sm">
            <i class="fa-solid fa-copy"></i> Salin Link
          </button>
        </div>
        <button type="button" onclick="sendShortUrlToCustomQR()" class="w-full bg-slate-900 hover:bg-slate-800 text-indigo-300 font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-qrcode text-indigo-400"></i> Buat Kode QR dari Link Ini
        </button>
      </div>
    </div>

  </div>

  <script>
    // URL Cloudflare Worker Kamu
    const MY_WORKER_URL = "https://shortlinknesara.candrarubiana79.workers.dev";

    let uploadedLogoImg = null;
    let aliasStatus = "none";
    let debounceTimer = null;

    document.addEventListener("DOMContentLoaded", () => {
      if (localStorage.getItem("isLoggedIn") !== "true") {
        alert("Akses ditolak! Silakan login terlebih dahulu melalui portal presensi.");
        window.location.href = "imput.html";
        return;
      }
      renderCustomQR();
    });

    function switchMenu(mode) {
      const title = document.getElementById("sectionTitle");
      const secQr = document.getElementById("sectionQrCustom");
      const secUrl = document.getElementById("sectionPemendekUrl");
      const tabQr = document.getElementById("tabQrCustom");
      const tabUrl = document.getElementById("tabPemendekUrl");

      if (mode === 'qr_custom') {
        title.textContent = "Pembuat QR Code Custom";
        secQr.classList.remove("hidden");
        secUrl.classList.add("hidden");
        tabQr.className = "py-2.5 px-2 rounded-xl transition-all text-center flex items-center justify-center gap-2 bg-white text-indigo-600 shadow-sm font-extrabold";
        tabUrl.className = "py-2.5 px-2 rounded-xl transition-all text-center flex items-center justify-center gap-2 text-slate-500 hover:text-slate-800 font-semibold";
      } else {
        title.textContent = "Pemendek Link URL";
        secQr.classList.add("hidden");
        secUrl.classList.remove("hidden");
        tabUrl.className = "py-2.5 px-2 rounded-xl transition-all text-center flex items-center justify-center gap-2 bg-white text-indigo-600 shadow-sm font-extrabold";
        tabQr.className = "py-2.5 px-2 rounded-xl transition-all text-center flex items-center justify-center gap-2 text-slate-500 hover:text-slate-800 font-semibold";
      }
    }

    function handleAliasInput() {
      const alias = document.getElementById("inputCustomAlias").value.trim();
      const statusDiv = document.getElementById("aliasStatusMsg");

      if (!alias) {
        aliasStatus = "none";
        statusDiv.innerHTML = "";
        return;
      }

      if (!/^[a-zA-Z0-9_-]+$/.test(alias)) {
        aliasStatus = "invalid";
        statusDiv.innerHTML = '<span class="text-rose-600 font-bold flex items-center gap-1.5"><i class="fa-solid fa-circle-xmark"></i> Alias hanya boleh berisi huruf, angka, "-" dan "_"</span>';
        return;
      }

      aliasStatus = "checking";
      statusDiv.innerHTML = '<span class="text-slate-500 font-bold flex items-center gap-1.5"><i class="fa-solid fa-spinner fa-spin"></i> Memeriksa ketersediaan link...</span>';

      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(async () => {
        try {
          const res = await fetch(`${MY_WORKER_URL}/?action=check&alias=${encodeURIComponent(alias)}`);
          const data = await res.json();

          if (data.available === true) {
            aliasStatus = "available";
            statusDiv.innerHTML = '<span class="text-emerald-600 font-bold flex items-center gap-1.5"><i class="fa-solid fa-circle-check"></i> Link tersedia</span>';
          } else {
            aliasStatus = "unavailable";
            statusDiv.innerHTML = '<span class="text-rose-600 font-bold flex items-center gap-1.5"><i class="fa-solid fa-circle-xmark"></i> Link tidak tersedia</span>';
          }
        } catch (err) {
          aliasStatus = "unavailable";
          statusDiv.innerHTML = '<span class="text-rose-600 font-bold flex items-center gap-1.5"><i class="fa-solid fa-circle-xmark"></i> Gagal memeriksa ketersediaan link</span>';
        }
      }, 500);
    }

    function previewLogoName() {
      const fileInput = document.getElementById('customQrLogoInput');
      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() { uploadedLogoImg = img; renderCustomQR(); };
          img.src = e.target.result;
        };
        reader.readAsDataURL(fileInput.files[0]);
      }
    }

    function clearCustomLogo() {
      document.getElementById('customQrLogoInput').value = "";
      uploadedLogoImg = null;
      renderCustomQR();
    }

    function renderCustomQR() {
      const content = document.getElementById("customQrContent").value.trim() || "SMPN 1 RANCAH";
      const textTop = document.getElementById("customQrTextTop").value.trim();
      const textBottom = document.getElementById("customQrTextBottom").value.trim();
      const fgColor = document.getElementById("customQrFgColor").value;
      const bgColor = document.getElementById("customQrBgColor").value;
      
      const canvas = document.getElementById("customQrCanvas");
      const ctx = canvas.getContext("2d");
      const width = 300, height = 360;
      canvas.width = width; canvas.height = height;

      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, width, height);

      const tempDiv = document.createElement("div");
      tempDiv.style.display = "none";
      document.body.appendChild(tempDiv);

      const qrSize = 220;
      new QRCode(tempDiv, {
        text: content, width: qrSize, height: qrSize,
        colorDark: fgColor, colorLight: bgColor,
        correctLevel: QRCode.CorrectLevel.H
      });

      setTimeout(() => {
        const qrCanvas = tempDiv.querySelector("canvas");
        const qrImg = tempDiv.querySelector("img");
        const qrX = (width - qrSize) / 2;
        const qrY = textTop ? 60 : 40;

        if (qrCanvas) ctx.drawImage(qrCanvas, qrX, qrY, qrSize, qrSize);
        else if (qrImg) ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);

        if (textTop) {
          ctx.fillStyle = fgColor;
          ctx.font = "bold 15px 'Plus Jakarta Sans', sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(textTop.toUpperCase(), width / 2, 36);
        }

        if (textBottom) {
          ctx.fillStyle = fgColor;
          ctx.font = "bold 13px 'Plus Jakarta Sans', sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(textBottom.toUpperCase(), width / 2, qrY + qrSize + 32);
        }

        if (uploadedLogoImg) {
          const logoSize = 48;
          const logoX = (width - logoSize) / 2;
          const logoY = qrY + (qrSize - logoSize) / 2;

          ctx.beginPath();
          ctx.arc(width / 2, qrY + (qrSize / 2), (logoSize / 2) + 4, 0, 2 * Math.PI, false);
          ctx.fillStyle = bgColor;
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = fgColor;
          ctx.stroke();

          ctx.save();
          ctx.beginPath();
          ctx.arc(width / 2, qrY + (qrSize / 2), logoSize / 2, 0, 2 * Math.PI, false);
          ctx.clip();
          ctx.drawImage(uploadedLogoImg, logoX, logoY, logoSize, logoSize);
          ctx.restore();
        }

        document.body.removeChild(tempDiv);
      }, 100);
    }

    function downloadCustomQR() {
      const canvas = document.getElementById("customQrCanvas");
      const link = document.createElement("a");
      link.download = `QR_CUSTOM_${Date.now()}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    async function processShortenURL() {
      const longUrl = document.getElementById("inputLongUrl").value.trim();
      const customAlias = document.getElementById("inputCustomAlias").value.trim();
      const btn = document.getElementById("btnShorten");
      const resultBox = document.getElementById("shortenResultBox");
      const outputInput = document.getElementById("outputShortUrl");

      if (!longUrl) return alert("Silakan masukkan URL yang valid!");

      if (customAlias) {
        if (aliasStatus === "checking") {
          return alert("Sedang memeriksa ketersediaan alias. Silakan tunggu sebentar!");
        }
        if (aliasStatus === "unavailable") {
          return alert("Gagal: Link tidak tersedia! Silakan gunakan alias nama lain.");
        }
        if (aliasStatus === "invalid") {
          return alert("Gagal: Alias berisi karakter yang tidak diizinkan!");
        }
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';

      try {
        let endpoint = `${MY_WORKER_URL}/?action=create&url=${encodeURIComponent(longUrl)}`;
        if (customAlias) {
          endpoint += `&alias=${encodeURIComponent(customAlias)}`;
        }

        const response = await fetch(endpoint);
        const data = await response.json();

        if (data.shorturl) {
          outputInput.value = data.shorturl;
          resultBox.classList.remove("hidden");
        } else if (data.errormessage) {
          alert("Gagal: " + data.errormessage);
        } else {
          alert("Gagal memendekkan URL!");
        }
      } catch (err) {
        alert("Terjadi kesalahan jaringan atau koneksi diblokir!");
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-bolt"></i> Pendekkan Link Sekarang';
      }
    }

    function copyShortUrl() {
      const copyText = document.getElementById("outputShortUrl");
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      alert("Link pendek berhasil disalin ke clipboard!");
    }

    function sendShortUrlToCustomQR() {
      const shortUrl = document.getElementById("outputShortUrl").value;
      document.getElementById("customQrContent").value = shortUrl;
      switchMenu('qr_custom');
      renderCustomQR();
    }
  </script>
</body>
</html>
